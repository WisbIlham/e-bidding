<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bidaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js?v=20261112d"></script>
  <link rel="stylesheet" href="assets/app.css?v=20261112d">
  <script src="assets/data.js?v=20261112d"></script>
  <script src="assets/store.js?v=20261112d"></script>
  <script src="assets/auction.js?v=20261112d"></script>
  <script src="assets/ui.js?v=20261112d"></script>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 pt-12 md:pt-20 pb-4 min-h-[70vh]" id="app"></main>
  <div id="eb-footer"></div>
  <script>
  EB.init({ area: 'bidder', title: 'Log masuk' });
  (function () {
    const ui = EB.ui, esc = ui.esc;
    const app = document.getElementById('app');
    const $ = id => document.getElementById(id);

    /* Only follow same-site relative paths in ?next (no open redirect) */
    function nextUrl() {
      const n = ui.qs('next');
      return n && /^\/(?!\/)/.test(n) && !/^\/\\/.test(n) ? n : ui.link('shop.html');
    }
    function finish(user, msg) {
      EB.auth.login(user.id);
      ui.toast(msg || ('Selamat datang, ' + user.name + '.'), 'success');
      setTimeout(() => { location.href = nextUrl(); }, 350);
    }

    let tab = ui.qs('tab') === 'daftar' ? 'register' : 'login';
    const t = EB.tenant.current();
    const P = window.EB_DATA.platform.name;

    const field = (id, label, input, hint) => `
      <div>
        <label class="label" for="${id}">${label}</label>
        ${input}
        ${hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ''}
        <p class="field-error hidden" id="${id}-err"></p>
      </div>`;

    app.innerHTML = `
      <div class="mx-auto w-full max-w-[420px]">
        <div class="eyebrow">${esc(t.name)}</div>
        <h1 id="auth-title" class="mt-2 font-serif text-[40px] md:text-[52px] leading-[1.05] tracking-[-0.015em]">Log masuk</h1>
        <p id="auth-sub" class="mt-3 text-[16px] text-[var(--ink-2)]"></p>

        <div id="already"></div>

        <div class="tabs mt-8 !gap-8" role="tablist" aria-label="Log masuk atau daftar">
          <button type="button" data-tab="login" role="tab" id="tab-login" aria-controls="pane-login" class="tab min-h-[48px]">Log masuk</button>
          <button type="button" data-tab="register" role="tab" id="tab-register" aria-controls="pane-register" class="tab min-h-[48px]">Daftar baru</button>
        </div>

        <div id="pane-login" role="tabpanel" aria-labelledby="tab-login" class="mt-8">
          <form id="f-login" novalidate class="space-y-5">
            ${field('l-email', 'E-mel', '<input id="l-email" type="email" class="input" autocomplete="username" placeholder="nama@emel.com" aria-describedby="l-email-err">')}
            ${field('l-pass', 'Katalaluan', '<input id="l-pass" type="password" class="input" autocomplete="current-password" aria-describedby="l-pass-err">', 'Demo: apa-apa katalaluan diterima.')}
            <p id="l-err" class="field-error hidden" role="alert"></p>
            <button class="btn btn-brand btn-lg mt-2 w-full">Log masuk</button>
          </form>

          <div class="mt-14">
            <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
              <h2 class="font-serif text-[24px] leading-tight">Akaun demo</h2>
              <span class="meta">Masuk tanpa katalaluan</span>
            </div>
            <ul id="demo-users" class="mt-3 border-y border-line"></ul>
          </div>
        </div>

        <div id="pane-register" role="tabpanel" aria-labelledby="tab-register" class="mt-8 hidden">
          <form id="f-reg" novalidate class="space-y-5">
            ${field('r-name', 'Nama penuh', '<input id="r-name" class="input" autocomplete="name" placeholder="Nur Aisyah binti Ahmad" aria-describedby="r-name-hint r-name-err">', 'Seperti dalam kad pengenalan. Digunakan pada invois jika anda menang.')}
            ${field('r-phone', 'No. telefon', '<input id="r-phone" type="tel" inputmode="tel" class="input" autocomplete="tel" placeholder="012-345 6789" aria-describedby="r-phone-err">')}
            ${field('r-email', 'E-mel', '<input id="r-email" type="email" class="input" autocomplete="email" placeholder="nama@emel.com" aria-describedby="r-email-err">')}
            ${field('r-pass', 'Katalaluan', '<input id="r-pass" type="password" class="input" autocomplete="new-password" aria-describedby="r-pass-hint r-pass-err">', 'Sekurang-kurangnya 8 aksara.')}
            <p id="r-err" class="field-error hidden" role="alert"></p>
            <button class="btn btn-brand btn-lg mt-2 w-full">Daftar dan log masuk</button>
            <p class="meta">Dengan mendaftar, anda faham bahawa yuran penyertaan <span class="num">${ui.money(t.settings.fee)}</span> setiap lot tidak dikembalikan, dan bidaan yang disahkan tidak boleh dibatalkan.</p>
          </form>
        </div>

        <div class="mt-16 border-t border-line pt-5 text-[14px] text-[var(--muted)]">
          <p>Urus setia:
            <a href="${ui.link('admin/index.html')}" class="inline-flex min-h-[44px] items-center underline underline-offset-4 hover:text-[var(--ink)]">Admin</a></p>
          <p>Demo sahaja. Tiada data dihantar ke pelayan.</p>
        </div>
      </div>`;

    /* ---------- tabs ---------- */
    const COPY = {
      login: ['Log masuk', 'Log masuk untuk membida dan menjejak bidaan anda.'],
      register: ['Daftar akaun pembida', `Percuma. Satu akaun untuk semua kedai di ${P}. Yuran hanya dikenakan apabila anda membida sesuatu lot.`],
    };
    function setTab(k, focus) {
      tab = k;
      document.querySelectorAll('[data-tab]').forEach(b => {
        const on = b.getAttribute('data-tab') === k;
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
      });
      $('pane-login').classList.toggle('hidden', k !== 'login');
      $('pane-register').classList.toggle('hidden', k !== 'register');
      $('auth-title').textContent = COPY[k][0];
      $('auth-sub').textContent = COPY[k][1];
      if (focus) $(k === 'login' ? 'l-email' : 'r-name').focus();
    }
    document.querySelectorAll('[data-tab]').forEach(b => {
      b.onclick = () => setTab(b.getAttribute('data-tab'));
      b.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const k = tab === 'login' ? 'register' : 'login'; setTab(k); $('tab-' + k).focus(); } };
    });
    setTab(tab);

    /* ---------- already logged in ---------- */
    function renderAlready() {
      const u = EB.auth.user();
      $('already').innerHTML = !u ? '' : `
        <div class="tile mt-8 flex flex-col gap-4 p-5">
          <p class="min-w-0 flex-1 text-[15px] text-[var(--ink-2)]">Anda sudah log masuk sebagai <b class="font-medium text-[var(--ink)]">${esc(u.name)}</b>.</p>
          <div class="grid grid-cols-2 gap-2">
            <a href="${esc(nextUrl())}" class="btn btn-brand">Teruskan</a>
            <button type="button" data-out class="btn btn-outline">Log keluar</button>
          </div>
        </div>`;
      const out = $('already').querySelector('[data-out]');
      if (out) out.onclick = () => { EB.auth.logout(); ui.toast('Anda telah log keluar.'); location.reload(); };
    }

    /* ---------- demo bidders: plain rows ---------- */
    let demoSig = '';
    function renderDemo() {
      const users = EB.users.bidders();
      const sig = JSON.stringify(users.map(u => [u.id, u.name, u.email, u.phone]));
      if (sig === demoSig) return;
      demoSig = sig;
      $('demo-users').innerHTML = users.map((u, n) => `
        <li class="flex items-center gap-3 py-4 ${n ? 'border-t border-line' : ''}">
          <div class="min-w-0 flex-1">
            <div class="truncate text-[17px] text-[var(--ink)]">${esc(u.name)}</div>
            <div class="truncate text-[14px] text-[var(--muted)]">${esc(u.email || '')}</div>
          </div>
          <button type="button" data-user="${esc(u.id)}" class="btn btn-outline !min-h-[44px]" aria-label="Masuk sebagai ${esc(u.name)}">Masuk</button>
        </li>`).join('');
    }
    $('demo-users').addEventListener('click', e => {
      const b = e.target.closest('[data-user]');
      if (!b) return;
      finish(EB.users.byId(b.getAttribute('data-user')));
    });

    /* ---------- field errors (written under each field) ---------- */
    function setErr(id, msg) {
      const el = $(id + '-err');
      el.textContent = msg || '';
      el.classList.toggle('hidden', !msg);
      const input = $(id);
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    }
    const err = (id, msg) => { const el = $(id); el.innerHTML = msg || ''; el.classList.toggle('hidden', !msg); };
    ['l-email', 'l-pass', 'r-name', 'r-phone', 'r-email', 'r-pass'].forEach(id => $(id).addEventListener('input', () => { setErr(id, ''); err(id[0] + '-err', ''); }));
    const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    /* Malaysian mobile: 01X-XXX XXXX (10 digits) or 011-XXXX XXXX (11 digits); +60 / 60 accepted */
    const phoneDigits = v => { let d = String(v || '').replace(/\D/g, ''); if (/^60(1\d{8,9})$/.test(d)) d = '0' + d.slice(2); return d; };
    const phoneOk = v => /^01\d{8,9}$/.test(phoneDigits(v));
    const phoneFmt = v => { const d = phoneDigits(v); return !phoneOk(v) ? String(v || '').trim() : d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + ' ' + d.slice(6) : d.slice(0, 3) + '-' + d.slice(3, 7) + ' ' + d.slice(7); };
    $('r-phone').addEventListener('blur', e => { e.target.value = phoneFmt(e.target.value); });

    /* ---------- email login ---------- */
    $('f-login').addEventListener('submit', e => {
      e.preventDefault();
      err('l-err', '');
      const email = $('l-email').value.trim().toLowerCase();
      const pass = $('l-pass').value;
      const errs = {};
      if (!email) errs['l-email'] = 'Masukkan e-mel anda.';
      else if (!EMAIL.test(email)) errs['l-email'] = 'Format e-mel tidak sah. Contoh: nama@emel.com';
      if (!pass) errs['l-pass'] = 'Masukkan katalaluan anda.';
      ['l-email', 'l-pass'].forEach(id => setErr(id, errs[id]));
      const firstBad = Object.keys(errs)[0];
      if (firstBad) { $(firstBad).focus(); return; }
      const u = EB.users.bidders().find(x => String(x.email || '').toLowerCase() === email);
      if (!u) {
        setErr('l-email', 'Tiada akaun dengan e-mel ini.');
        err('l-err', 'Semak ejaan e-mel, cuba akaun demo di bawah, atau <button type="button" data-goreg class="btn-link">daftar akaun baru</button>.');
        $('l-email').focus();
        return;
      }
      finish(u);
    });
    $('l-err').addEventListener('click', e => { if (e.target.closest('[data-goreg]')) { $('r-email').value = $('l-email').value.trim(); setTab('register', true); } });

    /* ---------- register ---------- */
    let submitted = false;
    $('f-reg').addEventListener('submit', e => {
      e.preventDefault();
      const v = id => $(id).value.trim();
      const name = v('r-name'), email = v('r-email').toLowerCase(), phone = v('r-phone'), pass = $('r-pass').value;
      const s = EB.store.get();
      const errs = {};
      if (!name) errs['r-name'] = 'Masukkan nama penuh anda.';
      else if (name.length < 3) errs['r-name'] = 'Nama terlalu pendek. Tulis nama penuh seperti dalam kad pengenalan.';
      if (!phone) errs['r-phone'] = 'Masukkan no. telefon.';
      else if (!phoneOk(phone)) errs['r-phone'] = 'No. telefon bimbit tidak sah. Contoh: 012-345 6789';
      if (!email) errs['r-email'] = 'Masukkan e-mel anda.';
      else if (!EMAIL.test(email)) errs['r-email'] = 'Format e-mel tidak sah. Contoh: nama@emel.com';
      else if (s.users.some(u => String(u.email || '').toLowerCase() === email)) errs['r-email'] = 'E-mel ini sudah didaftarkan. Sila log masuk.';
      if (!pass) errs['r-pass'] = 'Cipta katalaluan.';
      else if (pass.length < 8) errs['r-pass'] = 'Katalaluan mesti sekurang-kurangnya 8 aksara.';
      ['r-name', 'r-phone', 'r-email', 'r-pass'].forEach(id => setErr(id, errs[id]));
      const bad = Object.keys(errs);
      err('r-err', bad.length > 1 ? `Sila betulkan ${bad.length} ruangan di atas.` : '');
      if (bad.length) { $(bad[0]).focus(); return; }
      if (submitted) return; // one account (and one CompleteRegistration) per submit, even on a double tap
      submitted = true;
      const user = { id: EB.store.uid('u'), role: 'bidder', name, email, phone: phoneFmt(phone), createdAt: Date.now() };
      EB.store.update(st => {
        st.users.push(user);
        st.inbox.push({ id: EB.store.uid('msg'), userId: user.id, tenant: EB.tenant.slug(), type: 'info', title: 'Selamat datang ke ' + EB.tenant.current().name, body: 'Akaun anda telah berjaya didaftarkan. Selamat membida.', itemId: null, at: Date.now(), read: false });
      });
      if (EB.pixel) EB.pixel.track('CompleteRegistration', { content_name: 'Daftar pembida' });
      finish(user, 'Akaun didaftarkan. Selamat datang, ' + name + '.');
    });

    renderAlready();
    renderDemo();
    EB.store.subscribe((_, src) => { if (src !== 'auth') renderDemo(); });
  })();
  </script>
</body>
</html>
