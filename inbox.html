<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peti masuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js?v=20261112d"></script>
  <link rel="stylesheet" href="assets/app.css?v=20261112d">
  <script src="assets/data.js?v=20261112d"></script>
  <script src="assets/store.js?v=20261112d"></script>
  <script src="assets/auction.js?v=20261112d"></script>
  <script src="assets/ui.js?v=20261112d"></script>
  <style>
    #app > * { max-width: 56rem; } /* page edge lines up with the header; reading width stays narrow */
    .msg-row { border-radius: 8px; }
    .msg-row:hover { background: color-mix(in srgb, var(--tile) 60%, var(--surface)); }
    .msg-row[aria-expanded="true"], .msg-row[aria-expanded="true"]:hover { background: transparent; }
    .msg-list > li + li { border-top: 1px solid var(--line); }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8" id="app"></main>
  <div id="eb-footer"></div>
  <script>
    EB.init({ area: 'bidder', active: 'inbox', title: 'Peti masuk' });
    const U = EB.ui;
    let filter = 'all';
    const open = new Set();

    /* label + state colour per message type (colour only where it signals a state) */
    const TYPES = {
      info:    { label: 'Makluman',      tone: '' },
      fee:     { label: 'Yuran',         tone: '' },
      bid:     { label: 'Bidaan',        tone: '' },
      outbid:  { label: 'Dilepasi',      tone: 'text-[var(--live)]' },
      won:     { label: 'Menang',        tone: 'text-[var(--ok)]' },
      lost:    { label: 'Tidak berjaya', tone: '' },
      ending:  { label: 'Hampir tamat',  tone: 'text-[var(--warn)]' },
      paid:    { label: 'Bayaran',       tone: 'text-[var(--ok)]' },
      expired: { label: 'Luput',         tone: 'text-[var(--warn)]' },
    };
    const typeOf = k => TYPES[k] || TYPES.info;

    /* "14:32" today, "11 Nov" this year, otherwise "11/11/25" */
    function stamp(ts) {
      const d = new Date(ts), now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: false });
      if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' });
      return d.toLocaleDateString('ms-MY', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    function loginNote(msg) {
      return `<div class="tile px-6 py-10 md:px-10 md:py-12">
        <p class="font-serif text-[22px] md:text-[26px] leading-snug text-ink">${msg}</p>
        <a href="${U.link('login.html', { next: location.pathname + location.search + location.hash })}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Log masuk</a>
      </div>`;
    }

    function markRead(ids) {
      EB.store.update(s => { s.inbox.forEach(m => { if (ids.includes(m.id)) m.read = true; }); });
    }

    const chevron = up => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="${up ? 'M4 10l4-4 4 4' : 'M4 6l4 4 4-4'}"/></svg>`;

    function msgRow(m, s, uid) {
      const ty = typeOf(m.type);
      const isOpen = open.has(m.id);
      const item = m.itemId ? s.items.find(i => i.id === m.itemId) : null;
      let extra = '';
      if (item) {
        const order = s.orders.filter(o => o.itemId === item.id && o.userId === uid && o.status !== 'passed').sort((a, b) => b.createdAt - a.createdAt)[0];
        const payable = order && order.status === 'unpaid' && Date.now() <= order.dueAt;
        const paid = order && order.status === 'paid';
        extra = `<div class="tile mt-5 p-4 sm:p-5">
          <div class="flex items-center gap-4">
            <img src="${U.itemImage(item)}" alt="" class="h-[60px] w-12 rounded-lg object-cover bg-[var(--surface)] shrink-0">
            <div class="min-w-0 flex-1"><div class="lot">${U.lotNo(item)}</div><div class="lot-title mt-0.5 text-[17px] text-ink line-clamp-2">${U.esc(item.title)}</div>
              ${(m.type === 'won' || m.type === 'paid') && paid ? `<p class="meta mt-0.5"><span class="text-[var(--ok)]">Dibayar</span>${order.method ? ' · ' + U.esc(order.method) : ''}${order.ref ? ' · Ruj <span class="tabular-nums">' + U.esc(order.ref) + '</span>' : ''}</p>` : ''}
            </div>
          </div>
          <div class="mt-4 flex flex-col sm:flex-row sm:items-center gap-x-6 gap-y-2">
            ${m.type === 'won' && payable ? `<a href="${U.link('checkout.html', { order: order.id })}" class="btn btn-brand w-full sm:w-auto md:!min-h-[44px]">Bayar sekarang</a>` : ''}
            ${(m.type === 'won' || m.type === 'paid') && paid ? `<a href="${U.link('checkout.html', { order: order.id })}" class="btn btn-outline w-full sm:w-auto md:!min-h-[44px]">Lihat resit</a>` : ''}
            <a href="${U.link('item.html', { id: item.id })}" class="link-arrow min-h-[44px]">Lihat item</a>
          </div>
        </div>`;
      }
      return `<li>
        <button data-msg="${U.esc(m.id)}" class="msg-row w-full text-left grid grid-cols-[8px_minmax(0,1fr)_auto] gap-x-3 sm:gap-x-4 px-2 sm:px-3 py-4" aria-expanded="${isOpen}">
          <span class="pt-[29px]">${m.read ? '' : '<span class="block h-2 w-2 rounded-full bg-ink" aria-label="Belum dibaca"></span>'}</span>
          <span class="min-w-0">
            <span class="eyebrow ${ty.tone}">${ty.label}</span>
            <span class="mt-0.5 block truncate text-[17px] leading-snug ${m.read ? 'text-ink-2' : 'font-medium text-ink'}">${U.esc(m.title)}</span>
            ${isOpen ? '' : `<span class="mt-0.5 block truncate text-[15px] text-muted">${U.esc(m.body)}</span>`}
          </span>
          <span class="flex flex-col items-end gap-2 pt-[2px]">
            <span class="tabular-nums text-[14px] ${m.read ? 'text-muted' : 'text-ink'}" title="${U.fmtDate(m.at)}">${stamp(m.at)}</span>
            <span class="text-ink-2">${chevron(isOpen)}</span>
          </span>
        </button>
        ${isOpen ? `<div class="pl-[28px] sm:pl-[36px] pr-2 sm:pr-3 pb-6 -mt-1">
          <p class="text-[16px] text-ink-2 leading-relaxed">${U.esc(m.body)}</p>
          <p class="mt-2 tabular-nums text-[14px] text-muted">${U.fmtDate(m.at)}</p>
          ${extra}
        </div>` : ''}
      </li>`;
    }

    function render() {
      const app = document.getElementById('app');
      const user = EB.auth.user();
      const t = EB.tenant.current();
      const head = (meta, right) => `<header class="mb-8 md:mb-12 flex flex-wrap items-end gap-x-6 gap-y-4">
          <div class="min-w-0">
            <h1 class="font-serif text-[30px] md:text-[40px] font-normal leading-[1.1] text-ink">Peti masuk</h1>
            <p class="mt-2 text-[16px] text-muted">${meta}</p>
          </div>
          ${right || ''}
        </header>`;
      if (!user) {
        app.innerHTML = head(U.esc(t.name)) + loginNote('Log masuk untuk melihat notifikasi bidaan, kemenangan dan bayaran anda.');
        return;
      }
      const s = EB.store.get();
      const all = s.inbox.filter(m => m.userId === user.id && m.tenant === t.slug).sort((a, b) => b.at - a.at);
      const unread = all.filter(m => !m.read);
      const counts = {};
      all.forEach(m => { counts[m.type] = (counts[m.type] || 0) + 1; });
      if (filter !== 'all' && filter !== 'unread' && !counts[filter]) filter = 'all';
      const list = filter === 'all' ? all : filter === 'unread' ? all.filter(m => !m.read || open.has(m.id)) : all.filter(m => m.type === filter);

      const tabBtn = (k, label, n) => `<button data-filter="${k}" role="tab" class="tab" aria-selected="${filter === k}">${label}<span class="count">${n}</span></button>`;

      const meta = `${U.esc(t.name)} · ${unread.length ? `<span class="tabular-nums text-ink">${unread.length}</span> belum dibaca daripada <span class="tabular-nums">${all.length}</span>` : `Semua <span class="tabular-nums">${all.length}</span> mesej telah dibaca`}`;
      const readAll = `<button data-readall class="btn btn-outline btn-sm !min-h-[44px] sm:ml-auto" ${unread.length ? '' : 'disabled'}>Tandakan semua dibaca</button>`;

      let empty;
      const emptyText = txt => `<p class="font-serif text-[22px] md:text-[26px] leading-snug text-ink">${txt}</p>`;
      if (!all.length) empty = emptyText('Belum ada mesej.') + `<p class="mt-2 text-[16px] text-muted">Notifikasi bidaan, kemenangan dan bayaran akan dipaparkan di sini.</p><a href="${U.link('shop.html')}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Lihat item lelongan</a>`;
      else if (filter === 'unread') empty = emptyText('Tiada mesej yang belum dibaca.') + `<button data-filter="all" class="link-arrow mt-4 min-h-[44px]">Lihat semua mesej</button>`;
      else empty = emptyText('Tiada mesej untuk tapisan ini.') + `<button data-filter="all" class="link-arrow mt-4 min-h-[44px]">Lihat semua mesej</button>`;

      app.innerHTML = head(meta, readAll) + `
        <nav class="tabs" role="tablist" aria-label="Tapis mesej">
          ${tabBtn('all', 'Semua', all.length)}
          ${tabBtn('unread', 'Belum dibaca', unread.length)}
          ${Object.keys(TYPES).filter(k => counts[k]).map(k => tabBtn(k, typeOf(k).label, counts[k])).join('')}
        </nav>
        ${list.length
          ? `<ul class="msg-list mt-2 border-b border-line">${list.map(m => msgRow(m, s, user.id)).join('')}</ul>`
          : `<div class="tile mt-6 px-6 py-12 md:py-16 text-center">${empty}</div>`}`;

      app.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
      app.querySelectorAll('[data-msg]').forEach(b => b.onclick = () => {
        const id = b.dataset.msg;
        if (open.has(id)) { open.delete(id); render(); return; }
        open.add(id);
        const m = all.find(x => x.id === id);
        if (m && !m.read) markRead([id]); else render(); // markRead triggers render via subscribe
      });
      const ra = app.querySelector('[data-readall]');
      if (ra) ra.onclick = () => { markRead(unread.map(m => m.id)); U.toast('Semua mesej ditandakan dibaca.', 'success'); };
    }

    render();
    EB.store.subscribe(render);
  </script>
</body>
</html>
