<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js?v=20261112c"></script>
  <link rel="stylesheet" href="assets/app.css?v=20261112c">
  <script src="assets/data.js?v=20261112c"></script>
  <script src="assets/store.js?v=20261112c"></script>
  <script src="assets/auction.js?v=20261112c"></script>
  <script src="assets/ui.js?v=20261112c"></script>
  <style>
    section[id] { scroll-margin-top: 120px; }
    .input:disabled { background: var(--tile); border-color: transparent; color: var(--ink-2); cursor: not-allowed; -webkit-text-fill-color: var(--ink-2); opacity: 1; }
    .side-link { display: block; padding: .6rem 0 .6rem 1rem; font-size: 16px; color: var(--muted); border-left: 2px solid var(--line); }
    .side-link:hover { color: var(--ink); }
    .side-link[aria-current="true"] { color: var(--ink); border-left-color: var(--ink); }
    .pf-check { width: 20px; height: 20px; accent-color: var(--ink); }
    .pf-sec + .pf-sec { border-top: 1px solid var(--line); }
    @media (max-width: 767px) {
      .side-link { display: inline-flex; align-items: center; min-height: 48px; padding: 0; border-left: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
      .side-link[aria-current="true"] { border-bottom-color: var(--ink); }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8" id="app"></main>
  <div id="eb-footer"></div>
  <script>
    EB.init({ area: 'bidder', active: 'account', title: 'Profil' });
    const U = EB.ui;

    function setErr(input, msg) {
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
      let e = input.parentElement.querySelector('.field-error');
      if (msg) {
        if (!e) { e = document.createElement('div'); e.className = 'field-error'; e.id = 'err-' + input.id; input.parentElement.appendChild(e); input.setAttribute('aria-describedby', e.id); }
        e.textContent = msg;
      } else if (e) { e.remove(); input.removeAttribute('aria-describedby'); }
      return !msg;
    }

    function statsHtml() {
      const s = EB.store.get();
      const uid = EB.auth.userId();
      const here = EB.tenant.slug();
      const bids = s.bids.filter(b => b.userId === uid && b.tenant === here);
      const wins = s.orders.filter(o => o.userId === uid && o.status !== 'passed' && o.tenant === here);
      const fees = s.fees.filter(f => f.userId === uid && f.tenant === here);
      const feeSum = fees.reduce((a, f) => a + f.amount, 0);
      const cell = (label, val, cls) => `<div class="min-w-0 ${cls}"><div class="eyebrow">${label}</div><div class="price mt-2 text-[28px] md:text-[34px] text-ink whitespace-nowrap">${val}</div></div>`;
      const perShop = [].map(t => ({
        t,
        bids: bids.filter(b => b.tenant === t.slug).length,
        wins: wins.filter(o => o.tenant === t.slug).length,
        fees: fees.filter(f => f.tenant === t.slug).reduce((a, f) => a + f.amount, 0),
      })).filter(r => r.bids || r.wins || r.fees);
      return `<div class="tile grid grid-cols-2 sm:grid-cols-3 gap-x-5 gap-y-6 px-5 py-6 md:px-7 md:py-7">
          ${cell('Bidaan', bids.length, '')}
          ${cell('Menang', wins.length, '')}
          ${cell('Yuran dibayar', U.money(feeSum), 'col-span-2 sm:col-span-1')}
        </div>
        ${perShop.length ? `<div class="mt-6 overflow-x-auto"><table class="table">
          <thead><tr><th class="!pl-0">Kedai</th><th class="!text-right">Bidaan</th><th class="!text-right">Menang</th><th class="!text-right !pr-0">Yuran</th></tr></thead>
          <tbody>${perShop.map(r => `<tr>
            <td class="text-ink !pl-0">${U.esc(r.t.name)}</td>
            <td class="num tabular-nums">${r.bids}</td><td class="num tabular-nums">${r.wins}</td><td class="num tabular-nums whitespace-nowrap !pr-0">${U.money(r.fees)}</td></tr>`).join('')}</tbody>
        </table></div>` : `<div class="mt-5"><p class="meta">Belum ada aktiviti bidaan.</p><a class="link-arrow min-h-[44px]" href="${U.link('shop.html')}">Lihat item lelongan</a></div>`}
        <p class="meta mt-3">Statistik bidaan anda di sini.</p>`;
    }

    const NAV = [['profil', 'Profil'], ['katalaluan', 'Katalaluan'], ['statistik', 'Statistik']];

    function setActive(id) {
      document.querySelectorAll('[data-side]').forEach(a => a.setAttribute('aria-current', String(a.dataset.side === id)));
    }

    function render() {
      const app = document.getElementById('app');
      const user = EB.auth.user();
      const head = meta => `<header class="mb-8 md:mb-12">
          <h1 class="font-serif text-[30px] md:text-[40px] font-normal leading-[1.1] text-ink">Akaun saya</h1>
          <p class="mt-2 text-[16px] text-muted break-words">${meta}</p>
        </header>`;
      if (!user) {
        app.innerHTML = head(U.esc(EB.tenant.current().name)) + `<div class="tile max-w-xl px-6 py-10 md:px-10 md:py-12">
          <p class="font-serif text-[22px] md:text-[26px] leading-snug text-ink">Log masuk untuk melihat dan mengemas kini profil anda.</p>
          <a href="${U.link('login.html', { next: location.pathname + location.search + location.hash })}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Log masuk</a></div>`;
        return;
      }
      app.innerHTML = head(`<span data-p-name class="text-ink-2">${U.esc(user.name)}</span> · <span data-p-email>${U.esc(user.email || '-')}</span> · <span data-p-phone class="tabular-nums">${U.esc(user.phone || '-')}</span> · ID <span class="tabular-nums">${U.esc(user.id)}</span>`) + `
        <div class="md:grid md:grid-cols-[180px_minmax(0,1fr)] md:gap-14 items-start">
          <nav aria-label="Bahagian akaun" class="mb-2 md:mb-0 md:sticky md:top-28 flex gap-6 md:block border-b border-line md:border-b-0 overflow-x-auto no-scrollbar">
            ${NAV.map(([id, l]) => `<a href="#${id}" data-side="${id}" class="side-link" aria-current="false">${l}</a>`).join('')}
          </nav>

          <div class="min-w-0 max-w-3xl">
            <section id="profil" class="pf-sec py-8 md:pt-0 md:pb-12" aria-labelledby="h-profil">
              <h2 id="h-profil" class="font-serif text-[24px] md:text-[28px] font-normal leading-tight text-ink">Profil</h2>
              <p class="meta mt-1">Anda boleh menukar e-mel dan no. telefon sahaja.</p>
              <form id="pf" novalidate class="mt-6 grid sm:grid-cols-2 gap-x-4 gap-y-5">
                <div><label class="label" for="p-name">Nama penuh</label><input id="p-name" class="input" value="${U.esc(user.name)}" disabled></div>
                <div><label class="label" for="p-kat">Kategori</label><input id="p-kat" class="input" value="Individu" disabled></div>
                <div><label class="label" for="p-email">E-mel</label><input id="p-email" name="email" type="email" class="input" value="${U.esc(user.email || '')}" autocomplete="email"></div>
                <div><label class="label" for="p-phone">No. telefon</label><input id="p-phone" name="phone" class="input" value="${U.esc(user.phone || '')}" inputmode="tel" autocomplete="tel"></div>
                <div class="sm:col-span-2">
                  <span class="status status-ok">Identiti disahkan</span>
                  <p class="meta mt-1">Untuk menukar nama, No. KP atau kategori, hubungi pentadbir kedai bersama salinan dokumen pengenalan diri.</p>
                </div>
                <div class="sm:col-span-2 pt-1"><button class="btn btn-brand btn-lg w-full sm:w-auto">Simpan perubahan</button></div>
              </form>
            </section>

            <section id="katalaluan" class="pf-sec py-8 md:py-12" aria-labelledby="h-pw">
              <h2 id="h-pw" class="font-serif text-[24px] md:text-[28px] font-normal leading-tight text-ink">Katalaluan</h2>
              <p class="meta mt-1">Sekurang-kurangnya 8 aksara. Gabungkan huruf besar, huruf kecil, nombor dan simbol.</p>
              <form id="pw" novalidate class="mt-6 grid gap-y-5 max-w-sm">
                <div><label class="label" for="pw-cur">Katalaluan semasa</label><input id="pw-cur" name="cur" type="password" class="input" autocomplete="current-password"></div>
                <div>
                  <label class="label" for="pw-new">Katalaluan baharu</label><input id="pw-new" name="nw" type="password" class="input" autocomplete="new-password">
                  <div class="mt-2 h-[3px] bg-line" data-meter aria-hidden="true"><span class="block h-full" style="width:0"></span></div>
                  <div class="mt-1 text-[14px] text-muted" data-meter-label aria-live="polite">&nbsp;</div>
                </div>
                <div><label class="label" for="pw-conf">Sahkan katalaluan baharu</label><input id="pw-conf" name="conf" type="password" class="input" autocomplete="new-password"></div>
                <label class="inline-flex min-h-[44px] items-center gap-3 text-[16px] text-ink-2 cursor-pointer"><input type="checkbox" data-show class="pf-check"> Tunjuk katalaluan</label>
                <div><button class="btn btn-brand btn-lg w-full sm:w-auto">Tukar katalaluan</button></div>
              </form>
            </section>

            <section id="statistik" class="pf-sec py-8 md:py-12" aria-labelledby="h-stat">
              <h2 id="h-stat" class="font-serif text-[24px] md:text-[28px] font-normal leading-tight text-ink">Statistik bidaan</h2>
              <div id="stats" class="mt-6">${statsHtml()}</div>
            </section>
          </div>
        </div>`;
      bind(user);
      setActive((location.hash || '#profil').slice(1));
      app.querySelectorAll('[data-side]').forEach(a => a.addEventListener('click', () => setActive(a.dataset.side)));
    }

    function bind(user) {
      const pf = document.getElementById('pf');
      pf.elements.email.addEventListener('input', () => setErr(pf.elements.email, ''));
      pf.elements.phone.addEventListener('input', () => setErr(pf.elements.phone, ''));
      pf.addEventListener('submit', e => {
        e.preventDefault();
        const email = pf.elements.email.value.trim();
        const phone = pf.elements.phone.value.trim();
        const taken = EB.store.get().users.some(u => u.id !== user.id && String(u.email || '').toLowerCase() === email.toLowerCase());
        let ok = setErr(pf.elements.email, !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? 'Format e-mel tidak sah. Contoh: nama@contoh.my.' : taken ? 'E-mel ini sudah digunakan oleh akaun lain.' : '');
        ok = setErr(pf.elements.phone, /^\+?\d{9,12}$/.test(phone.replace(/[\s-]/g, '')) ? '' : 'No. telefon tidak sah. Contoh: 012-345 6789.') && ok;
        if (!ok) { pf.querySelector('[aria-invalid="true"]').focus(); return; }
        if (email === (user.email || '') && phone === (user.phone || '')) { U.toast('Tiada perubahan untuk disimpan.'); return; }
        EB.store.update(s => { const u = s.users.find(x => x.id === user.id); if (u) { u.email = email; u.phone = phone; } });
        user.email = email; user.phone = phone;
        document.querySelector('[data-p-email]').textContent = email;
        document.querySelector('[data-p-phone]').textContent = phone;
        U.toast('Profil berjaya dikemas kini.', 'success');
      });

      const pw = document.getElementById('pw');
      const bar = pw.querySelector('[data-meter] span');
      const mLabel = pw.querySelector('[data-meter-label]');
      const TONES = ['var(--live)', 'var(--live)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
      pw.elements.nw.addEventListener('input', () => {
        const v = pw.elements.nw.value;
        let sc = 0;
        if (v.length >= 8) sc++;
        if (/[a-z]/.test(v) && /[A-Z]/.test(v)) sc++;
        if (/\d/.test(v)) sc++;
        if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) sc++;
        if (v.length < 8) sc = Math.min(sc, 1);
        const pct = !v ? 0 : Math.max(10, sc * 25);
        bar.style.width = pct + '%';
        bar.style.background = TONES[sc];
        mLabel.style.color = v ? TONES[sc] : '';
        mLabel.textContent = !v ? ' ' : v.length < 8 ? 'Terlalu pendek (' + v.length + '/8)' : ['Lemah', 'Lemah', 'Sederhana', 'Baik', 'Kuat'][sc];
      });
      ['cur', 'nw', 'conf'].forEach(n => pw.elements[n].addEventListener('input', () => setErr(pw.elements[n], '')));
      pw.querySelector('[data-show]').addEventListener('change', e => {
        ['cur', 'nw', 'conf'].forEach(n => { pw.elements[n].type = e.target.checked ? 'text' : 'password'; });
      });
      pw.addEventListener('submit', e => {
        e.preventDefault();
        const cur = pw.elements.cur.value, nw = pw.elements.nw.value, conf = pw.elements.conf.value;
        let ok = setErr(pw.elements.cur, cur ? '' : 'Sila masukkan katalaluan semasa.');
        ok = setErr(pw.elements.nw, nw.length >= 8 ? (nw === cur ? 'Katalaluan baharu mesti berbeza daripada katalaluan semasa.' : '') : 'Katalaluan baharu mesti sekurang-kurangnya 8 aksara.') && ok;
        ok = setErr(pw.elements.conf, conf && conf === nw ? '' : 'Pengesahan katalaluan tidak sepadan.') && ok;
        if (!ok) { pw.querySelector('[aria-invalid="true"]').focus(); return; }
        pw.reset();
        pw.elements.nw.dispatchEvent(new Event('input'));
        ['cur', 'nw', 'conf'].forEach(n => { pw.elements[n].type = 'password'; });
        U.toast('Katalaluan berjaya ditukar (demo).', 'success');
      });
    }

    render();
    // only refresh the stats on live updates, so typing in the forms is never lost
    EB.store.subscribe((_, src) => {
      if (src === 'auth') { render(); return; }
      const st = document.getElementById('stats');
      if (st && EB.auth.user()) st.innerHTML = statsHtml();
    });
    window.addEventListener('hashchange', () => setActive(location.hash.slice(1)));
    if (location.hash) {
      const target = document.querySelector(location.hash);
      if (target) setTimeout(() => { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); const f = target.querySelector('input:not([disabled])'); if (f) f.focus({ preventScroll: true }); }, 60);
    }
  </script>
</body>
</html>
