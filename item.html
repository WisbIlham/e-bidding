<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bidaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js?v=20261112d"></script>
  <link rel="stylesheet" href="assets/app.css?v=20261112d">
  <script src="assets/data.js?v=20261112d"></script>
  <script src="assets/store.js?v=20261112d"></script>
  <script src="assets/auction.js?v=20261112d"></script>
  <script src="assets/ui.js?v=20261112d"></script>
  <script src="assets/media.js?v=20261112d"></script>
  <script src="assets/pay.js?v=20261112d"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .gal-surface { background: var(--tile); }
    .thumb { background: var(--tile); }
    .thumb[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
    .thumb:not([aria-current="true"]) img { opacity: .7; }
    .thumb:hover img { opacity: 1; }
    .hist thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
    .quick[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .text-ok { color: var(--ok); }
    .text-warn { color: var(--warn); }
    .mbar { padding-bottom: env(safe-area-inset-bottom); }
    /* bid panel: value first, label underneath (spec-sheet style) */
    .spec { display: flex; flex-direction: column-reverse; justify-content: flex-end; }
    .spec-l { margin-top: .3rem; font-size: 14px; color: var(--muted); }
    .rules dt { font-family: var(--font-display); font-size: 18px; font-weight: 400; color: var(--ink); }
    @media (max-width: 767px) { body.has-mbar #eb-footer { padding-bottom: calc(68px + env(safe-area-inset-bottom)); } }
    #gal-main, #gal-poster { touch-action: pan-y; }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 pt-5 md:pt-8 pb-4 min-h-[70vh]" id="app"></main>
  <div id="eb-footer"></div>
  <script>
  (function () {
    const ui = EB.ui, A = EB.auction, esc = ui.esc;
    const itemId = ui.qs('id');
    const first = EB.store.get().items.find(i => i.id === itemId);

    // Item belongs to another shop → reload under that shop so branding matches
    if (first && first.tenant !== EB.tenant.slug()) {
      location.replace(ui.link('item.html', { id: itemId, shop: first.tenant }));
      return;
    }

    EB.init({ area: 'bidder', active: 'bids', title: first ? first.title : 'Item' });
    const app = document.getElementById('app');

    /* ---------- icons (16px, stroke 1.5) ---------- */
    const ICONS = {
      heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
      left: '<path d="m15 18-6-6 6-6"/>',
      right: '<path d="m9 18 6-6-6-6"/>',
    };
    const ic = (n, cls, fill) => `<svg class="${cls || 'h-4 w-4'}" viewBox="0 0 24 24" fill="${fill || 'none'}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

    // every amount on screen uses the full format "RM 14,500.00"
    const money = ui.money;
    // compact form ONLY for the quick-increment buttons so 3 fit across at 360px: "+RM 1,000"
    const compact = n => 'RM ' + Number(n || 0).toLocaleString('en-MY', { maximumFractionDigits: 2 });
    // real photos (admin upload / item.images) or 4 generated placeholders
    const imgCount = it => ((it.photo ? 1 : 0) + (it.images || []).length) || 4;

    if (!first) {
      app.innerHTML = `
        <div class="mx-auto max-w-xl py-12 md:py-24">
          <div class="eyebrow">Ralat 404</div>
          <h1 class="mt-2 font-serif text-[36px] md:text-[48px] leading-[1.05]">Lot tidak dijumpai</h1>
          <p class="mt-3 text-[16px] text-[var(--ink-2)]">Lot ini mungkin telah dipadam oleh penjual, atau pautan yang anda buka tidak lengkap.</p>
          <a href="${ui.link('shop.html')}" class="btn btn-brand btn-lg mt-8">Kembali ke katalog</a>
        </div>`;
      return;
    }

    /* ---------- layout (mobile: gallery → head + bid panel → details → history → rules) ---------- */
    app.innerHTML = `
      <nav id="crumb" class="-mt-2.5 mb-1.5 flex min-w-0 items-center gap-2 text-[14px] text-[var(--muted)] md:mb-3.5" aria-label="Laluan"></nav>
      <div class="flex flex-col gap-12 md:grid md:grid-cols-12 md:items-start md:gap-x-10 lg:gap-x-16">
        <div class="contents md:col-span-6 md:flex md:flex-col md:gap-16 lg:col-span-7">
          <div id="gallery" class="order-1"></div>
          <div id="story" class="order-3 empty:hidden"></div>
          <div id="details" class="order-4"></div>
          <div id="history" class="order-5 scroll-mt-24 md:scroll-mt-32"></div>
        </div>
        <div class="contents md:col-span-6 md:flex md:flex-col md:gap-10 lg:col-span-5">
          <div class="order-2 flex flex-col gap-8">
            <div id="head"></div>
            <div class="elevated scroll-mt-20 md:scroll-mt-32" id="bidpanel">
              <div id="live"></div>
              <div id="bidbox" class="border-t border-line p-5 sm:p-6">
                <div id="bidstate"></div>
                <form id="bidform" novalidate>
                  <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5">
                    <label class="label !mb-0 whitespace-nowrap" for="amt">Amaun bidaan anda</label>
                    <span id="feeNote" class="text-[12px]"></span>
                  </div>
                  <div class="relative mt-2">
                    <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[16px] text-[var(--muted)]">RM</span>
                    <input id="amt" type="number" inputmode="decimal" autocomplete="off" class="input num !min-h-[54px] !pl-12 !text-[22px]" aria-describedby="bidhint biderr">
                  </div>
                  <div id="quick" class="mt-3 grid grid-cols-3 gap-2" aria-label="Pilih amaun cepat"></div>
                  <p id="bidhint" class="hint"></p>
                  <p id="biderr" class="field-error hidden" role="alert"></p>
                  <button id="bidbtn" type="submit" class="btn btn-brand btn-lg mt-4 w-full"></button>
                  <p class="meta mt-3 text-center">Bidaan muktamad: tidak boleh dibatalkan selepas disahkan.</p>
                </form>
              </div>
            </div>
            <div id="benef"></div>
          </div>
          <div id="rules" class="order-6 md:mt-4"></div>
        </div>
      </div>
      <div id="mbar" class="mbar fixed inset-x-0 bottom-0 z-40 border-t border-line bg-white md:hidden" hidden>
        <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-2.5">
          <div class="min-w-0 flex-1">
            <div class="truncate text-[13px] text-[var(--muted)]"><span id="mbar-label">Bidaan tertinggi</span> · <span id="mbar-time" class="num text-[var(--ink)]"></span></div>
            <div id="mbar-price" class="price whitespace-nowrap text-[22px]"></div>
          </div>
          <span id="mbar-lead" class="status status-ok hidden">Anda tertinggi</span>
          <button type="button" id="mbar-btn" class="btn btn-brand shrink-0 !min-h-[48px] !px-7">Bida</button>
        </div>
      </div>`;

    const $ = id => document.getElementById(id);
    const sigs = {};
    function setIfChanged(key, sig, html) {
      if (sigs[key] === sig) return false;
      sigs[key] = sig;
      $(key).innerHTML = html();
      return true;
    }

    /* ---------- page state that must survive re-renders ---------- */
    let imgIdx = 0;
    let edited = false;       // user typed / picked an amount → don't overwrite it
    let lastTop;              // for the 'bump' animation
    let lastNewest;           // for flashing the newest history row
    let busy = false;         // a fee/confirm modal is open

    const getItem = () => EB.store.get().items.find(i => i.id === itemId);
    const nameOf = (uid, me) => uid === me ? 'Anda' : ui.maskName(EB.users.byId(uid).name);
    const tenant = () => EB.tenant.current();
    const loginUrl = () => ui.link('login.html', { next: location.pathname + location.search });

    /* ---------- ad attribution: keep utm_* / fbclid / gclid on internal links and the Bayarcash returnUrl ---------- */
    const AD_KEYS = /^(utm_[a-z_]+|fbclid|gclid|ttclid|msclkid)$/i;
    const adParams = () => {
      const out = {};
      new URLSearchParams(location.search).forEach((v, k) => { if (AD_KEYS.test(k) && v) out[k] = v; });
      return out;
    };
    const shopUrl = () => ui.link('shop.html', adParams());

    /* ---------- Meta Pixel: each action fires once (re-renders, double taps, back/forward cache) ---------- */
    const pxFired = new Set();
    function pxOnce(key, fn) {
      if (pxFired.has(key)) return;
      pxFired.add(key);
      try {
        const k = 'ebid_px:' + key;
        if (sessionStorage.getItem(k)) return;
        sessionStorage.setItem(k, '1');
      } catch (e) { /* storage blocked: the in-memory guard still holds */ }
      try { fn(EB.pixel); } catch (e) { console.warn('[pixel]', e); }
    }

    /* ---------- gallery (rendered once; thumbnail clicks swap the slide only) ----------
     * Slides: the lot video first (when item.video is set), then the photos. */
    const PLAY = '<svg viewBox="0 0 24 24" class="h-full w-full" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
    const videoOf = it => (it.video && it.video.src ? it.video : null);
    const slideCount = it => imgCount(it) + (videoOf(it) ? 1 : 0);
    const isVideoSlide = (it, n) => !!videoOf(it) && n === 0;
    const photoIdx = (it, n) => n - (videoOf(it) ? 1 : 0);
    const slideLabel = (it, n) => isVideoSlide(it, n) ? 'Video' : 'Gambar ' + (photoIdx(it, n) + 1);
    let videoMounted = false;

    function renderGallery(item) {
      const total = slideCount(item);
      const vid = videoOf(item);
      const poster = vid && vid.poster ? ui.ROOT + vid.poster : ui.itemImage(item, 0);
      $('gallery').innerHTML = `
        <div class="-mx-4 md:mx-0">
          <div id="gal-stage" class="gal-surface relative aspect-[4/5] max-h-[78vh] w-full overflow-hidden md:rounded-xl">
            <img id="gal-main" src="${vid ? poster : ui.itemImage(item, photoIdx(item, imgIdx))}" alt="${esc(item.title)}, ${slideLabel(item, imgIdx).toLowerCase()}" class="h-full w-full object-contain transition-opacity duration-150 ${vid && imgIdx === 0 ? 'hidden' : ''}">
            ${vid ? `
              <button type="button" id="gal-poster" class="absolute inset-0 grid place-items-center bg-black ${imgIdx === 0 ? '' : 'hidden'}" aria-label="Main video${vid.title ? ': ' + esc(vid.title) : ''}">
                <img src="${poster}" alt="" class="absolute inset-0 h-full w-full object-cover opacity-75">
                <span class="relative grid h-[68px] w-[68px] place-items-center rounded-full bg-white p-5 pl-6 text-[var(--ink)] shadow-lg">${PLAY}</span>
                <span class="absolute bottom-4 left-4 right-4 text-left text-[15px] text-white">${esc(vid.title || 'Tonton video lot')}</span>
              </button>
              <div id="gal-video" class="absolute inset-0 hidden place-items-center bg-black"></div>` : ''}
          </div>
        </div>
        <div class="mt-3 flex items-center gap-3">
          <div class="flex min-w-0 gap-2 overflow-x-auto no-scrollbar p-[3px]">
            ${[...Array(Math.min(total, 8)).keys()].map(n => `<button type="button" data-thumb="${n}" aria-label="${slideLabel(item, n)}" aria-current="${n === imgIdx}" class="thumb relative h-14 w-14 shrink-0 overflow-hidden rounded-lg sm:h-16 sm:w-16">
              <img ${isVideoSlide(item, n) ? 'data-vthumb' : ''} src="${ui.itemImage(item, isVideoSlide(item, n) ? 0 : photoIdx(item, n))}" alt="" class="h-full w-full object-cover ${isVideoSlide(item, n) && vid.kind === 'youtube' ? 'scale-[1.34]' : ''}">
              ${isVideoSlide(item, n) ? `<span class="absolute inset-0 grid place-items-center bg-black/35"><span class="block h-6 w-6 rounded-full bg-white p-1.5 pl-[7px] text-[var(--ink)]">${PLAY}</span></span>` : ''}</button>`).join('')}
          </div>
          ${total > 1 ? `<div class="ml-auto flex shrink-0 items-center">
            <button type="button" data-step="-1" class="btn btn-ghost !min-h-[44px] !w-11 !px-0" aria-label="Sebelum">${ic('left', 'h-5 w-5')}</button>
            <span id="gal-count" class="num min-w-[3rem] text-center text-[14px] text-[var(--muted)]">${imgIdx + 1} / ${total}</span>
            <button type="button" data-step="1" class="btn btn-ghost !min-h-[44px] !w-11 !px-0" aria-label="Seterusnya">${ic('right', 'h-5 w-5')}</button>
          </div>` : ''}
        </div>`;
      // YouTube: use its own still for the thumbnail (the big poster keeps the lot photo)
      if (vid && window.EB.media) EB.media.resolve(vid).then(r => {
        if (r && r.thumb) document.querySelectorAll('[data-vthumb]').forEach(im => { im.src = r.thumb; });
      }).catch(() => {});
    }
    function playVideo() {
      const item = getItem();
      const box = $('gal-video');
      if (!box || !videoOf(item)) return;
      $('gal-poster').classList.add('hidden');
      box.classList.remove('hidden'); box.classList.add('grid');
      if (videoMounted) { const v = box.querySelector('video'); if (v) v.play().catch(() => {}); return; }
      videoMounted = true;
      box.innerHTML = '<p class="px-6 text-center text-[15px] text-white/80">Memuatkan video…</p>';
      const fail = '<p class="px-6 text-center text-[15px] text-white/80">Video tidak dapat dimainkan di peranti ini. Lihat gambar lot di sebelah.</p>';
      EB.media.mount(box, videoOf(item), { poster: videoOf(item).poster ? ui.ROOT + videoOf(item).poster : ui.itemImage(item, 0), maxHeight: '78vh', emptyHtml: fail })
        .then(ok => { const wrap = box.firstElementChild; if (ok && wrap) wrap.style.width = '100%'; const v = box.querySelector('video'); if (v) v.play().catch(() => {}); })
        .catch(() => { box.innerHTML = fail; });
    }
    // leaving the video slide: pause a file video, unload a YouTube player (stops the sound)
    function stopVideo() {
      const box = $('gal-video');
      if (!box || !videoMounted) return;
      const v = box.querySelector('video');
      if (v) v.pause(); else { box.innerHTML = ''; videoMounted = false; }
    }
    function showImg(n) {
      const item = getItem();
      const total = slideCount(item);
      imgIdx = (n + total) % total;
      const main = $('gal-main');
      const onVideo = isVideoSlide(item, imgIdx);
      if (videoOf(item)) {
        if (onVideo) {
          main.classList.add('hidden');
          if (videoMounted) { $('gal-video').classList.remove('hidden'); $('gal-video').classList.add('grid'); }
          else $('gal-poster').classList.remove('hidden');
        } else {
          stopVideo();
          $('gal-poster').classList.add('hidden');
          $('gal-video').classList.add('hidden'); $('gal-video').classList.remove('grid');
          main.classList.remove('hidden');
        }
      }
      if (!onVideo) {
        main.style.opacity = '0.4';
        setTimeout(() => { main.src = ui.itemImage(item, photoIdx(item, imgIdx)); main.alt = item.title + ', ' + slideLabel(item, imgIdx).toLowerCase(); main.style.opacity = '1'; }, 100);
      }
      if ($('gal-count')) $('gal-count').textContent = (imgIdx + 1) + ' / ' + total;
      document.querySelectorAll('[data-thumb]').forEach(b => b.setAttribute('aria-current', String(Number(b.getAttribute('data-thumb')) === imgIdx)));
    }
    // swipe left/right on the photo, the video poster or a file video (phones).
    // A YouTube player is an iframe and keeps its own touches: use the arrows or thumbnails there.
    let sx = null, sy = null;
    $('gallery').addEventListener('touchstart', e => { if (!e.target.closest('#gal-main, #gal-poster, #gal-video video')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    $('gallery').addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && slideCount(getItem()) > 1) { swiped = Date.now(); showImg(imgIdx + (dx < 0 ? 1 : -1)); }
    }, { passive: true });
    let swiped = 0;
    $('gallery').addEventListener('click', e => {
      if (e.target.closest('#gal-poster')) { if (Date.now() - swiped > 400) playVideo(); return; }
      const th = e.target.closest('[data-thumb]');
      if (th) return showImg(Number(th.getAttribute('data-thumb')));
      const st = e.target.closest('[data-step]');
      if (st) showImg(imgIdx + Number(st.getAttribute('data-step')));
    });

    /* ---------- breadcrumb + head ---------- */
    function renderHead(s, item, t, me, now) {
      const fav = !!(me && s.favourites && (s.favourites[me] || []).includes(item.id));
      const tier = EB.tenant.tier(t, item.tier);
      const st = A.status(item, now);
      const lot = ui.lotNo(item);
      setIfChanged('crumb', JSON.stringify([item.category, lot]), () => `
        <a href="${shopUrl()}" class="shrink-0 inline-flex min-h-[44px] min-w-[44px] items-center hover:text-[var(--ink)] hover:underline">Katalog</a>
        <span aria-hidden="true">/</span>
        <a href="${shopUrl()}#cari" class="shrink-0 inline-flex min-h-[44px] min-w-[44px] items-center hover:text-[var(--ink)] hover:underline">${esc(item.category)}</a>
        <span aria-hidden="true">/</span>
        <span class="truncate text-[var(--ink-2)]" aria-current="page">${lot}</span>`);
      setIfChanged('head', JSON.stringify([item.title, item.category, item.size, item.condition, tier.name, fav, st, lot]), () => `
        <div class="flex items-center justify-between gap-3">
          <span class="lot">${lot}</span>
          ${ui.statusBadge(st)}
        </div>
        <h1 class="lot-title mt-3 text-[32px] sm:text-[40px] lg:text-[44px] !leading-[1.08]">${esc(item.title)}</h1>
        <p class="meta mt-3">${esc(item.category)} · Saiz ${esc(item.size)} · ${esc(item.condition)} · Kategori harga ${esc(tier.name)}</p>
        <button type="button" data-fav aria-pressed="${fav}" class="btn btn-ghost -ml-3 mt-2 !min-h-[44px] !px-3 ${fav ? '!text-[var(--live)]' : ''}">
          ${ic('heart', 'h-4 w-4', fav ? 'currentColor' : 'none')}${fav ? 'Dalam kegemaran' : 'Simpan ke kegemaran'}
        </button>`);
    }
    $('head').addEventListener('click', e => {
      if (!e.target.closest('[data-fav]')) return;
      const me = EB.auth.userId();
      if (!me) { location.href = loginUrl(); return; }
      let added = false;
      EB.store.update(s => {
        s.favourites = s.favourites || {};
        const arr = s.favourites[me] || (s.favourites[me] = []);
        const k = arr.indexOf(itemId);
        if (k >= 0) arr.splice(k, 1); else { arr.push(itemId); added = true; }
      });
      ui.toast(added ? 'Disimpan ke Kegemaran.' : 'Dibuang dari Kegemaran.', added ? 'success' : 'info');
    });

    /* ---------- bid panel: price, time, next minimum ---------- */
    function renderLive(s, item, t, me, now) {
      const st = A.status(item, now);
      const bids = A.bidsFor(item.id, s);
      const top = bids[0] || null;
      const bidders = new Set(bids.map(b => b.userId)).size;
      const last = st === 'live' && A.isLastWindow(item, s, now);
      const inc = A.increment(item, s);
      const next = A.minNextBid(item, s);
      const res = item.result;
      const winnerId = st === 'ended' ? (res ? res.winnerId : top && top.userId) : null;
      const finalAmt = st === 'ended' ? (res ? res.amount : top && top.amount) : null;
      const topAmt = top ? top.amount : null;
      const mult = t.settings.lastWindowMultiplier || 2;
      const counts = `<span class="num">${bids.length}</span> bidaan · <span class="num">${bidders}</span> pembida`;

      const changed = setIfChanged('live', JSON.stringify([st, last, top && top.id, bids.length, bidders, me, inc, next, winnerId, finalAmt, t.settings]), () => {
        if (st === 'ended') return `
          <div class="p-5 sm:p-6">
            <div class="eyebrow">${winnerId ? 'Harga akhir' : 'Keputusan'}</div>
            ${winnerId ? `
              <div id="topAmt" class="price mt-1 whitespace-nowrap text-[clamp(36px,11vw,48px)]">${money(finalAmt)}</div>
              <div class="mt-2 text-[15px] text-[var(--ink-2)]">Pemenang <b class="font-medium ${winnerId === me ? 'text-ok' : 'text-[var(--ink)]'}">${esc(nameOf(winnerId, me))}</b> · ${counts}</div>`
              : `<div class="mt-1 font-serif text-[32px] leading-tight">Tiada bidaan</div>
              <div class="meta mt-1">Lot ini tidak terjual pada harga mula ${money(item.startPrice)}.</div>`}
            <div class="spec mt-6 border-t border-line pt-5">
              <div class="spec-l">Lelongan tamat</div>
              <div class="num text-[22px]">${esc(ui.fmtDate(item.endAt))}</div>
            </div>
          </div>`;
        const live = st === 'live';
        return `
          <div class="p-5 sm:p-6">
            <div class="eyebrow">${top ? 'Bidaan tertinggi' : 'Harga mula'}</div>
            <div id="topAmt" class="price mt-1 whitespace-nowrap text-[clamp(36px,11vw,48px)]">${money(top ? top.amount : item.startPrice)}</div>
            <div class="mt-2 text-[15px] text-[var(--ink-2)]">${top
              ? `oleh <b class="font-medium ${top.userId === me ? 'text-ok' : 'text-[var(--ink)]'}">${esc(nameOf(top.userId, me))}</b> · ${counts}`
              : live ? 'Belum ada bidaan. Bidaan pertama boleh dibuat pada harga mula.' : 'Bidaan dibuka apabila lelongan bermula.'}</div>
            <div class="mt-6 grid grid-cols-2 gap-x-4 gap-y-5 border-t border-line pt-5">
              <div class="spec col-span-2">
                <div class="spec-l">${live ? `Tamat dalam · ${esc(ui.fmtDate(item.endAt))}` : `Mula dalam · ${esc(ui.fmtDate(item.startAt))}`}</div>
                ${live
                  ? `<div class="num text-[28px] leading-tight" data-countdown-end="${item.endAt}">${ui.countdown(item.endAt - now)}</div>`
                  : `<div class="num text-[28px] leading-tight text-warn" data-countdown-start="${item.startAt}">${ui.countdown(item.startAt - now)}</div>`}
              </div>
              ${live ? `
                <div class="spec">
                  <div class="spec-l">Bidaan minima seterusnya</div>
                  <div class="num whitespace-nowrap text-[20px] sm:text-[22px] leading-tight">${money(next)}</div>
                </div>
                <div class="spec">
                  <div class="spec-l">Kenaikan minima${last ? '' : ' setiap bidaan'}</div>
                  <div class="num whitespace-nowrap text-[20px] sm:text-[22px] leading-tight">${money(inc)}</div>
                </div>` : ''}
            </div>
            ${last ? `<p class="mt-4 border-l-2 pl-3 text-[14px] text-warn" style="border-color:var(--warn)">${t.settings.lastWindowMin} minit terakhir: kenaikan minima digandakan x${mult}.</p>` : ''}
          </div>`;
      });
      if (changed && lastTop !== undefined && topAmt !== lastTop && $('topAmt')) $('topAmt').classList.add('bump');
      lastTop = topAmt;
    }

    /* ---------- beneficiary (optional tenant field) ---------- */
    function renderBenef(t) {
      setIfChanged('benef', JSON.stringify([t.beneficiary, t.event]), () => !t.beneficiary ? '' : `
        <div class="border-t border-line pt-5">
          <div class="eyebrow">Hasil bidaan</div>
          <p class="mt-1.5 font-serif text-[20px] leading-snug text-[var(--ink)]">${esc(t.beneficiary)}</p>
          ${t.event ? `<p class="meta mt-2">${esc(t.event)}</p>` : ''}
        </div>`);
    }

    /* ---------- bid box ---------- */
    function renderBidbox(s, item, t, me, now) {
      const st = A.status(item, now);
      const top = A.highest(item.id, s);
      const leading = !!(me && top && top.userId === me && st === 'live');
      const myBids = me ? s.bids.filter(b => b.itemId === item.id && b.userId === me) : [];
      const myTop = myBids.length ? Math.max(...myBids.map(b => b.amount)) : 0;
      const outbid = st === 'live' && myBids.length && !leading;
      const paid = me && A.hasPaidFee(me, item.id, s);
      const next = A.minNextBid(item, s);
      const inc = A.increment(item, s);
      const order = me && s.orders.filter(o => o.itemId === item.id && o.userId === me).sort((a, b) => b.createdAt - a.createdAt)[0];
      const won = st === 'ended' && me && ((item.result && item.result.winnerId === me) || (!item.result && top && top.userId === me));

      // state line
      setIfChanged('bidstate', JSON.stringify([st, me, leading, outbid, top && top.amount, won, order && [order.id, order.status], myBids.length, myTop]), () => {
        if (st === 'ended') {
          if (won) {
            if (order && order.status === 'unpaid') return `
              <span class="status status-ok">Anda menang</span>
              <p class="mt-2 text-[14px] text-[var(--ink-2)]">Sila bayar <span class="num text-[var(--ink)]">${ui.money(order.amount)}</span> dalam masa <span class="num text-[var(--ink)]" data-countdown-end="${order.dueAt}">${ui.countdown(order.dueAt - now)}</span>. Jika tidak, lot ditawarkan kepada pembida seterusnya.</p>
              <a href="${ui.link('checkout.html', { order: order.id })}" class="btn btn-brand btn-lg mt-4 w-full">Bayar ${ui.money(order.amount)}</a>
              <p class="meta mt-2">Invois <span class="num">${esc(order.id)}</span></p>`;
            if (order && order.status === 'paid') return `
              <span class="status status-ok">Dibayar</span>
              <p class="mt-2 text-[14px] text-[var(--ink-2)]">Anda menang lot ini dan bayaran telah diterima. Penjual akan menghantar item dalam 3 hari bekerja.</p>
              <a href="${ui.link('history.html')}#sejarah" class="btn btn-outline mt-4">Lihat sejarah bidaan</a>`;
            if (order && order.status === 'passed') return `
              <span class="status status-ended">Invois luput</span>
              <p class="mt-2 text-[14px] text-[var(--ink-2)]">Bayaran tidak diterima dalam tempoh. Lot ini telah ditawarkan kepada pembida seterusnya.</p>`;
            return `<span class="status status-ok">Anda menang</span><p class="mt-2 text-[14px] text-[var(--ink-2)]">Keputusan sedang dimuktamadkan dan invois anda sedang disediakan.</p>`;
          }
          if (myBids.length) return `
            <span class="status status-ended">Tidak berjaya</span>
            <p class="mt-2 text-[14px] text-[var(--ink-2)]">Bidaan tertinggi anda <span class="num">${money(myTop)}</span>. Terima kasih kerana menyertai. Yuran penyertaan tidak dikembalikan.</p>`;
          return `<p class="text-[14px] text-[var(--ink-2)]">Lelongan untuk lot ini telah tamat. Bidaan tidak lagi diterima.</p>
            <a href="${ui.link('shop.html')}" class="btn btn-outline mt-4">Lihat lot lain</a>`;
        }
        if (st === 'upcoming') return `
          <p class="mb-4 text-[14px] text-[var(--ink-2)]">Bidaan belum dibuka. Simpan lot ini ke kegemaran supaya mudah dicari apabila lelongan bermula.</p>`;
        if (leading) return `
          <span class="status status-ok">Anda pembida tertinggi</span>
          <p class="mt-2 text-[14px] text-[var(--ink-2)]">Bidaan anda <span class="num text-[var(--ink)]">${ui.money(top.amount)}</span>. Kami akan maklumkan di Peti masuk jika bidaan anda dilepasi.</p>`;
        if (outbid) return `
          <div class="mb-4"><span class="status status-bad">Bidaan anda telah dilepasi</span>
          <p class="mt-1.5 text-[14px] text-[var(--ink-2)]">Bidaan tertinggi anda <span class="num">${money(myTop)}</span>. Bida semula sebelum masa tamat.</p></div>`;
        if (!me) return `
          <p class="mb-4 text-[14px] text-[var(--ink-2)]">Pembida baharu: tekan Bida, isi nama, telefon dan e-mel. Sudah ada akaun? <a class="btn-link inline-block -my-[14px] py-[14px]" href="${loginUrl()}">Log masuk</a></p>`;
        return '';
      });

      // form: shown when live & not leading, disabled while upcoming
      const form = $('bidform');
      const showForm = (st === 'live' && !leading) || st === 'upcoming';
      form.classList.toggle('hidden', !showForm);
      const disabled = st !== 'live';
      const input = $('amt');
      input.disabled = disabled;
      input.min = next;
      input.step = 'any';
      if (!edited && document.activeElement !== input) input.value = st === 'upcoming' ? item.startPrice : next;

      const val = parseFloat(input.value);
      // labels are relative: to the highest bid, or to the opening price when there are no bids yet
      const base = top ? top.amount : item.startPrice;
      setIfChanged('quick', JSON.stringify([next, inc, disabled, val, base]), () => [1, 2, 5].map(k => {
        const v = next + (k - 1) * inc;
        const label = v === base ? 'Harga mula' : '+' + compact(v - base);
        return `<button type="button" data-quick="${v}" ${disabled ? 'disabled' : ''} aria-pressed="${val === v}" aria-label="Bida ${money(v)}" title="${money(v)}" class="quick btn btn-outline !min-h-[44px] !px-1 num whitespace-nowrap">${label}</button>`;
      }).join(''));

      setIfChanged('bidhint', JSON.stringify([next, inc, edited && val < next, st, me, paid]), () => edited && val < next && st === 'live'
        ? `<span class="text-warn">Bidaan minima kini <span class="num">${ui.money(next)}</span>.</span> <button type="button" data-usemin class="btn-link">Guna ${money(next)}</button>`
        : st === 'live' ? `Pilih amaun di atas atau taip sendiri. Anda akan diminta mengesahkan sebelum bidaan dihantar.` : '');

      setIfChanged('feeNote', JSON.stringify([me, paid, t.settings.fee]), () => paid
        ? `<span class="text-ok">Yuran dibayar</span>`
        : `<span class="text-[var(--muted)]">Yuran <span class="num">${ui.money(t.settings.fee)}</span> pada bidaan pertama</span>`);

      const btn = $('bidbtn');
      const btnHtml = st === 'upcoming' ? 'Belum dibuka' : isFinite(val) && val >= next ? `Bida ${money(val)}` : 'Bida sekarang';
      if (btn.getAttribute('data-sig') !== btnHtml) { btn.textContent = btnHtml; btn.setAttribute('data-sig', btnHtml); }
      btn.disabled = disabled || busy;
    }

    /* ---------- bid history (hairline table) ---------- */
    function renderHistory(s, item, me, now) {
      const bids = s.bids.filter(b => b.itemId === item.id).sort((a, b) => b.at - a.at || b.amount - a.amount);
      const topId = bids.length ? A.highest(item.id, s).id : null;
      const newest = bids[0] && bids[0].id;
      const live = A.status(item, now) === 'live';
      const changed = setIfChanged('history', JSON.stringify([bids.map(b => b.id), me, live, ui.liveStatusHtml()]), () => `
        <div class="flex items-baseline justify-between gap-3">
          <h2 class="font-serif text-[30px] md:text-[36px] leading-tight">Sejarah bidaan <span class="ml-1 font-sans text-[18px] text-[var(--muted)]">${bids.length}</span></h2>
          ${live ? ui.liveStatusHtml() : ''}
        </div>
        <p class="meta mt-2">Lelongan terbuka: semua pembida nampak setiap bidaan. Nama pembida disembunyikan sebahagian.</p>
        ${bids.length ? `<div class="hist mt-5 max-h-[28rem] overflow-y-auto border-b border-line">
          <table class="table">
            <thead><tr><th class="!pl-0">Pembida</th><th class="!text-right">Amaun</th><th class="!pr-0 !text-right">Masa</th></tr></thead>
            <tbody>
              ${bids.map(b => {
                const mine = b.userId === me;
                const isTop = b.id === topId;
                return `<tr data-bid="${esc(b.id)}">
                  <td class="whitespace-nowrap !pl-0"><span class="${mine ? 'text-ok font-medium' : 'text-[var(--ink)]'}">${esc(nameOf(b.userId, me))}</span>${isTop ? '<span class="ml-2 hidden text-[14px] text-[var(--muted)] min-[400px]:inline">Tertinggi</span>' : ''}</td>
                  <td class="num whitespace-nowrap ${isTop ? 'font-medium text-[var(--ink)]' : 'text-[var(--ink-2)]'}">${ui.money(b.amount)}</td>
                  <td class="!pr-0 text-right whitespace-nowrap text-[14px] text-[var(--muted)]" data-ago="${b.at}" title="${esc(ui.fmtDate(b.at))}">${ui.timeAgo(b.at)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>` : `<div class="tile mt-5 px-5 py-8 text-[16px] text-[var(--ink-2)]">Belum ada bidaan untuk lot ini.${live ? ` Bidaan pertama boleh dibuat pada harga mula <span class="num">${money(item.startPrice)}</span>.` : ''}</div>`}`);
      if (changed && lastNewest !== undefined && newest && newest !== lastNewest) {
        const row = document.querySelector(`[data-bid="${CSS.escape(newest)}"]`);
        if (row) row.classList.add('flash');
      }
      lastNewest = newest || null;
    }

    /* ---------- story (editorial; only when item.story has content) ---------- */
    function renderStory(item) {
      const st = item.story;
      const body = st && Array.isArray(st.body) ? st.body.filter(p => String(p || '').trim()) : [];
      const has = st && (st.headline || st.subheadline || body.length || st.closing || st.tagline);
      setIfChanged('story', JSON.stringify(has ? st : null), () => !has ? '' : `
        <article class="border-t border-line pt-10 md:pt-12" aria-label="Cerita lot">
          ${st.headline ? `<h2 class="font-serif text-[34px] leading-[1.06] tracking-[-0.015em] sm:text-[40px] lg:text-[46px]">${esc(st.headline)}</h2>` : ''}
          ${st.subheadline ? `<p class="mt-4 max-w-[48ch] text-[17px] leading-snug text-[var(--muted)] md:text-[18px]">${esc(st.subheadline)}</p>` : ''}
          ${body.length ? `<div class="mt-8 max-w-[65ch] space-y-5 text-[17px] leading-[1.7] text-[var(--ink-2)]">${body.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : ''}
          ${st.closing ? `<p class="mt-10 max-w-[24ch] font-serif text-[28px] font-medium leading-[1.15] sm:text-[32px]">${esc(st.closing)}</p>` : ''}
          ${st.tagline ? `<p class="mt-4 text-[15px] italic text-[var(--muted)]">${esc(st.tagline)}</p>` : ''}
        </article>`);
    }

    /* ---------- details + rules ---------- */
    function renderDetails(s, item, t) {
      const tier = EB.tenant.tier(t, item.tier);
      setIfChanged('details', JSON.stringify([item.title, item.desc, item.category, item.size, item.condition, item.startAt, item.endAt, item.startPrice, tier, t.name]), () => {
        const row = (k, v, mono) => `<div class="flex justify-between gap-4 border-b border-line py-3"><dt class="text-[var(--muted)]">${k}</dt><dd class="text-right ${mono ? 'num' : ''}">${v}</dd></div>`;
        return `
          <h2 class="font-serif text-[30px] md:text-[36px] leading-tight">Butiran lot</h2>
          <p class="mt-4 max-w-prose whitespace-pre-line text-[16px] leading-relaxed text-[var(--ink-2)]">${esc(item.desc || 'Penjual belum menambah keterangan untuk lot ini.')}</p>
          <dl class="mt-8 grid border-t border-line text-[15px] lg:grid-cols-2 lg:gap-x-10">
            ${row('Kategori', esc(item.category))}
            ${row('Saiz', esc(item.size))}
            ${row('Keadaan', esc(item.condition))}
            ${row('Kategori harga', esc(tier.name))}
            ${row('Harga mula', ui.money(item.startPrice), 1)}
            ${row('Kenaikan minima', ui.money(tier.increment), 1)}
            ${row('Mula', esc(ui.fmtDate(item.startAt)), 1)}
            ${row('Tamat', esc(ui.fmtDate(item.endAt)), 1)}
            ${row('Penjual', esc(t.name))}
          </dl>`;
      });
    }
    function renderRules(t) {
      const st = t.settings;
      setIfChanged('rules', JSON.stringify(st), () => {
        const li = (h, p) => `<div class="py-4"><dt>${h}</dt><dd class="mt-1 text-[15px] leading-relaxed text-[var(--ink-2)]">${p}</dd></div>`;
        return `
          <div class="tile -mx-4 rounded-none px-4 py-8 sm:mx-0 sm:rounded-xl sm:px-6">
          <h2 class="font-serif text-[26px] leading-tight">Peraturan kedai</h2>
          <dl class="rules mt-3 divide-y divide-[#d3d4d8]">
            ${li(`Yuran penyertaan <span class="num">${ui.money(st.fee)}</span>`, 'Dibayar sekali bagi setiap lot, pada bidaan pertama, melalui Bayarcash (FPX, DuitNow QR atau kad). Tidak dikembalikan walaupun anda tidak menang.')}
            ${st.winLimit ? li(`Had menang ${st.winLimit} lot`, `Anda boleh mendahului atau memenangi maksimum ${st.winLimit} lot serentak di kedai ini.`) : ''}
            ${li(`Bayar dalam ${st.payDeadlineHours} jam`, 'Jika pemenang tidak membayar dalam tempoh ini, lot ditawarkan kepada pembida seterusnya.')}
            ${st.lastWindowOn ? li(`${st.lastWindowMin} minit terakhir`, `Kenaikan minima digandakan x${st.lastWindowMultiplier || 2} supaya bidaan saat akhir lebih adil.`) : ''}
            ${li('Bidaan muktamad', 'Bidaan yang disahkan tidak boleh dibatalkan atau ditarik balik.')}
          </dl>
          </div>`;
      });
    }

    /* ---------- refresh everything (cheap; only changed parts touch the DOM) ---------- */
    function refresh() {
      const s = EB.store.get();
      const item = s.items.find(i => i.id === itemId);
      if (!item) {
        app.innerHTML = `<div class="mx-auto max-w-xl py-12 md:py-24"><h1 class="font-serif text-[36px] md:text-[48px] leading-[1.05]">Lot telah dipadam</h1>
          <p class="mt-3 text-[16px] text-[var(--ink-2)]">Penjual telah mengeluarkan lot ini dari katalog.</p>
          <a href="${ui.link('shop.html')}" class="btn btn-brand btn-lg mt-8">Kembali ke katalog</a></div>`;
        return;
      }
      const t = tenant();
      const me = EB.auth.userId();
      const now = Date.now();
      renderHead(s, item, t, me, now);
      renderLive(s, item, t, me, now);
      renderBenef(t);
      renderBidbox(s, item, t, me, now);
      renderHistory(s, item, me, now);
      renderStory(item);
      renderDetails(s, item, t);
      renderRules(t);
      renderBar(s, item, me, now);
    }

    /* ---------- phones: sticky bid bar (hidden while the bid panel is on screen) ---------- */
    let panelVisible = true;
    function renderBar(s, item, me, now) {
      const bar = $('mbar');
      const st = A.status(item, now);
      const top = A.highest(item.id, s);
      const show = st === 'live' && !panelVisible;
      if (bar.hidden === show) bar.hidden = !show;
      document.body.classList.toggle('has-mbar', st === 'live');
      if (st !== 'live') return;
      const price = money(top ? top.amount : item.startPrice);
      if ($('mbar-price').textContent !== price) $('mbar-price').textContent = price;
      $('mbar-label').textContent = top ? 'Bidaan tertinggi' : 'Harga mula';
      $('mbar-time').textContent = ui.countdown(item.endAt - now);
      const leading = !!(me && top && top.userId === me);
      $('mbar-lead').classList.toggle('hidden', !leading);
      $('mbar-btn').classList.toggle('hidden', leading);
    }
    $('mbar-btn').addEventListener('click', () => {
      $('bidpanel').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      const input = $('amt');
      if (EB.auth.userId() && input && !input.disabled && !$('bidform').classList.contains('hidden')) setTimeout(() => input.focus({ preventScroll: true }), 350);
    });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(entries => {
        panelVisible = entries[0].isIntersecting;
        refresh();
      }).observe($('bidpanel'));
    }

    /* ---------- bid flow ---------- */
    // one message at a time: an error replaces the hint line under the input
    const showErr = (msg, html) => {
      const el = $('biderr');
      if (html) el.innerHTML = html; else el.textContent = msg || '';
      el.classList.toggle('hidden', !msg);
      $('bidhint').classList.toggle('hidden', !!msg);
      if (msg) $('amt').setAttribute('aria-invalid', 'true'); else $('amt').removeAttribute('aria-invalid');
    };

    $('amt').addEventListener('input', () => { edited = true; showErr(''); refresh(); });
    $('bidbox').addEventListener('click', e => {
      const q = e.target.closest('[data-quick]');
      if (q) { $('amt').value = q.getAttribute('data-quick'); edited = true; showErr(''); refresh(); return; }
      if (e.target.closest('[data-usemin]')) { $('amt').value = A.minNextBid(getItem()); edited = true; showErr(''); refresh(); }
    });

    $('bidform').addEventListener('submit', e => {
      e.preventDefault();
      if (busy) return;
      const item = getItem();
      const amount = parseFloat($('amt').value);
      if (!isFinite(amount)) { showErr('Sila masukkan amaun bidaan.'); $('amt').focus(); return; }
      if (!EB.auth.userId()) {
        // ad flow: no trip to login.html; sign up in a bottom sheet, then straight to the fee
        const min = A.minNextBid(item);
        if (A.status(item) !== 'live') { showErr('Lelongan tidak dibuka untuk bidaan.'); return; }
        if (!(amount >= min)) { showErr('low', `Bidaan minima ialah ${money(min)}. <button type="button" data-usemin class="btn-link">Guna ${money(min)}</button>`); $('amt').focus(); return; }
        if (amount > min * 20) { showErr('Amaun terlalu tinggi. Sila semak semula.'); $('amt').focus(); return; }
        showErr('');
        openSignup(amount);
        return;
      }
      proceed(amount);
    });

    /** Logged in: fee step (first bid) or the confirm step. lift = move a too-low amount up to the minimum. */
    function proceed(amount, lift) {
      const me = EB.auth.userId();
      const item = getItem();
      let chk = A.canBid(me, item, amount);
      if (chk.code === 'low' && lift) {
        amount = A.minNextBid(item);
        $('amt').value = amount; edited = true;
        ui.toast(`Bidaan lain masuk sebentar tadi. Amaun anda kini ${money(amount)}.`, 'info');
        chk = A.canBid(me, item, amount);
      }
      if (chk.code === 'fee') return openFee(amount);
      if (chk.code === 'low') {
        const min = A.minNextBid(item);
        showErr(chk.reason, `${esc(chk.reason)} <button type="button" data-usemin class="btn-link">Guna ${money(min)}</button>`);
        $('amt').focus(); return;
      }
      if (!chk.ok) { showErr(chk.reason); refresh(); return; }
      showErr('');
      openConfirm(amount);
    }

    /* ---------- inline sign-up (bottom sheet on phones): name, phone, e-mail → fee ---------- */
    const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // Malaysian mobile: 01X-XXX XXXX (10 digits) or 011-XXXX XXXX (11 digits); +60 / 60 accepted
    const phoneDigits = v => { let d = String(v || '').replace(/\D/g, ''); if (/^60(1\d{8,9})$/.test(d)) d = '0' + d.slice(2); return d; };
    const phoneOk = v => /^01\d{8,9}$/.test(phoneDigits(v));
    const phoneFmt = v => { const d = phoneDigits(v); return !phoneOk(v) ? String(v || '').trim() : d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + ' ' + d.slice(6) : d.slice(0, 3) + '-' + d.slice(3, 7) + ' ' + d.slice(7); };

    function openSignup(amount) {
      const t = tenant();
      busy = true; refresh();
      // "Log masuk" brings them back here with the amount, and the fee step opens by itself
      const back = new URL(location.href);
      back.searchParams.set('bid', amount);
      back.searchParams.set('resume', '1');
      const loginHref = ui.link('login.html', { next: back.pathname + back.search });
      const fld = (id, label, attrs) => `
        <div>
          <label class="label" for="${id}">${label}</label>
          <input id="${id}" class="input" ${attrs} aria-describedby="${id}-err">
          <p class="field-error hidden" id="${id}-err"></p>
        </div>`;
      let done = false;
      ui.modal({
        title: 'Daftar untuk membida',
        body: `
          <p class="text-[15px] text-[var(--ink-2)]">Bidaan anda <span class="num font-medium text-[var(--ink)]">${money(amount)}</span>. Isi 3 maklumat ini, kemudian bayar yuran penyertaan <span class="num">${money(t.settings.fee)}</span>.</p>
          <div class="mt-4 space-y-4" data-su>
            ${fld('su-name', 'Nama penuh', 'autocomplete="name" autocapitalize="words" placeholder="Nur Aisyah binti Ahmad"')}
            ${fld('su-phone', 'No. telefon', 'type="tel" inputmode="tel" autocomplete="tel" placeholder="012-345 6789"')}
            ${fld('su-email', 'E-mel', 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="nama@emel.com"')}
          </div>
          <p class="mt-3 text-[15px] text-[var(--ink-2)]">Sudah ada akaun? <a href="${esc(loginHref)}" class="btn-link inline-flex min-h-[44px] items-center">Log masuk</a></p>
          <p class="meta">Yuran tidak dikembalikan. Bidaan yang disahkan tidak boleh dibatalkan.</p>`,
        onOpen(wrap) {
          watchClose(wrap);
          const go = wrap.querySelector('[data-actions] .btn-brand');
          wrap.querySelectorAll('[data-su] input').forEach(inp => {
            inp.addEventListener('input', () => setSuErr(wrap, inp.id, ''));
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go.click(); } });
          });
          wrap.querySelector('#su-phone').addEventListener('blur', e => { e.target.value = phoneFmt(e.target.value); });
          if (matchMedia('(pointer: fine)').matches) wrap.querySelector('#su-name').focus();
        },
        actions: [
          { label: 'Batal' },
          {
            label: 'Daftar dan teruskan', primary: true,
            onClick(close, wrap) {
              if (done) return false;
              const v = id => wrap.querySelector('#' + id).value.trim();
              const name = v('su-name'), phone = v('su-phone'), email = v('su-email').toLowerCase();
              const errs = {};
              if (!name) errs['su-name'] = 'Masukkan nama penuh anda.';
              else if (name.length < 3) errs['su-name'] = 'Nama terlalu pendek. Tulis nama penuh.';
              if (!phone) errs['su-phone'] = 'Masukkan no. telefon.';
              else if (!phoneOk(phone)) errs['su-phone'] = 'No. telefon bimbit tidak sah. Contoh: 012-345 6789';
              if (!email) errs['su-email'] = 'Masukkan e-mel anda.';
              else if (!EMAIL.test(email)) errs['su-email'] = 'Format e-mel tidak sah. Contoh: nama@emel.com';
              ['su-name', 'su-phone', 'su-email'].forEach(id => setSuErr(wrap, id, errs[id]));
              const bad = Object.keys(errs)[0];
              if (bad) { wrap.querySelector('#' + bad).focus(); return false; }
              done = true;
              // demo: an e-mail that already has an account simply logs in as that bidder
              let user = EB.users.bidders().find(u => String(u.email || '').toLowerCase() === email);
              const created = !user;
              if (created) {
                user = { id: EB.store.uid('u'), role: 'bidder', name, email, phone: phoneFmt(phone), createdAt: Date.now() };
                EB.store.update(st => {
                  st.users.push(user);
                  st.inbox.push({ id: EB.store.uid('msg'), userId: user.id, tenant: EB.tenant.slug(), type: 'info', title: 'Selamat datang ke ' + t.name, body: 'Akaun anda telah berjaya didaftarkan. Selamat membida.', itemId: null, at: Date.now(), read: false });
                });
              }
              EB.auth.login(user.id);
              if (created) pxOnce('reg:' + user.id, px => px.track('CompleteRegistration', { content_name: 'Daftar pembida' }));
              ui.toast(created ? 'Akaun didaftarkan. Selamat datang, ' + user.name + '.' : 'E-mel ini sudah berdaftar. Anda log masuk sebagai ' + user.name + '.', 'success');
              close();
              proceed(amount, true);
              return false;
            },
          },
        ],
      });
    }
    function setSuErr(wrap, id, msg) {
      const el = wrap.querySelector('#' + id + '-err');
      const inp = wrap.querySelector('#' + id);
      if (!el || !inp) return;
      el.textContent = msg || '';
      el.classList.toggle('hidden', !msg);
      if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
    }

    // release the form when a modal is dismissed (X, backdrop, Esc) — unless a newer modal took over
    let modalSeq = 0;
    function watchClose(wrap) {
      const mine = ++modalSeq;
      const obs = new MutationObserver(() => {
        if (wrap.isConnected) return;
        obs.disconnect();
        if (mine === modalSeq) { busy = false; refresh(); }
      });
      obs.observe(document.body, { childList: true });
    }

    const lotLine = item => `<span class="text-[13px] text-[var(--muted)]">${ui.lotNo(item)}</span><span class="mt-0.5 block line-clamp-2 text-[var(--ink)]">${esc(item.title)}</span>`;

    const CHANNELS = [
      ['fpx', 'FPX perbankan dalam talian', 'Maybank2u, CIMB Clicks, Bank Islam dan lain-lain'],
      ['duitnow', 'DuitNow QR', 'Imbas dengan aplikasi bank atau e-dompet'],
      ['card', 'Kad debit / kredit', 'Visa atau Mastercard'],
    ];
    let feeClose = null;

    // Fee → redirect to the (mock) Bayarcash hosted page. We come back to this URL with
    // ?bid=<amount>&pay_intent=…&pay_status=… (handled in handleReturn below).
    function openFee(amount) {
      const item = getItem();
      const t = tenant();
      const fee = t.settings.fee;
      busy = true; refresh();
      feeClose = ui.modal({
        title: 'Bayar yuran penyertaan',
        body: `
          <p class="text-[15px] text-[var(--ink)]">Yuran penyertaan <span class="num font-medium">${money(fee)}</span>, sekali untuk lot ini, tidak dikembalikan. Anda akan dibawa ke halaman bayaran Bayarcash yang selamat (FPX).</p>
          <p class="meta mt-1">Selepas bayaran berjaya, anda kembali ke halaman ini untuk mengesahkan bidaan.</p>
          <dl class="mt-4 border-y border-line text-[14px]">
            <div class="flex justify-between gap-6 border-b border-line py-2.5"><dt class="shrink-0 text-[var(--muted)]">Lot</dt><dd class="min-w-0 text-right">${lotLine(item)}</dd></div>
            <div class="flex justify-between gap-6 border-b border-line py-2.5"><dt class="text-[var(--muted)]">Bidaan anda (disahkan selepas ini)</dt><dd class="num whitespace-nowrap">${money(amount)}</dd></div>
            <div class="flex justify-between gap-6 py-2.5"><dt class="font-medium text-[var(--ink)]">Dibayar sekarang</dt><dd class="num whitespace-nowrap font-medium text-[var(--ink)]">${money(fee)}</dd></div>
          </dl>
          <fieldset class="mt-5">
            <legend class="label">Kaedah bayaran</legend>
            <div class="rounded border border-line">
              ${CHANNELS.map(([v, l, d], n) => `<label class="flex cursor-pointer items-start gap-3 px-3 py-2.5 hover:bg-[var(--paper)] has-[:checked]:bg-[var(--paper)] ${n ? 'border-t border-line' : ''}">
                <input type="radio" name="pay-ch" value="${v}" ${n ? '' : 'checked'} class="mt-0.5 h-4 w-4 shrink-0 accent-[var(--ink)]">
                <span class="min-w-0"><span class="block text-[14px] font-medium text-[var(--ink)]">${l}</span><span class="block text-[12px] text-[var(--muted)]">${d}</span></span></label>`).join('')}
            </div>
          </fieldset>
          <p class="meta mt-4">Demo sahaja: tiada wang sebenar ditolak. Halaman Bayarcash ialah simulasi (sandbox).</p>`,
        onOpen(wrap) { watchClose(wrap); },
        actions: [
          { label: 'Batal' },
          {
            label: 'Teruskan ke Bayarcash', primary: true,
            onClick(close, wrap) {
              const channel = (wrap.querySelector('input[name="pay-ch"]:checked') || {}).value || 'fpx';
              const btn = wrap.querySelector('[data-actions] .btn-brand');
              if (btn.getAttribute('aria-busy')) return false;
              btn.textContent = 'Membuka Bayarcash…';
              btn.setAttribute('aria-busy', 'true');
              btn.setAttribute('aria-disabled', 'true');
              btn.style.pointerEvents = 'none'; // stays full-colour while it opens (a disabled button fades out)
              wrap.querySelectorAll('[data-actions] button:not(.btn-brand), [data-x], input').forEach(b => { b.disabled = true; });
              setTimeout(() => {
                if (!wrap.isConnected) return; // dismissed
                const intent = EB.pay.start({
                  kind: 'fee', tenant: t.slug, itemId: item.id, amount: fee,
                  description: 'Yuran penyertaan ' + ui.lotNo(item), channel,
                  returnUrl: ui.link('item.html', Object.assign(adParams(), { id: item.id, bid: amount })),
                  navigate: false,
                });
                pxOnce('fee-start:' + intent.id, px => px.track('InitiateCheckout', { value: fee, content_name: 'Yuran penyertaan', content_ids: [item.id], num_items: 1 }));
                location.href = EB.pay.pageUrl('bayarcash.html', intent);
              }, 450);
              return false;
            },
          },
        ],
      });
    }
    // Back button from Bayarcash may restore this page from the bfcache with the modal still "opening"
    window.addEventListener('pageshow', e => {
      if (e.persisted && feeClose) { feeClose(); feeClose = null; busy = false; refresh(); }
    });

    /** Coming back from Bayarcash: ?pay_intent=&pay_status= (+ our own ?bid=). */
    function handleReturn() {
      const r = EB.pay.result();
      if (!r) return;
      const wanted = parseFloat(ui.qs('bid'));
      EB.pay.clearResult();
      try {
        const u = new URL(location.href);
        u.searchParams.delete('bid');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      } catch (e) { /* ignore */ }
      const it = r.intent;
      if (!it || it.kind !== 'fee' || it.itemId !== itemId) return;
      const me = EB.auth.userId();
      const item = getItem();
      // keep the amount the user picked in the form, so a retry is one tap
      if (isFinite(wanted) && A.status(item) === 'live') { $('amt').value = wanted; edited = true; }
      if (r.status === 'success') {
        const fee = Number(it.amount) || tenant().settings.fee;
        pxOnce('fee-paid:' + it.id, px => {
          px.custom('FeePaid', { value: fee, content_ids: [itemId] });
          px.track('Purchase', { value: fee, content_name: 'Yuran penyertaan', content_ids: [itemId], content_type: 'product', num_items: 1 });
        });
        ui.toast(`Yuran diterima (Ruj: ${it.ref || '-'}).`, 'success');
        if (!me) return;
        const min = A.minNextBid(item);
        let amount = isFinite(wanted) ? wanted : min;
        let note = '';
        if (!(amount >= min)) {
          note = `Bidaan lain masuk semasa anda membayar. Amaun anda ${money(amount)} kini di bawah bidaan minima, jadi kami tukar kepada ${money(min)}.`;
          amount = min;
        }
        $('amt').value = amount; edited = true;
        const chk = A.canBid(me, item, amount);
        if (!chk.ok) { showErr(chk.reason); refresh(); return; }
        openConfirm(amount, note);
      } else if (r.status === 'failed') {
        ui.toast('Bayaran yuran gagal. Tiada caj dibuat.', 'error');
        showErr('Bayaran yuran gagal. Tiada caj dibuat. Cuba lagi.');
        refresh();
      } else if (r.status === 'cancelled') {
        ui.toast('Bayaran dibatalkan.', 'info');
        refresh();
      }
    }

    function openConfirm(amount, note) {
      const item = getItem();
      const top = A.highest(item.id);
      const t = tenant();
      busy = true; refresh();
      ui.modal({
        title: 'Sahkan bidaan',
        body: `
          ${note ? `<p class="mb-4 border-l-2 pl-3 text-[14px] text-warn" style="border-color:var(--warn)">${note}</p>` : ''}
          <dl class="border-y border-line text-[14px]">
            <div class="flex justify-between gap-6 border-b border-line py-2.5"><dt class="shrink-0 text-[var(--muted)]">Lot</dt><dd class="min-w-0 text-right">${lotLine(item)}</dd></div>
            <div class="flex justify-between gap-6 border-b border-line py-2.5"><dt class="text-[var(--muted)]">Bidaan tertinggi sekarang</dt><dd class="num whitespace-nowrap">${top ? money(top.amount) : 'Tiada'}</dd></div>
            <div class="flex items-baseline justify-between gap-6 py-3"><dt class="font-medium text-[var(--ink)]">Bidaan anda</dt><dd class="price whitespace-nowrap text-[clamp(20px,6.5vw,26px)] text-[var(--ink)]">${money(amount)}</dd></div>
          </dl>
          <p class="meta mt-3">Bidaan yang disahkan tidak boleh dibatalkan. Jika anda menang, bayaran penuh perlu dibuat dalam ${t.settings.payDeadlineHours} jam.</p>`,
        onOpen(wrap) {
          watchClose(wrap);
        },
        actions: [
          { label: 'Batal' },
          {
            label: `Sahkan ${ui.money(amount)}`, primary: true,
            onClick() {
              const res = A.placeBid(EB.auth.userId(), itemId, amount);
              busy = false;
              if (res && res.ok) {
                pxOnce('bid:' + (res.bid ? res.bid.id : itemId + ':' + amount), px => px.custom('PlaceBid', { value: amount, content_ids: [itemId] }));
                edited = false;
                showErr('');
                ui.toast(`Bidaan ${ui.money(amount)} diterima. Anda pembida tertinggi.`, 'success');
              } else {
                showErr(res ? res.reason : 'Bidaan gagal. Sila cuba lagi.');
                ui.toast(res ? res.reason : 'Bidaan gagal. Sila cuba lagi.', 'error');
              }
              refresh();
            },
          },
        ],
      });
    }

    /* ---------- go ---------- */
    renderGallery(first);
    refresh();
    EB.store.subscribe(refresh);
    // ViewContent: once per page load (a back/forward-cache restore does not run this again)
    if (!window.__ebViewSent && EB.pixel) {
      window.__ebViewSent = true;
      const top = A.highest(itemId);
      EB.pixel.track('ViewContent', { content_ids: [itemId], content_name: first.title, content_type: 'product', value: top ? top.amount : first.startPrice });
    }
    handleReturn();
    // back from "Sudah ada akaun? Log masuk" (?bid=&resume=1): keep the amount and open the next step
    (function resume() {
      if (ui.qs('resume') !== '1' || ui.qs('pay_intent')) return;
      const wanted = parseFloat(ui.qs('bid'));
      try {
        const u = new URL(location.href);
        u.searchParams.delete('bid'); u.searchParams.delete('resume');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      } catch (e) { /* ignore */ }
      if (!isFinite(wanted) || A.status(getItem()) !== 'live') return;
      $('amt').value = wanted; edited = true; refresh();
      if (EB.auth.userId()) proceed(wanted, true);
    })();
    setInterval(() => {
      refresh(); // status changes (upcoming → live → ended, last 30 min) happen without a store write
      document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = ui.timeAgo(Number(el.getAttribute('data-ago'))); });
    }, 1000);
  })();
  </script>
</body>
</html>
