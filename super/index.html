<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super admin · eBid Baju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../assets/tw-config.js?v=20261112b"></script>
  <link rel="stylesheet" href="../assets/app.css?v=20261112b">
  <script src="../assets/data.js?v=20261112b"></script>
  <script src="../assets/store.js?v=20261112b"></script>
  <script src="../assets/auction.js?v=20261112b"></script>
  <script src="../assets/ui.js?v=20261112b"></script>
  <style>
    /* the platform itself is neutral: ink is its "brand"; each shop's colour only marks that shop */
    :root { --brand: #010205; --brand-2: #000000; --accent: #e0b43c; --brand-ink: #ffffff; }
    .t-open th:first-child, .t-open td:first-child { padding-left: 0; }
    .t-open th:last-child, .t-open td:last-child { padding-right: 0; }
    .kpi-v { font-variant-numeric: tabular-nums; font-weight: 400; letter-spacing: -.02em; line-height: 1; white-space: nowrap;
      font-size: clamp(24px, 6.4vw, 34px); color: var(--ink); }
    .ch-grid { stroke: var(--line); stroke-width: 1; stroke-opacity: .7; }
    .ch-base { stroke: var(--ink); stroke-width: 1; }
    .ch-ax { fill: var(--muted); font: 400 12px var(--font); font-variant-numeric: tabular-nums; }
    .ch-ax.is-today { fill: var(--ink); font-weight: 500; }
    .ch-bar { fill: #b9babe; }
    .ch-bar.is-today { fill: var(--ink); }
    .ch-bar.is-hover { fill: var(--ink-2); }
    .ch-hit { fill: transparent; }
    /* the header mark is white (set in ui.js); app.css makes .logo-mark text white, so give it ink here */
    #eb-header .logo-mark { color: var(--ink); }
    .shop-mark { display: grid; place-items: center; flex: none; border-radius: 6px; font: 500 11px/1 var(--font); letter-spacing: .04em; }
    .pp { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px; background: var(--surface); min-height: 36px; align-items: center; }
    .pp:hover, .pp[aria-pressed="true"] { border-color: var(--ink); }
    .pp:hover, .pp[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--ink); }
    .pp span { width: 14px; height: 22px; }
    .pp span:first-child { border-radius: 3px 0 0 3px; } .pp span:last-child { border-radius: 0 3px 3px 0; }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 pt-10 pb-8 sm:pt-14" id="app">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-end mb-8 sm:mb-10">
      <div class="min-w-0">
        <h1 class="font-serif text-[36px] sm:text-[40px] font-normal leading-[1.1] tracking-[-0.01em] text-ink">Papan pemuka platform</h1>
        <p class="mt-2 text-[16px] text-muted">Semua kedai, hasil yuran dan aktiviti bidaan, dikemas kini secara langsung.</p>
      </div>
      <button id="btn-new" class="btn btn-brand sm:ml-auto">Kedai baharu</button>
    </div>

    <section id="kpis" aria-label="Ringkasan" class="tile grid grid-cols-2 lg:grid-cols-5 gap-x-5 gap-y-7 sm:gap-x-8 px-5 py-6 sm:px-8 sm:py-8 mb-14 sm:mb-20"></section>

    <section class="mb-14 sm:mb-20">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-4">
        <h2 class="font-serif text-[24px] sm:text-[28px] font-normal leading-tight text-ink">Yuran penyertaan, semua kedai</h2>
        <span class="text-[14px] text-muted">14 hari lepas dan hari ini</span>
        <span id="chart-total" class="ml-auto tabular-nums text-[18px] text-ink"></span>
      </div>
      <div class="border-t border-ink pt-3">
        <div id="chart-read" class="text-[14px] text-muted min-h-[44px]" aria-live="polite"></div>
        <div id="chart-wrap" class="mt-3"><div id="chart"></div></div>
      </div>
    </section>

    <section class="mb-14 sm:mb-20">
      <div class="flex items-baseline gap-3 mb-4">
        <h2 class="font-serif text-[24px] sm:text-[28px] font-normal leading-tight text-ink">Kedai</h2>
        <span id="tenant-count" class="tabular-nums text-[14px] text-muted"></span>
      </div>
      <div id="tenants" class="border-t border-ink overflow-x-auto"></div>
    </section>

    <section>
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-4">
        <h2 class="font-serif text-[24px] sm:text-[28px] font-normal leading-tight text-ink">Yuran terkini</h2>
        <span class="text-[14px] text-muted">Bayaran yuran penyertaan (FPX) di semua kedai</span>
      </div>
      <div id="fees" class="border-t border-ink overflow-x-auto"></div>
    </section>
  </main>
  <footer class="mt-20 border-t border-line bg-surface">
    <div class="max-w-6xl mx-auto px-4 md:px-6 py-6 text-[13px] text-muted flex flex-wrap gap-3 items-center">
      <span>© 2026 eBid Baju · Panel super admin</span>
      <span>Demo</span>
      <button id="btn-reset" class="ml-auto inline-flex min-h-[44px] items-center underline underline-offset-2 text-[var(--live)]">Reset data demo</button>
    </div>
  </footer>

  <script>
    EB.init({ area: 'super', engine: true });
    const { esc, money, link, fmtDate, timeAgo, toast, modal } = EB.ui;
    const A = EB.auction;
    const PLATFORM_SHARE = 0.10;
    const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };

    function kpi(label, value, sub) {
      return `<div class="min-w-0 last:col-span-2 lg:last:col-span-1">
        <div class="eyebrow">${label}</div>
        <div class="kpi-v mt-2">${value}</div>
        <div class="mt-2 text-[13px] leading-snug text-muted">${sub}</div></div>`;
    }

    function tenantStats(s, t, today, now) {
      const items = s.items.filter(i => i.tenant === t.slug);
      const fees = s.fees.filter(f => f.tenant === t.slug);
      const hist = s.feeHistory.filter(h => h.tenant === t.slug);
      return {
        live: items.filter(i => A.status(i, now) === 'live').length,
        items: items.length,
        bids: s.bids.filter(b => b.tenant === t.slug).length,
        feeIncome: fees.reduce((a, f) => a + f.amount, 0) + hist.reduce((a, h) => a + h.amount, 0),
        feeToday: fees.filter(f => f.at >= today).reduce((a, f) => a + f.amount, 0),
      };
    }

    /** a shop's own identity: solid brand colour with its ink, like its header band */
    function logoChip(t, px) {
      px = px || 32;
      const st = `width:${px}px;height:${px}px`;
      return t.logoUrl
        ? `<img src="${esc(t.logoUrl)}" class="shop-mark object-cover" style="${st}" alt="">`
        : `<span class="shop-mark" style="${st};font-size:${Math.max(9, Math.round(px * 0.33))}px;background:${esc((t.colors && t.colors.brand) || '#6c6f68')};color:${esc((t.colors && t.colors.ink) || '#fff')}">${esc(t.logoText)}</span>`;
    }

    /* ---------- render ---------- */
    function render() {
      const s = EB.store.get();
      const now = Date.now();
      const today = startOfToday();
      const stats = {};
      s.tenants.forEach(t => { stats[t.slug] = tenantStats(s, t, today, now); });
      const sum = k => Object.values(stats).reduce((a, x) => a + x[k], 0);
      const suspended = s.tenants.filter(t => t.suspended).length;
      const upcoming = s.items.filter(i => A.status(i, now) === 'upcoming').length;
      const bidsToday = s.bids.filter(b => b.at >= today);
      const feeTotal = sum('feeIncome');

      document.getElementById('kpis').innerHTML = [
        kpi('Kedai', s.tenants.length, `${s.tenants.length - suspended} aktif · ${suspended} digantung`),
        kpi('Sedang dilelong', sum('live'), `${upcoming} akan datang · ${s.items.length} item`),
        kpi('Bidaan hari ini', bidsToday.length.toLocaleString('en-MY'), `${new Set(bidsToday.map(b => b.userId)).size} pembida unik`),
        kpi('Hasil yuran', money(feeTotal), `Hari ini ${money(sum('feeToday'))}`),
        kpi('Bahagian platform', money(Math.round(feeTotal * PLATFORM_SHARE * 100) / 100), 'Anggaran 10% daripada yuran'),
      ].join('');

      renderChart(s, today);
      renderTenants(s, stats);
      renderFees(s);
    }

    /* ---------- daily fee chart: total across shops, breakdown in the readout ---------- */
    let chartKey = '';
    let chartData = null;
    const fmtAx = v => v >= 1000 ? (v / 1000) + 'k' : String(v);

    function readout(i) {
      if (!chartData) return;
      const d = chartData.days[i];
      if (!d) return;
      const parts = chartData.tenants.map((t, k) => ({ name: t.name, v: d.vals[k] })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      document.getElementById('chart-read').innerHTML =
        `<div><span class="text-ink-2">${esc(d.label)}</span> · <span class="tabular-nums text-ink">${money(d.total)}</span></div>
         <div class="text-[13px] leading-snug">${parts.length ? parts.map(p => `${esc(p.name)} <span class="tabular-nums">${money(p.v)}</span>`).join(' · ') : 'Tiada bayaran yuran pada hari ini.'}</div>`;
      document.querySelectorAll('#chart .ch-bar').forEach(b => b.classList.toggle('is-hover', +b.dataset.b === i && !d.today));
    }

    function renderChart(s, today) {
      const days = [];
      for (let d = 14; d >= 0; d--) {
        const date = new Date(today - d * 86400000 + 12 * 3600000);
        const key = date.toISOString().slice(0, 10);
        const vals = s.tenants.map(t => {
          if (d === 0) return s.fees.filter(f => f.tenant === t.slug && f.at >= today).reduce((a, f) => a + f.amount, 0);
          const h = s.feeHistory.find(x => x.tenant === t.slug && x.day === key);
          return h ? h.amount : 0;
        });
        days.push({ label: d === 0 ? 'Hari ini' : date.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' }), short: d === 0 ? 'Kini' : String(date.getDate()), vals, total: vals.reduce((a, v) => a + v, 0), today: d === 0 });
      }
      const W = Math.max(280, document.getElementById('chart-wrap').clientWidth || 800);
      const key = JSON.stringify([W, s.tenants.map(t => t.slug + t.name), days.map(d => d.vals)]);
      if (key === chartKey) return;
      chartKey = key;
      chartData = { days, tenants: s.tenants.map(t => ({ name: t.name })) };

      const grand = days.reduce((a, d) => a + d.total, 0);
      document.getElementById('chart-total').textContent = money(grand);

      const H = 220, ml = 40, mr = 2, mt = 8, mb = 24;
      const pw = W - ml - mr, ph = H - mt - mb;
      const max = Math.max(10, ...days.map(d => d.total));
      const step = [10, 20, 50, 100, 200, 250, 500, 1000, 2000, 5000].find(x => max / x <= 4) || 10000;
      const top = Math.ceil(max / step) * step;
      const y = v => mt + ph - (v / top) * ph;
      const band = pw / days.length;
      const bw = Math.max(4, Math.min(30, band * 0.6));
      let g = '';
      for (let v = 0; v <= top; v += step) {
        g += `<line class="${v ? 'ch-grid' : 'ch-base'}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>
          <text class="ch-ax" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${fmtAx(v)}</text>`;
      }
      days.forEach((d, i) => {
        const cx = ml + band * i + band / 2, x = cx - bw / 2, h = (d.total / top) * ph, yy = mt + ph - h, base = mt + ph;
        if (h > 0) {
          const r = Math.min(2, h);
          g += `<path class="ch-bar${d.today ? ' is-today' : ''}" data-b="${i}" d="M${x},${base} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${base} Z"/>`;
        }
        const show = band >= 24 || (days.length - 1 - i) % 2 === 0;
        if (show) g += `<text class="ch-ax${d.today ? ' is-today' : ''}" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(d.short)}</text>`;
        g += `<rect class="ch-hit" data-i="${i}" x="${ml + band * i}" y="${mt}" width="${band}" height="${ph + mb}"/>`;
      });
      document.getElementById('chart').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta bar hasil yuran penyertaan harian bagi semua kedai" style="display:block;max-width:100%">${g}</svg>`;
      readout(days.length - 1);
    }

    const wrap = document.getElementById('chart-wrap');
    wrap.addEventListener('mouseover', e => { const h = e.target.closest && e.target.closest('.ch-hit'); if (h) readout(+h.dataset.i); });
    wrap.addEventListener('click', e => { const h = e.target.closest && e.target.closest('.ch-hit'); if (h) readout(+h.dataset.i); });
    wrap.addEventListener('mouseleave', () => { if (chartData) readout(chartData.days.length - 1); });
    let rz = 0;
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { chartKey = ''; renderChart(EB.store.get(), startOfToday()); }, 150); });

    /* ---------- tenants table ---------- */
    function renderTenants(s, stats) {
      document.getElementById('tenant-count').textContent = s.tenants.length + ' kedai';
      document.getElementById('tenants').innerHTML = `<table class="table t-open min-w-[900px]">
        <thead><tr>
          <th>Kedai / domain</th><th>Pelan</th><th>Sertai</th>
          <th class="num">Item aktif</th><th class="num">Bidaan</th>
          <th class="num">Hasil yuran</th><th>Status</th>
          <th class="num">Tindakan</th></tr></thead>
        <tbody>${s.tenants.map(t => {
          const st = stats[t.slug];
          return `<tr>
            <td><div class="flex items-center gap-3 min-w-0">${logoChip(t)}
              <div class="min-w-0"><div class="font-medium ${t.suspended ? 'text-muted' : 'text-ink'}">${esc(t.name)}</div>
              <div class="text-[12px] text-muted tabular-nums truncate max-w-[260px]" title="${esc(t.tagline || '')}">${esc(t.domain)}</div></div></div></td>
            <td class="text-ink-2">${esc(t.plan)}</td>
            <td class="tabular-nums text-[13px] text-ink-2 whitespace-nowrap">${esc(new Date(t.joinedAt).toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' }))}</td>
            <td class="num tabular-nums whitespace-nowrap">${st.live}<span class="text-muted"> / ${st.items}</span></td>
            <td class="num tabular-nums">${st.bids.toLocaleString('en-MY')}</td>
            <td class="num tabular-nums text-ink whitespace-nowrap">${money(st.feeIncome)}</td>
            <td>${EB.ui.statusBadge(t.suspended ? 'suspended' : 'active')}</td>
            <td class="text-right whitespace-nowrap">
              <a class="btn btn-ghost btn-sm" href="${link('shop.html', { shop: t.slug })}" target="_blank" rel="noopener">Buka kedai</a>
              <a class="btn btn-outline btn-sm" href="${link('admin/index.html', { shop: t.slug })}">Admin</a>
              <button type="button" class="btn btn-sm ${t.suspended ? 'btn-outline' : 'btn-ghost !text-[var(--live)]'}" data-suspend="${esc(t.slug)}">${t.suspended ? 'Aktifkan' : 'Gantung'}</button></td>
          </tr>`;
        }).join('')}</tbody></table>`;
    }

    document.getElementById('tenants').addEventListener('click', e => {
      const b = e.target.closest('[data-suspend]'); if (!b) return;
      const t = EB.tenant.bySlug(b.dataset.suspend);
      if (!t) return;
      const doIt = () => {
        EB.tenant.save(t.slug, { suspended: !t.suspended });
        toast(t.suspended ? `${t.name} diaktifkan semula.` : `${t.name} telah digantung.`, t.suspended ? 'success' : 'warn');
      };
      if (t.suspended) { doIt(); return; }
      modal({
        title: 'Gantung kedai ini?',
        body: `<div class="flex items-center gap-3 mb-4">${logoChip(t, 40)}<div class="min-w-0"><div class="font-medium text-ink">${esc(t.name)}</div><div class="text-[13px] text-muted tabular-nums truncate">${esc(t.domain)}</div></div></div>
          <p class="text-[14px]">Kedai akan ditandakan <b class="font-medium">Digantung</b>, contohnya kerana langganan tertunggak.</p>
          <p class="text-[13px] text-muted mt-2">Demo: hanya status ditukar, tiada sekatan sebenar pada kedai.</p>`,
        actions: [{ label: 'Batal' }, { label: 'Gantung kedai', danger: true, onClick: doIt }],
      });
    });

    /* ---------- latest fees ---------- */
    function renderFees(s) {
      const list = s.fees.slice().sort((a, b) => b.at - a.at).slice(0, 12);
      const box = document.getElementById('fees');
      if (!list.length) { box.innerHTML = '<div class="py-10 text-[15px] text-ink-2">Belum ada bayaran yuran. Bayaran muncul di sini sebaik pembida menyertai lelongan.</div>'; return; }
      box.innerHTML = `<table class="table t-open min-w-[760px]">
        <thead><tr>
          <th>Masa</th><th>Kedai</th><th>Pembida</th><th>Item</th><th class="num">Amaun</th><th>Rujukan</th></tr></thead>
        <tbody>${list.map(f => {
          const t = s.tenants.find(x => x.slug === f.tenant) || { name: f.tenant, logoText: '?', colors: { brand: '#6c6f68', ink: '#fff' } };
          const it = s.items.find(i => i.id === f.itemId) || { title: '(item dipadam)' };
          return `<tr><td class="whitespace-nowrap"><div class="tabular-nums text-[13px] text-ink">${esc(fmtDate(f.at))}</div><div class="text-[12px] text-muted">${esc(timeAgo(f.at))}</div></td>
            <td><div class="flex items-center gap-2">${logoChip(t, 22)}<span class="text-[13px] text-ink-2 whitespace-nowrap">${esc(t.name)}</span></div></td>
            <td class="font-medium text-ink">${esc(EB.users.byId(f.userId).name)}</td>
            <td class="text-ink-2"><div class="truncate max-w-[240px]">${esc(it.title)}</div></td>
            <td class="num tabular-nums text-ink whitespace-nowrap">${money(f.amount)}</td>
            <td class="tabular-nums text-[12px] text-muted">${esc(f.ref)}</td></tr>`;
        }).join('')}</tbody></table>`;
    }

    /* ---------- new tenant ---------- */
    const PRESETS = [
      { brand: '#9d174d', brand2: '#4a044e', accent: '#f9a8d4' },
      { brand: '#18181b', brand2: '#3f3f46', accent: '#a3e635' },
      { brand: '#0f766e', brand2: '#134e4a', accent: '#fbbf24' },
      { brand: '#1d4ed8', brand2: '#1e1b4b', accent: '#7dd3fc' },
      { brand: '#c2410c', brand2: '#7c2d12', accent: '#fde68a' },
      { brand: '#0b6b3a', brand2: '#053d22', accent: '#e0b43c' },
    ];
    const slugify = v => String(v || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '').slice(0, 24);
    function uniqueSlug(base) {
      const taken = EB.tenant.all().map(t => t.slug);
      if (!base) return '';
      let s = base, n = 2;
      while (taken.includes(s)) s = base + n++;
      return s;
    }
    const initialsOf = name => {
      const w = String(name).replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
      return ((w[0] || '?')[0] + (w[1] ? w[1][0] : (w[0] || '?')[1] || '')).toUpperCase();
    };

    document.getElementById('btn-new').onclick = () => {
      let slugTouched = false, domainTouched = false;
      modal({
        title: 'Kedai baharu',
        body: `<form data-f class="space-y-4" autocomplete="off" novalidate onsubmit="return false">
          <div class="rounded-lg overflow-hidden border border-line" aria-hidden="true">
            <div data-prev class="flex items-center gap-3 px-3.5 py-3 bg-surface text-ink">
              <span data-plogo class="h-9 w-9 rounded-lg grid place-items-center font-medium text-[12px] tracking-[.04em] text-white" style="background:#9d174d">KB</span>
              <div class="min-w-0"><div data-pname class="font-medium text-[15px] leading-tight truncate">Nama kedai</div><div data-pdom class="text-[12px] text-muted truncate">domain.ebidbaju.my</div></div>
              <span class="ml-auto shrink-0 rounded-md bg-ink text-white text-[12px] px-2.5 py-1.5">Log masuk</span>
            </div>
          </div>
          <div><label class="label" for="nk-n">Nama kedai</label><input id="nk-n" data-n class="input" maxlength="40" placeholder="cth. Butik Mawar"><p data-fe="n" class="field-error hidden"></p></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="label" for="nk-s">Slug (ID kedai)</label><input id="nk-s" data-slug class="input tabular-nums" maxlength="24" placeholder="butikmawar"><p data-fe="slug" class="field-error hidden"></p></div>
            <div><label class="label" for="nk-p">Pelan</label><select id="nk-p" data-plan class="input"><option>Starter</option><option selected>Pro</option><option>Enterprise</option></select></div>
          </div>
          <div><label class="label" for="nk-d">Domain</label><input id="nk-d" data-dom class="input tabular-nums" placeholder="butikmawar.ebidbaju.my"><p data-fe="dom" class="field-error hidden"></p><p class="hint">Kosongkan untuk guna subdomain percuma.</p></div>
          <div><label class="label" for="nk-t">Tagline</label><input id="nk-t" data-tag class="input" maxlength="80" placeholder="Lelongan fesyen terpilih"></div>
          <details class="border-y border-line py-3">
            <summary class="cursor-pointer text-[15px] text-ink min-h-[32px] flex items-center gap-1 flex-wrap">Acara & penerima manfaat <span class="font-normal text-muted">(pilihan, untuk lelongan amal)</span></summary>
            <div class="space-y-3 pt-3">
              <div><label class="label" for="nk-ev">Nama acara</label><input id="nk-ev" data-ev class="input" maxlength="120" placeholder="cth. Majlis Makan Malam Amal 2026"></div>
              <div><label class="label" for="nk-ben">Penerima manfaat / tujuan kutipan</label><input id="nk-ben" data-ben class="input" maxlength="300" placeholder="cth. Tabung Pendidikan Anak Yatim"></div>
              <div><label class="label" for="nk-slo">Slogan</label><input id="nk-slo" data-slo class="input" maxlength="100" placeholder="cth. Bersama Menyumbang"></div>
            </div>
          </details>
          <div><span class="label">Warna jenama</span>
            <div class="flex flex-wrap items-center gap-2">
              ${PRESETS.map((p, i) => `<button type="button" data-pp="${i}" class="pp" aria-label="Pilihan warna ${i + 1}" aria-pressed="${i === 0}"><span style="background:${p.brand}"></span><span style="background:${p.accent}"></span></button>`).join('')}
              <span class="mx-1 h-6 w-px bg-line"></span>
              <input type="color" data-c="brand" value="#9d174d" class="h-8 w-9 rounded border border-[var(--line-strong)] p-0.5 bg-surface" title="Utama" aria-label="Warna utama">
              <input type="color" data-c="brand2" value="#4a044e" class="h-8 w-9 rounded border border-[var(--line-strong)] p-0.5 bg-surface" title="Kedua" aria-label="Warna kedua">
              <input type="color" data-c="accent" value="#f9a8d4" class="h-8 w-9 rounded border border-[var(--line-strong)] p-0.5 bg-surface" title="Aksen" aria-label="Warna aksen">
            </div></div>
          <div class="grid grid-cols-2 gap-3 pt-4 border-t border-line">
            <div><label class="label" for="nk-on">Nama pemilik</label><input id="nk-on" data-on class="input" placeholder="Puan Mawar"><p data-fe="on" class="field-error hidden"></p></div>
            <div><label class="label" for="nk-oe">E-mel pemilik</label><input id="nk-oe" data-oe type="email" class="input" placeholder="pemilik@kedai.my"><p data-fe="oe" class="field-error hidden"></p></div>
          </div>
          <p class="text-[12px] text-muted">Tetapan asal: yuran RM10, had menang 3, bayar dalam 24 jam, kenaikan ×2 dalam 30 min akhir, 4 tier (Biasa, Popular, Premium, Eksklusif). Admin kedai boleh mengubahnya.</p>
        </form>`,
        actions: [{ label: 'Batal' }, { label: 'Cipta kedai', primary: true, onClick: (close, el) => create(el) }],
        onOpen: el => {
          el.querySelector('.eb-modal').classList.replace('sm:max-w-md', 'sm:max-w-lg');
          const q = s => el.querySelector(s);
          const sync = () => {
            const name = q('[data-n]').value.trim();
            if (!slugTouched) q('[data-slug]').value = uniqueSlug(slugify(name));
            if (!domainTouched) q('[data-dom]').value = q('[data-slug]').value ? q('[data-slug]').value + '.ebidbaju.my' : '';
            const c = k => q(`[data-c="${k}"]`).value;
            q('[data-plogo]').style.background = c('brand');
            q('[data-plogo]').textContent = name ? initialsOf(name) : 'KB';
            q('[data-pname]').textContent = name || 'Nama kedai';
            q('[data-pdom]').textContent = q('[data-dom]').value || 'domain.ebidbaju.my';
          };
          // clear a field's error when it is edited
          el.addEventListener('input', e => {
            const map = { n: '[data-n]', slug: '[data-slug]', dom: '[data-dom]', on: '[data-on]', oe: '[data-oe]' };
            Object.entries(map).forEach(([k, sel]) => { if (e.target.matches(sel) || (k === 'slug' && e.target.matches('[data-n]'))) { q(sel).removeAttribute('aria-invalid'); q(`[data-fe="${k}"]`).classList.add('hidden'); } });
          });
          q('[data-n]').addEventListener('input', sync);
          q('[data-slug]').addEventListener('input', e => { slugTouched = true; e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); sync(); });
          q('[data-dom]').addEventListener('input', () => { domainTouched = true; sync(); });
          el.querySelectorAll('[data-c]').forEach(i => i.addEventListener('input', () => { el.querySelectorAll('[data-pp]').forEach(b => b.setAttribute('aria-pressed', 'false')); sync(); }));
          el.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => {
            const p = PRESETS[+b.dataset.pp];
            ['brand', 'brand2', 'accent'].forEach(k => { q(`[data-c="${k}"]`).value = p[k]; });
            el.querySelectorAll('[data-pp]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
            sync();
          });
          sync();
          setTimeout(() => q('[data-n]').focus(), 50);
        },
      });

      function create(el) {
        const q = s => el.querySelector(s);
        el.querySelectorAll('[data-fe]').forEach(x => x.classList.add('hidden'));
        el.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
        const err = (key, sel, m) => { const e = q(`[data-fe="${key}"]`); e.textContent = m; e.classList.remove('hidden'); const i = q(sel); i.setAttribute('aria-invalid', 'true'); i.focus(); return false; };
        const name = q('[data-n]').value.trim();
        const slug = q('[data-slug]').value.trim();
        const domain = q('[data-dom]').value.trim().toLowerCase().replace(/^https?:\/\//, '');
        const owner = q('[data-on]').value.trim();
        const email = q('[data-oe]').value.trim();
        if (!name) return err('n', '[data-n]', 'Sila isi nama kedai.');
        if (!/^[a-z0-9][a-z0-9-]{2,23}$/.test(slug)) return err('slug', '[data-slug]', 'Slug mesti 3 hingga 24 aksara: huruf kecil, nombor atau "-".');
        if (EB.tenant.bySlug(slug)) return err('slug', '[data-slug]', 'Slug "' + slug + '" sudah digunakan. Pilih yang lain.');
        if (domain && !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(domain)) return err('dom', '[data-dom]', 'Format domain tidak sah. Contoh: lelong.kedaianda.my');
        if (domain && EB.tenant.all().some(t => t.domain === domain)) return err('dom', '[data-dom]', 'Domain ini sudah digunakan oleh kedai lain.');
        if (!owner) return err('on', '[data-on]', 'Sila isi nama pemilik.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('oe', '[data-oe]', 'E-mel tidak sah. Contoh: pemilik@kedai.my');
        const c = k => q(`[data-c="${k}"]`).value;
        EB.tenant.create({
          slug, name, tagline: q('[data-tag]').value.trim() || 'Lelongan pakaian dalam talian',
          logoText: initialsOf(name), domain: domain || slug + '.ebidbaju.my', plan: q('[data-plan]').value,
          joinedAt: new Date().toISOString().slice(0, 10), suspended: false,
          event: q('[data-ev]').value.trim(), beneficiary: q('[data-ben]').value.trim(), slogan: q('[data-slo]').value.trim(),
          owner: { name: owner, email },
          colors: { brand: c('brand'), brand2: c('brand2'), accent: c('accent'), ink: '#ffffff' },
          settings: { fee: 10, lastWindowMin: 30, lastWindowMultiplier: 2, lastWindowOn: true, winLimit: 3, payDeadlineHours: 24 },
          tiers: [
            { id: 'biasa', name: 'Biasa', minPrice: 30, increment: 2 },
            { id: 'popular', name: 'Popular', minPrice: 80, increment: 5 },
            { id: 'premium', name: 'Premium', minPrice: 200, increment: 10 },
            { id: 'eksklusif', name: 'Eksklusif', minPrice: 500, increment: 25 },
          ],
        });
        EB.store.update(s => { if (!s.users.find(u => u.id === 'a_' + slug)) s.users.push({ id: 'a_' + slug, name: owner, email, role: 'admin', tenant: slug }); });
        toast(`Kedai "${name}" berjaya dicipta.`, 'success');
        setTimeout(() => modal({
          title: 'Kedai sedia digunakan',
          body: `<div class="flex items-center gap-3 mb-4">${logoChip(EB.tenant.bySlug(slug), 44)}<div class="min-w-0"><div class="font-medium text-ink">${esc(name)}</div><div class="text-[13px] text-muted tabular-nums truncate">${esc(domain || slug + '.ebidbaju.my')}</div></div></div>
            <p class="text-[14px]">Hantar pautan panel admin kepada <b class="font-medium">${esc(owner)}</b> (<span class="tabular-nums text-[13px]">${esc(email)}</span>) supaya mereka boleh mula menambah item lelongan.</p>`,
          actions: [
            { label: 'Lihat kedai', onClick: () => { window.open(link('shop.html', { shop: slug }), '_blank'); } },
            { label: 'Buka admin kedai', primary: true, onClick: () => { location.href = link('admin/index.html', { shop: slug }); } },
          ],
        }), 50);
        return true;
      }
    };

    document.getElementById('btn-reset').onclick = () => modal({
      title: 'Reset data demo?',
      body: 'Semua kedai baharu, bidaan, bayaran dan mesej akan dipadam dan data contoh dimuat semula.',
      actions: [{ label: 'Batal' }, { label: 'Reset data', danger: true, onClick: () => { EB.store.reset(); location.reload(); } }],
    });

    let raf = 0;
    const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
    render();
    EB.store.subscribe(schedule);
    setInterval(schedule, 10000);
  </script>
</body>
</html>
