<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eBid Baju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auction.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/media.js"></script>
  <style>
    /* catalogue grid: one calm dot per lot, the pulse is kept for the item page only */
    .lot-grid .status-live::before { animation: none; }
    .swatch { background: var(--tile); }
    .fav-btn { background: #fff; color: var(--ink); border: 0; box-shadow: 0 1px 4px rgba(1,2,5,.12); }
    .fav-btn:hover { background: var(--tile); }
    .fav-btn[aria-pressed="true"] { color: var(--live); }
    .row-link:hover .lot-title { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

    /* hero: full-bleed photo, copy bottom-left in white */
    .shop-hero { height: 76vh; height: 76svh; min-height: 560px; max-height: 660px; }
    @media (max-width: 767px) { .shop-hero::after { background: linear-gradient(to top, rgba(1,2,5,.82), rgba(1,2,5,.45) 45%, rgba(1,2,5,0) 72%); } }
    .shop-hero > img { position: absolute; inset: 0; }
    .btn-light { background: #fff; color: var(--ink); }
    .btn-light:hover { background: #e4e5e8; }
    .btn-outline-light { background: transparent; color: #fff; border: 2px solid #fff; }
    .btn-outline-light:hover { background: rgba(255,255,255,.14); }
    /* desktop: the lot photo is portrait and small, so it keeps its own shape on the right
       and fades into the dark ground instead of being stretched across the screen */
    @media (min-width: 768px) {
      .shop-hero { height: 70vh; min-height: 520px; max-height: 660px; }
      .shop-hero > img { left: auto; width: auto; max-width: 62%; height: 100%;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 45%); mask-image: linear-gradient(to right, transparent, #000 45%); }
      /* the same photo, blurred and darkened, fills the rest of the band so it reads as one picture */
      .shop-hero-bg { position: absolute; inset: -40px; background-size: cover; background-position: 70% 30%;
        filter: blur(36px) brightness(.38) saturate(.9); transform: scale(1.05); }
    }
    @media (max-width: 767px) { .shop-hero-bg { display: none; } }

    /* spec sheet: value first, label underneath */
    .spec > div { display: flex; flex-direction: column-reverse; justify-content: flex-end; min-width: 0; }
    .spec dt { margin-top: .35rem; font-size: 14px; color: var(--muted); }
    .spec dd { font-variant-numeric: tabular-nums; line-height: 1.05; }
    .step-h::before { content: "→"; margin-right: .5rem; }
    .tile .table td, .tile .table th { border-color: #d3d4d8; }
    .story-body p + p { margin-top: 1.25rem; }
    .btn-play { color: #fff; min-height: 44px; }
    .btn-play::before { content: "→"; margin-right: .5rem; transition: transform .15s; }
    .btn-play:hover { text-decoration: underline; text-underline-offset: 4px; }
    .btn-play:hover::before { transform: translateX(3px); }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main id="app"></main>
  <div id="eb-footer"></div>
  <script>
  EB.init({ area: 'bidder', active: 'shop', title: 'Utama' });
  (function () {
    const ui = EB.ui, A = EB.auction, esc = ui.esc, D = window.EB_DATA;
    const app = document.getElementById('app');

    /* ---------- icons (16px, stroke 1.5; only where they help scanning) ---------- */
    const ICONS = {
      heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    };
    const ic = (n, cls, fill) => `<svg class="${cls || 'h-4 w-4'}" viewBox="0 0 24 24" fill="${fill || 'none'}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

    // every amount uses the full format "RM 14,500.00"
    const money = ui.money;
    const shortDate = ts => new Date(ts).toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    /* ---------- filter state (kept across live re-renders) ---------- */
    const TABS = [['live', 'Sedang berlangsung', 'Berlangsung'], ['upcoming', 'Akan datang', 'Akan datang'], ['ended', 'Telah tamat', 'Tamat']];
    const startTab = ui.qs('tab');
    const f = { tab: TABS.some(x => x[0] === startTab) ? startTab : 'live', q: '', cat: '', size: '', tier: '', cond: '', sort: 'ending' };
    const sigs = {};
    const prevPrice = {};

    app.innerHTML = `
      <section id="hero"></section>
      <div class="max-w-6xl mx-auto px-4 md:px-6">
        <section id="mybids"></section>
        <section id="cari" class="scroll-mt-20 md:scroll-mt-32 pt-12 md:pt-20">
          <h2 id="cari-h" class="font-serif text-[32px] md:text-[44px] leading-[1.1]">Senarai lot</h2>
          <div id="tabs" class="mt-6"></div>
          <div id="filters" class="mt-5"></div>
          <div id="results" class="mt-6"></div>
        </section>
        <section id="story"></section>
        <section id="benef"></section>
        <section id="cara" class="scroll-mt-20 md:scroll-mt-32 mt-16 md:mt-28"></section>
        <section id="tiers" class="mt-16 md:mt-24"></section>
      </div>`;

    const $ = id => document.getElementById(id);
    function setIfChanged(key, el, sig, html) {
      if (sigs[key] === sig) return false;
      sigs[key] = sig;
      el.innerHTML = html();
      return true;
    }

    /* ---------- data helpers ---------- */
    function tenantItems(s) {
      const slug = EB.tenant.slug();
      return s.items.filter(i => i.tenant === slug && !i.hidden && !i.draft);
    }
    function bidStats(s) {
      const m = {};
      s.bids.forEach(b => {
        const x = m[b.itemId] || (m[b.itemId] = { count: 0, top: null, users: new Set(), mine: 0 });
        x.count++;
        x.users.add(b.userId);
        if (!x.top || b.amount > x.top.amount || (b.amount === x.top.amount && b.at < x.top.at)) x.top = b;
      });
      return m;
    }
    function favList(s) {
      const uid = EB.auth.userId();
      return (uid && s.favourites && s.favourites[uid]) || [];
    }
    const ctaFor = st => st === 'live' ? 'Bida sekarang' : st === 'upcoming' ? 'Lihat lot' : 'Lihat keputusan';

    /* ---------- hero: full-bleed photo of the lot ---------- */
    // where the face / garment sits in each photo, so the crop never cuts it
    const FOCUS = { 'nikaziz-photo.jpg': '50% 12%', 'nikaziz-vest.jpg': '50% 30%', 'nikaziz-vest-hanger.jpg': '50% 40%' };
    // the lot shown in the hero: live first (ending soonest), then upcoming, then ended;
    // within that order a lot with a real photo wins over one without
    function featuredLot(items, now) {
      const by = st => items.filter(i => A.status(i, now) === st);
      const order = by('live').sort((a, b) => a.endAt - b.endAt)
        .concat(by('upcoming').sort((a, b) => a.startAt - b.startAt), by('ended').sort((a, b) => b.endAt - a.endAt));
      return order.find(i => heroPhoto(i)) || order[0] || null;
    }
    function heroPhoto(i) {
      if (!i) return null;
      const real = (i.photo ? [i.photo] : []).concat(i.images || []);
      if (!real.length) return null; // generated swatches are not photography
      // prefer a photo of the garment being worn, then the first photo
      const k = Math.max(0, real.findIndex(p => !/^data:/.test(p) && /photo[^/]*\.(jpe?g|png|webp)$/i.test(p)));
      const name = String(real[k]).split('/').pop();
      return { src: ui.itemImage(i, k), pos: FOCUS[name] || '50% 25%' };
    }
    function renderHero(s, t, items, now) {
      const feat = featuredLot(items, now);
      const st = feat ? A.status(feat, now) : null;
      const photo = heroPhoto(feat);
      const parts = String(t.tagline || '').split(':');
      const headline = parts.length > 1 ? parts.pop().trim() : t.name;
      const kicker = t.event || (parts.length > 1 ? parts.join(':').trim() : t.tagline) || '';
      const single = items.length === 1;
      const anyLive = items.some(i => A.status(i, now) === 'live');
      const cta = !feat ? null : single
        ? { href: ui.link('item.html', { id: feat.id }), label: ctaFor(st) }
        : { href: '#cari', label: anyLive ? 'Bida sekarang' : 'Lihat katalog' };
      const video = feat && feat.video && feat.video.src ? feat.video : null;
      setIfChanged('hero', $('hero'), JSON.stringify([t.name, t.tagline, t.event, feat && [feat.id, feat.title], st, photo, single, anyLive, video]), () => {
        const lotLine = feat ? (single ? feat.title : `${items.length} lot dalam katalog, termasuk ${feat.title}`) : 'Katalog sedang disediakan. Lot akan disenaraikan di sini sebelum bidaan dibuka.';
        if (!photo) return `
          <div class="max-w-6xl mx-auto px-4 md:px-6 pt-12 md:pt-20">
            ${kicker ? `<p class="max-w-2xl text-[15px] md:text-[16px] text-[var(--muted)]">${esc(kicker)}</p>` : ''}
            <h1 class="mt-2 font-serif text-[44px] sm:text-[56px] md:text-[72px] leading-[1.02] tracking-[-0.02em]">${esc(headline)}</h1>
            <p class="mt-4 max-w-2xl text-[16px] md:text-[18px] text-[var(--ink-2)]">${esc(lotLine)}</p>
            <div class="mt-7 grid grid-cols-2 gap-3 sm:flex">
              ${cta ? `<a href="${cta.href}" class="btn btn-brand btn-lg">${cta.label}</a>` : ''}
              <a href="#cara" class="btn btn-outline btn-lg">Cara membida</a>
            </div>
            ${video ? `<button type="button" data-video="${esc(feat.id)}" class="link-arrow mt-4 min-h-[44px]">Tonton video</button>` : ''}
          </div>`;
        return `
          <div class="hero-photo shop-hero">
            <div class="shop-hero-bg" style="background-image:url('${photo.src}')" aria-hidden="true"></div>
            <img src="${photo.src}" alt="${esc(feat.title)}" style="object-position:${photo.pos}" fetchpriority="high">
            <div class="hero-copy">
              <div class="max-w-6xl mx-auto px-4 md:px-6 pb-7 md:pb-14">
                <div class="max-w-[620px]">
                  ${kicker ? `<p class="line-clamp-2 text-[14px] md:text-[16px] text-white/80">${esc(kicker)}</p>` : ''}
                  <h1 class="mt-2 font-serif text-[46px] sm:text-[56px] lg:text-[76px] leading-[1] tracking-[-0.02em]">${esc(headline)}</h1>
                  <p class="mt-3 line-clamp-2 text-[16px] md:text-[18px] leading-snug text-white/90">${esc(lotLine)}</p>
                  <div class="mt-6 grid grid-cols-2 gap-3 sm:flex">
                    ${cta ? `<a href="${cta.href}" class="btn btn-light btn-lg !px-4 sm:!px-7">${cta.label}</a>` : ''}
                    <a href="#cara" class="btn btn-outline-light btn-lg !px-4 sm:!px-7">Cara membida</a>
                  </div>
                  ${video ? `<button type="button" data-video="${esc(feat.id)}" class="btn-play mt-3 inline-flex items-center">Tonton video</button>` : ''}
                </div>
              </div>
            </div>
          </div>`;
      });
    }

    /* ---------- my live bids: compact hairline list ---------- */
    function renderMyBids(s, items, stats, now) {
      const uid = EB.auth.userId();
      const mine = !uid ? [] : items.filter(i => A.status(i, now) === 'live' && stats[i.id] && stats[i.id].users.has(uid))
        .sort((a, b) => a.endAt - b.endAt);
      const rows = mine.map(i => {
        const st = stats[i.id];
        const myTop = Math.max(...s.bids.filter(b => b.itemId === i.id && b.userId === uid).map(b => b.amount));
        return { i, top: st.top.amount, myTop, leading: st.top.userId === uid };
      });
      setIfChanged('mybids', $('mybids'), JSON.stringify([uid, rows.map(r => [r.i.id, r.top, r.myTop, r.leading])]), () => !rows.length ? '' : `
        <div class="pt-12 md:pt-16">
          <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
            <h2 class="font-serif text-[24px] md:text-[28px] leading-tight">Bidaan semasa saya <span class="ml-1 font-sans text-[16px] text-[var(--muted)]">${rows.length}</span></h2>
            <a href="${ui.link('my-bids.html')}" class="link-arrow min-h-[44px] text-[16px]">Lihat semua</a>
          </div>
          <ul class="mt-3 border-y border-line divide-y divide-[var(--line)]">
            ${rows.map(r => `
              <li>
                <a href="${ui.link('item.html', { id: r.i.id })}" class="row-link grid grid-cols-[48px_minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1 py-4 sm:grid-cols-[48px_minmax(0,1fr)_110px_220px_140px]">
                  <img src="${ui.itemImage(r.i, 0)}" alt="" class="row-span-2 h-[60px] w-[48px] rounded-lg object-cover sm:row-span-1">
                  <div class="min-w-0">
                    <div class="lot">${ui.lotNo(r.i)}</div>
                    <div class="lot-title truncate text-[17px]">${esc(r.i.title)}</div>
                  </div>
                  <div class="text-right sm:text-left">${r.leading ? '<span class="status status-ok">Tertinggi</span>' : '<span class="status status-bad">Dilepasi</span>'}</div>
                  <div class="col-start-2 col-span-2 flex flex-wrap gap-x-4 text-[14px] text-[var(--muted)] sm:col-start-auto sm:col-span-1 sm:block">
                    <span class="block whitespace-nowrap">Tertinggi <span class="num text-[var(--ink)]">${money(r.top)}</span></span>
                    <span class="block whitespace-nowrap">Anda <span class="num">${money(r.myTop)}</span></span>
                  </div>
                  <div class="num hidden text-right text-[15px] sm:block" data-countdown-end="${r.i.endAt}">${ui.countdown(r.i.endAt - now)}</div>
                </a>
              </li>`).join('')}
          </ul>
        </div>`);
    }

    /* ---------- tabs ---------- */
    function renderTabs(items, now) {
      const counts = {};
      TABS.forEach(([k]) => { counts[k] = items.filter(i => A.status(i, now) === k).length; });
      $('cari-h').classList.toggle('hidden', items.length === 1);
      setIfChanged('tabs', $('tabs'), JSON.stringify([f.tab, counts, items.length]), () => items.length <= 1 ? '' : `
        <div class="tabs !gap-5 sm:!gap-8" role="tablist" aria-label="Status lelongan">
          ${TABS.map(([k, l, sh]) => `<button type="button" role="tab" aria-selected="${f.tab === k}" data-tab="${k}" class="tab min-h-[48px]"><span class="hidden sm:inline">${l}</span><span class="sm:hidden">${sh}</span><span class="count">${counts[k]}</span></button>`).join('')}
        </div>`);
    }

    /* ---------- toolbar (rendered once so typing is never wiped) ---------- */
    function renderFilters() {
      const s = EB.store.get();
      const t = EB.tenant.current();
      const items = tenantItems(s);
      const order = (list, ref) => [...new Set(list)].sort((a, b) => (ref.indexOf(a) + 1 || 999) - (ref.indexOf(b) + 1 || 999));
      const cats = order(items.map(i => i.category), D.categories);
      const sizes = order(items.map(i => i.size), D.sizes);
      const sel = (id, label, all, opts) => `
        <div class="min-w-0">
          <label class="sr-only" for="${id}">${label}</label>
          <select id="${id}" class="input">${all ? `<option value="">${all}</option>` : ''}${opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
        </div>`;
      // a single-lot catalogue has nothing to filter: keep only the search hidden too
      const few = items.length <= 1;
      $('filters').innerHTML = few ? '' : `
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
          <div class="flex gap-2 lg:w-[280px] lg:shrink-0">
            <div class="relative flex-1">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--muted)]">${ic('search')}</span>
              <label class="sr-only" for="f-q">Cari lot</label>
              <input id="f-q" type="search" class="input !pl-10" placeholder="Cari tajuk, kategori, saiz" autocomplete="off">
            </div>
            <button type="button" id="f-toggle" class="btn btn-outline lg:hidden" aria-expanded="false" aria-controls="f-more">Tapis<span id="f-n" class="num text-[14px]"></span></button>
          </div>
          <div id="f-more" class="hidden grid-cols-2 gap-2 sm:grid-cols-3 lg:!grid lg:flex-1 lg:grid-cols-[repeat(4,minmax(0,1fr))_minmax(0,1.35fr)]">
            ${sel('f-cat', 'Kategori', 'Semua kategori', cats.map(c => [c, c]))}
            ${sel('f-size', 'Saiz', 'Semua saiz', sizes.map(c => [c, c]))}
            ${sel('f-tier', 'Kategori harga', 'Semua harga', t.tiers.map(x => [x.id, x.name]))}
            ${sel('f-cond', 'Keadaan', 'Semua keadaan', D.conditions.map(c => [c, c]))}
            ${sel('f-sort', 'Susun', '', [['ending', 'Susun: hampir tamat'], ['price', 'Susun: harga tertinggi'], ['newest', 'Susun: terbaru']])}
          </div>
        </div>`;
      if (few) return;
      const bind = (id, key, ev) => $(id).addEventListener(ev || 'change', e => { f[key] = e.target.value; render(); });
      bind('f-q', 'q', 'input');
      bind('f-cat', 'cat'); bind('f-size', 'size'); bind('f-tier', 'tier'); bind('f-cond', 'cond'); bind('f-sort', 'sort');
      $('f-toggle').onclick = () => {
        const box = $('f-more');
        const open = box.classList.toggle('hidden') === false;
        box.classList.toggle('grid', open);
        $('f-toggle').setAttribute('aria-expanded', String(open));
      };
    }

    function resetFilters() {
      Object.assign(f, { q: '', cat: '', size: '', tier: '', cond: '', sort: 'ending' });
      ['f-q', 'f-cat', 'f-size', 'f-tier', 'f-cond'].forEach(id => { if ($(id)) $(id).value = ''; });
      if ($('f-sort')) $('f-sort').value = 'ending';
      render();
    }

    /* ---------- results ---------- */
    function priceOf(i, stats) { const st = stats[i.id]; return st ? st.top.amount : i.startPrice; }

    function filtered(items, stats, now) {
      const q = f.q.trim().toLowerCase();
      const list = items.filter(i => items.length <= 1 || A.status(i, now) === f.tab)
        .filter(i => !q || (i.title + ' ' + i.category + ' ' + (i.desc || '') + ' ' + i.size).toLowerCase().includes(q))
        .filter(i => !f.cat || i.category === f.cat)
        .filter(i => !f.size || i.size === f.size)
        .filter(i => !f.tier || i.tier === f.tier)
        .filter(i => !f.cond || i.condition === f.cond);
      const sorters = {
        ending: f.tab === 'upcoming' ? (a, b) => a.startAt - b.startAt : f.tab === 'ended' ? (a, b) => b.endAt - a.endAt : (a, b) => a.endAt - b.endAt,
        price: (a, b) => priceOf(b, stats) - priceOf(a, stats),
        newest: (a, b) => b.startAt - a.startAt || (b.createdAt || 0) - (a.createdAt || 0),
      };
      return list.sort(sorters[f.sort] || sorters.ending);
    }

    function favBtn(i, fav) {
      return `<button type="button" data-fav="${esc(i.id)}" aria-pressed="${fav}" aria-label="${fav ? 'Buang dari kegemaran' : 'Simpan ke kegemaran'}" title="${fav ? 'Dalam kegemaran' : 'Simpan ke kegemaran'}"
        class="fav-btn absolute right-3 top-3 grid h-11 w-11 place-items-center rounded-lg">${ic('heart', 'h-[18px] w-[18px]', fav ? 'currentColor' : 'none')}</button>`;
    }

    function stateBadge(st, mineLead, mineOut) {
      if (mineLead) return '<span class="status status-ok">Anda tertinggi</span>';
      if (mineOut) return '<span class="status status-bad">Dilepasi</span>';
      return ui.statusBadge(st);
    }

    /* Grid card (shops with several lots): large photo, light title, regular-weight price */
    function card(i, t, stats, favs, uid, now) {
      const st = A.status(i, now);
      const bs = stats[i.id];
      const count = bs ? bs.count : 0;
      const fav = favs.includes(i.id);
      const href = ui.link('item.html', { id: i.id });
      const mineLead = uid && bs && st === 'live' && bs.top.userId === uid;
      const mineOut = uid && bs && st === 'live' && !mineLead && bs.users.has(uid);
      const priceLabel = st === 'ended' ? (count ? 'Harga akhir' : 'Tiada bidaan') : (count ? 'Bidaan tertinggi' : 'Harga mula');
      let time;
      if (st === 'live') time = `Tamat dalam <span class="num whitespace-nowrap text-[var(--ink)]" data-countdown-end="${i.endAt}">${ui.countdown(i.endAt - now)}</span>`;
      else if (st === 'upcoming') time = `Mula dalam <span class="num whitespace-nowrap text-[var(--warn)]" data-countdown-start="${i.startAt}">${ui.countdown(i.startAt - now)}</span>`;
      else time = `Tamat <span class="num whitespace-nowrap">${esc(shortDate(i.endAt))}</span>`;
      return `
        <article class="relative min-w-0" data-card="${esc(i.id)}">
          <a href="${href}" class="swatch block aspect-[4/5] overflow-hidden rounded-xl" tabindex="-1" aria-hidden="true">
            <img src="${ui.itemImage(i, 0)}" alt="" loading="lazy" class="h-full w-full object-cover ${st === 'ended' ? 'opacity-80 grayscale-[35%]' : ''}">
          </a>
          ${favBtn(i, fav)}
          <a href="${href}" class="row-link block pt-4">
            <div class="flex items-center justify-between gap-3">
              <span class="lot">${ui.lotNo(i)}</span>
              ${stateBadge(st, mineLead, mineOut)}
            </div>
            <h3 class="lot-title mt-1.5 line-clamp-2 text-[20px] sm:text-[22px]">${esc(i.title)}</h3>
            <p class="meta mt-1 truncate">Saiz ${esc(i.size)} · ${esc(i.condition)}</p>
            <div class="price mt-4 whitespace-nowrap text-[24px] sm:text-[26px] ${st === 'ended' ? 'text-[var(--ink-2)]' : ''}" data-price>${money(priceOf(i, stats))}</div>
            <div class="meta mt-1">${priceLabel}${count ? ` · <span class="num">${count}</span> bidaan` : ''}</div>
            <div class="meta mt-1">${time}</div>
          </a>
        </article>`;
    }

    /* Single-lot catalogue (e.g. the PAS KB charity lot): the lot as a large spec sheet */
    function featured(i, t, stats, favs, uid, now) {
      const s = EB.store.get();
      const st = A.status(i, now);
      const bs = stats[i.id];
      const count = bs ? bs.count : 0;
      const bidders = bs ? bs.users.size : 0;
      const tier = EB.tenant.tier(t, i.tier);
      const fav = favs.includes(i.id);
      const href = ui.link('item.html', { id: i.id });
      const lead = uid && bs && st === 'live' && bs.top.userId === uid;
      const out = uid && bs && st === 'live' && !lead && bs.users.has(uid);
      const priceLabel = st === 'ended' ? (count ? 'Harga akhir' : 'Tiada bidaan') : (count ? 'Bidaan tertinggi' : 'Harga mula');
      const next = A.minNextBid(i, s);
      const inc = A.increment(i, s);
      const time = st === 'live'
        ? `<dt>Tamat dalam · ${esc(ui.fmtDate(i.endAt))}</dt><dd class="text-[30px] sm:text-[34px]" data-countdown-end="${i.endAt}">${ui.countdown(i.endAt - now)}</dd>`
        : st === 'upcoming'
          ? `<dt>Mula dalam · ${esc(ui.fmtDate(i.startAt))}</dt><dd class="text-[30px] sm:text-[34px] text-[var(--warn)]" data-countdown-start="${i.startAt}">${ui.countdown(i.startAt - now)}</dd>`
          : `<dt>Lelongan tamat</dt><dd class="text-[26px] sm:text-[30px]">${esc(ui.fmtDate(i.endAt))}</dd>`;
      return `
        <article class="grid gap-8 md:grid-cols-12 md:gap-10 lg:gap-16" data-card="${esc(i.id)}">
          <div class="relative -mx-4 sm:mx-0 md:col-span-5">
            <a href="${href}" class="swatch block aspect-[4/5] overflow-hidden sm:rounded-xl" tabindex="-1" aria-hidden="true">
              <img src="${ui.itemImage(i, 0)}" alt="" class="h-full w-full object-cover">
            </a>
            ${favBtn(i, fav)}
          </div>
          <div class="min-w-0 md:col-span-7 md:pt-1">
            <div class="flex items-center justify-between gap-3">
              <span class="lot">${ui.lotNo(i)} · ${esc(tier.name)}</span>
              ${stateBadge(st, lead, out)}
            </div>
            <h2 class="lot-title mt-3 text-[30px] sm:text-[38px] lg:text-[44px]"><a href="${href}" class="hover:underline hover:decoration-1 hover:underline-offset-[6px]">${esc(i.title)}</a></h2>
            <p class="meta mt-3">${esc(i.category)} · Saiz ${esc(i.size)} · ${esc(i.condition)}</p>
            <dl class="spec mt-8 grid grid-cols-2 gap-x-6 gap-y-7 border-t border-line pt-7">
              <div class="col-span-2"><dt>${priceLabel}</dt>
                <dd class="price whitespace-nowrap text-[clamp(40px,12vw,60px)] ${st === 'ended' ? 'text-[var(--ink-2)]' : ''}" data-price>${money(priceOf(i, stats))}</dd></div>
              <div class="col-span-2">${time}</div>
              ${st !== 'ended' ? `<div><dt>Bidaan minima seterusnya<span class="block">Kenaikan ${money(inc)}</span></dt><dd class="whitespace-nowrap text-[22px] sm:text-[28px]">${money(next)}</dd></div>` : ''}
              <div><dt>Jumlah bidaan<span class="block">Daripada ${bidders} pembida</span></dt><dd class="num text-[22px] sm:text-[28px]">${count}</dd></div>
            </dl>
            <div class="mt-9 flex flex-col gap-4 sm:flex-row sm:items-center sm:gap-8">
              <a href="${href}" class="btn ${st === 'live' ? 'btn-brand' : 'btn-outline'} btn-lg w-full sm:w-auto sm:min-w-[240px]">${ctaFor(st)}</a>
              <a href="${href}#history" class="link-arrow min-h-[44px] self-start sm:self-auto">Butiran dan sejarah bidaan</a>
            </div>
            ${st === 'live' ? `<p class="meta mt-4">Yuran penyertaan <span class="num">${ui.money(t.settings.fee)}</span> dibayar sekali pada bidaan pertama anda.</p>` : ''}
          </div>
        </article>`;
    }

    function renderResults(s, t, items, stats, now) {
      const uid = EB.auth.userId();
      const favs = favList(s);
      const list = filtered(items, stats, now);
      const anyFilter = f.q || f.cat || f.size || f.tier || f.cond;
      const nFilter = [f.cat, f.size, f.tier, f.cond].filter(Boolean).length;
      if ($('f-n')) $('f-n').textContent = nFilter ? String(nFilter) : '';
      const single = list.length === 1 && !anyFilter && items.length === 1;
      // the spec sheet shows next-minimum, which moves with the last-window rule: include it in the signature
      const extra = single ? [A.minNextBid(list[0], s), A.increment(list[0], s)] : 0;
      const sig = JSON.stringify([f, uid, favs, t.tiers, extra, list.map(i => [i.id, i.title, i.tier, i.color, i.size, i.condition, A.status(i, now), priceOf(i, stats), stats[i.id] ? stats[i.id].count : 0, stats[i.id] ? stats[i.id].users.size : 0, stats[i.id] ? stats[i.id].top.userId === uid : 0])]);
      const changed = setIfChanged('results', $('results'), sig, () => {
        const emptyText = {
          live: ['Tiada lot sedang dibida sekarang.', 'Lihat lot yang akan datang, atau semak keputusan lelongan yang telah tamat.', 'upcoming', 'Lihat lot akan datang'],
          upcoming: ['Tiada lot dijadualkan buat masa ini.', 'Lot baharu akan disenaraikan di sini sebelum dibuka untuk bidaan.', 'live', 'Lihat lot sedang berlangsung'],
          ended: ['Belum ada lelongan yang tamat.', 'Keputusan setiap lot akan dipaparkan di sini selepas masa tamat.', 'live', 'Lihat lot sedang berlangsung'],
        }[f.tab];
        const none = !items.length;
        return `
          ${list.length && !single ? `<div class="mb-5 flex min-h-[44px] items-center justify-between text-[14px] text-[var(--muted)]">
            <span><span class="num text-[var(--ink)]">${list.length}</span> lot</span>
            ${anyFilter ? `<button type="button" data-reset class="btn-link min-h-[44px]">Kosongkan carian</button>` : ''}
          </div>` : ''}
          ${single ? featured(list[0], t, stats, favs, uid, now)
            : list.length ? `<div class="lot-grid grid grid-cols-1 gap-x-6 gap-y-12 min-[480px]:grid-cols-2 lg:grid-cols-3 lg:gap-x-8 lg:gap-y-16">${list.map(i => card(i, t, stats, favs, uid, now)).join('')}</div>`
            : `<div class="tile px-5 py-10 md:px-10 md:py-14">
                <p class="font-serif text-[26px] md:text-[32px] leading-tight">${none ? 'Katalog belum dibuka.' : anyFilter ? 'Tiada lot sepadan dengan carian anda.' : emptyText[0]}</p>
                <p class="mt-2 max-w-md text-[16px] text-[var(--ink-2)]">${none ? 'Penjual sedang menyediakan lot. Semak semula tidak lama lagi.' : anyFilter ? 'Cuba kata kunci lain, atau buang tapisan saiz dan keadaan.' : emptyText[1]}</p>
                ${none ? '' : anyFilter ? `<button type="button" data-reset class="btn btn-brand mt-6">Kosongkan carian</button>`
                  : `<button type="button" data-tab="${emptyText[2]}" class="btn btn-brand mt-6">${emptyText[3]}</button>`}
              </div>`}`;
      });
      // bump prices that changed since the last render
      list.forEach(i => {
        const p = priceOf(i, stats);
        if (changed && prevPrice[i.id] !== undefined && prevPrice[i.id] !== p) {
          const el = document.querySelector(`[data-card="${CSS.escape(i.id)}"] [data-price]`);
          if (el) { el.classList.add('bump', 'flash'); }
        }
        prevPrice[i.id] = p;
      });
    }

    /* ---------- story (editorial, from item.story of the featured lot) ---------- */
    function renderStory(items, now) {
      const feat = featuredLot(items, now);
      const st = feat && feat.story;
      const body = st && Array.isArray(st.body) ? st.body.filter(p => String(p || '').trim()) : [];
      const has = st && (st.headline || st.subheadline || body.length || st.closing || st.tagline);
      setIfChanged('story', $('story'), JSON.stringify([feat && feat.id, has ? st : null]), () => !has ? '' : `
        <article class="mt-20 grid gap-8 md:mt-32 md:grid-cols-12 md:gap-10" aria-label="Cerita lot">
          <header class="md:col-span-5">
            ${st.headline ? `<h2 class="font-serif text-[36px] leading-[1.05] tracking-[-0.015em] sm:text-[44px] lg:text-[52px]">${esc(st.headline)}</h2>` : ''}
            ${st.subheadline ? `<p class="mt-4 max-w-md text-[17px] leading-snug text-[var(--muted)] md:text-[18px]">${esc(st.subheadline)}</p>` : ''}
          </header>
          <div class="min-w-0 md:col-span-7 md:pt-2">
            ${body.length ? `<div class="story-body max-w-[65ch] text-[17px] leading-[1.7] text-[var(--ink-2)]">${body.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : ''}
            ${st.closing ? `<p class="mt-10 max-w-[24ch] font-serif text-[28px] font-medium leading-[1.15] sm:text-[34px]">${esc(st.closing)}</p>` : ''}
            ${st.tagline ? `<p class="mt-4 text-[15px] italic text-[var(--muted)]">${esc(st.tagline)}</p>` : ''}
          </div>
        </article>`);
    }

    /* ---------- video in a modal (hero link) ---------- */
    function openVideo(id) {
      const i = EB.store.get().items.find(x => x.id === id);
      if (!i || !i.video) return;
      ui.modal({
        title: i.title,
        body: `<div data-player class="-mx-5 overflow-hidden bg-black sm:mx-0 sm:rounded-lg"><p class="px-5 py-10 text-center text-[15px] text-white/80">Memuatkan video…</p></div>`,
        actions: [{ label: 'Tutup' }],
        onOpen(wrap) {
          const box = wrap.querySelector('.eb-modal');
          if (box) { box.classList.remove('sm:max-w-md'); box.classList.add('sm:max-w-3xl'); }
          const el = wrap.querySelector('[data-player]');
          EB.media.mount(el, i.video, { poster: ui.itemImage(i, 0), maxHeight: '70vh',
            emptyHtml: '<p class="px-5 py-10 text-center text-[15px] text-white/80">Video tidak dapat dimainkan di peranti ini. Cuba buka halaman lot.</p>' })
            .catch(() => { el.innerHTML = '<p class="px-5 py-10 text-center text-[15px] text-white/80">Video tidak dapat dimuatkan. Semak sambungan internet dan cuba lagi.</p>'; });
        },
      });
    }
    $('hero').addEventListener('click', e => { const b = e.target.closest('[data-video]'); if (b) openVideo(b.getAttribute('data-video')); });

    /* ---------- beneficiary statement ---------- */
    function renderBenef(t) {
      setIfChanged('benef', $('benef'), JSON.stringify([t.beneficiary, t.slogan]), () => !t.beneficiary ? '' : `
        <div class="mt-16 grid gap-3 border-t border-line pt-8 md:mt-24 md:grid-cols-12 md:gap-10 md:pt-10">
          <h2 class="eyebrow md:col-span-3 md:pt-1.5">Hasil bidaan</h2>
          <div class="md:col-span-9">
            <p class="font-serif text-[24px] leading-[1.25] md:text-[32px]">${esc(t.beneficiary)}</p>
            ${t.slogan ? `<p class="mt-4 text-[16px] text-[var(--muted)]">${esc(t.slogan)}</p>` : ''}
          </div>
        </div>`);
    }

    /* ---------- how to bid + tier table ---------- */
    function renderHelp(t) {
      const st = t.settings;
      const mult = st.lastWindowMultiplier || 2;
      setIfChanged('cara', $('cara'), JSON.stringify(st), () => {
        const steps = [
          ['Daftar akaun', 'Isi nama seperti dalam kad pengenalan, no. kad pengenalan, e-mel dan telefon. Pendaftaran percuma.'],
          [`Bayar yuran ${ui.money(st.fee)}`, 'Dibayar sekali bagi setiap lot, pada bidaan pertama anda, melalui FPX (Bayarcash). Yuran tidak dikembalikan.'],
          ['Masukkan bidaan', `Bidaan mesti sekurang-kurangnya bidaan tertinggi campur kenaikan minima.${st.lastWindowOn ? ` Dalam ${st.lastWindowMin} minit terakhir, kenaikan minima menjadi x${mult}.` : ''} Bidaan yang disahkan tidak boleh dibatalkan.`],
          ['Menang dan bayar', `Bidaan tertinggi semasa masa tamat menang. Bayar dalam ${st.payDeadlineHours} jam; jika tidak, lot ditawarkan kepada pembida seterusnya.`],
        ];
        return `
          <h2 class="font-serif text-[32px] md:text-[44px] leading-[1.1]">Cara membida</h2>
          <p class="mt-3 max-w-xl text-[16px] text-[var(--ink-2)]">Lelongan terbuka: semua pembida nampak bidaan tertinggi dan masa yang tinggal.</p>
          <ol class="mt-8 grid gap-x-10 md:mt-12 md:grid-cols-2 lg:grid-cols-4">
            ${steps.map(([h, p], n) => `
              <li class="border-t border-line py-6 lg:pr-2">
                <span class="sr-only">Langkah ${n + 1}: </span>
                <h3 class="step-h font-serif text-[20px] md:text-[22px] leading-snug">${h}</h3>
                <p class="mt-2 text-[15px] leading-relaxed text-[var(--ink-2)]">${p}</p>
              </li>`).join('')}
          </ol>
          ${st.winLimit ? `<p class="meta mt-2">Had kelayakan: anda boleh mendahului atau memenangi maksimum <span class="num text-[var(--ink)]">${st.winLimit}</span> lot serentak di kedai ini.</p>` : ''}`;
      });
      setIfChanged('tiers', $('tiers'), JSON.stringify([t.tiers, st]), () => `
        <div class="tile -mx-4 rounded-none px-4 py-10 sm:mx-0 sm:rounded-xl sm:px-8 md:p-12">
          <div class="grid gap-8 lg:grid-cols-12 lg:gap-12">
            <div class="lg:col-span-4">
              <h2 class="font-serif text-[28px] md:text-[36px] leading-[1.1]">Harga dan kenaikan</h2>
              <p class="mt-3 text-[16px] text-[var(--ink-2)]">Setiap lot diletakkan dalam satu kategori harga. Bidaan mesti ikut kenaikan minima kategori itu.</p>
            </div>
            <div class="min-w-0 lg:col-span-8">
              <table class="table hidden sm:table">
                <thead><tr><th>Kategori</th><th class="!text-right">Harga minima</th><th class="!text-right">Kenaikan</th><th class="!text-right">${st.lastWindowOn ? `${st.lastWindowMin} minit akhir` : 'Minit akhir'}</th></tr></thead>
                <tbody>
                  ${t.tiers.map(x => `<tr>
                    <td class="whitespace-nowrap">${esc(x.name)}</td>
                    <td class="num whitespace-nowrap">${money(x.minPrice)}</td>
                    <td class="num whitespace-nowrap">${money(x.increment)}</td>
                    <td class="num whitespace-nowrap ${st.lastWindowOn ? '' : 'text-[var(--muted)]'}">${st.lastWindowOn ? money(x.increment * mult) : 'Tidak berkenaan'}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
              <ul class="divide-y divide-[#d3d4d8] border-y border-[#d3d4d8] sm:hidden">
                ${t.tiers.map(x => `<li class="py-4">
                  <div class="font-serif text-[20px]">${esc(x.name)}</div>
                  <dl class="mt-2 grid grid-cols-[minmax(0,1fr)_auto] gap-x-4 gap-y-1 text-[15px]">
                    <dt class="text-[var(--muted)]">Harga minima</dt><dd class="num text-right">${money(x.minPrice)}</dd>
                    <dt class="text-[var(--muted)]">Kenaikan</dt><dd class="num text-right">${money(x.increment)}</dd>
                    <dt class="text-[var(--muted)]">${st.lastWindowOn ? `${st.lastWindowMin} minit akhir` : 'Minit akhir'}</dt><dd class="num text-right">${st.lastWindowOn ? money(x.increment * mult) : 'Tidak berkenaan'}</dd>
                  </dl>
                </li>`).join('')}
              </ul>
              <p class="meta mt-4">${st.lastWindowOn ? `Dalam ${st.lastWindowMin} minit terakhir setiap lot, kenaikan minima digandakan x${mult} supaya bidaan saat akhir lebih adil.` : 'Peraturan minit terakhir tidak diaktifkan untuk kedai ini.'}</p>
            </div>
          </div>
        </div>`);
    }

    /* ---------- main render (safe to call often: only changed parts touch the DOM) ---------- */
    function render() {
      const s = EB.store.get();
      const t = EB.tenant.current();
      const now = Date.now();
      const items = tenantItems(s);
      const stats = bidStats(s);
      renderHero(s, t, items, now);
      renderMyBids(s, items, stats, now);
      renderTabs(items, now);
      renderResults(s, t, items, stats, now);
      renderStory(items, now);
      renderBenef(t);
      renderHelp(t);
    }

    /* ---------- events ---------- */
    app.addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]');
      if (tab) { f.tab = tab.getAttribute('data-tab'); render(); return; }
      if (e.target.closest('[data-reset]')) { resetFilters(); return; }
      const fav = e.target.closest('[data-fav]');
      if (fav) {
        e.preventDefault();
        const uid = EB.auth.userId();
        if (!uid) { location.href = ui.link('login.html', { next: location.pathname + location.search + '#cari' }); return; }
        const id = fav.getAttribute('data-fav');
        let added = false;
        EB.store.update(s => {
          s.favourites = s.favourites || {};
          const arr = s.favourites[uid] || (s.favourites[uid] = []);
          const k = arr.indexOf(id);
          if (k >= 0) arr.splice(k, 1); else { arr.push(id); added = true; }
        });
        ui.toast(added ? 'Disimpan ke Kegemaran.' : 'Dibuang dari Kegemaran.', added ? 'success' : 'info');
      }
    });
    // arrow keys move between tabs
    $('tabs').addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const k = TABS.findIndex(x => x[0] === f.tab);
      f.tab = TABS[(k + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0];
      render();
      const b = $('tabs').querySelector(`[data-tab="${f.tab}"]`); if (b) b.focus();
    });

    renderFilters();
    render();
    EB.store.subscribe(render);
    setInterval(render, 1000); // picks up upcoming → live → ended changes
    if (location.hash === '#cari' || location.hash === '#cara') setTimeout(() => { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }, 50);
  })();
  </script>
</body>
</html>
