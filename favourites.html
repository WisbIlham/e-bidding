<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kegemaran · eBid Baju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auction.js"></script>
  <script src="assets/ui.js"></script>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8" id="app"></main>
  <div id="eb-footer"></div>
  <script>
    EB.init({ area: 'bidder', active: 'fav', title: 'Kegemaran' });
    const U = EB.ui;
    const prevHigh = {};

    function loginNote(msg) {
      return `<div class="tile max-w-xl px-6 py-10 md:px-10 md:py-12">
        <p class="font-serif text-[22px] md:text-[26px] leading-snug text-ink">${msg}</p>
        <a href="${U.link('login.html', { next: location.pathname + location.search + location.hash })}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Log masuk</a>
      </div>`;
    }

    /** One catalogue entry: image 4:5, lot no + status, display title, meta, price, time, remove */
    function entry(item, s, uid) {
      const st = EB.auction.status(item);
      const all = EB.auction.bidsFor(item.id, s);
      const h = all[0];
      const price = h ? h.amount : item.startPrice;
      const changed = prevHigh[item.id] !== undefined && prevHigh[item.id] !== price;
      prevHigh[item.id] = price;
      const lead = h && h.userId === uid;
      const iBid = all.some(b => b.userId === uid);
      const href = U.link('item.html', { id: item.id });
      const priceLabel = st === 'ended' ? (item.result && item.result.winnerId ? 'Harga menang' : 'Harga mula') : h ? 'Bidaan tertinggi' : 'Harga mula';
      let time;
      if (st === 'live') time = `Tamat dalam <span class="whitespace-nowrap tabular-nums text-ink" data-countdown-end="${item.endAt}">${U.countdown(item.endAt - Date.now())}</span>`;
      else if (st === 'upcoming') time = `Mula dalam <span class="whitespace-nowrap tabular-nums text-[var(--warn)]" data-countdown-start="${item.startAt}">${U.countdown(item.startAt - Date.now())}</span>`;
      else time = `Tamat <span class="whitespace-nowrap tabular-nums">${U.fmtDate(item.endAt)}</span>`;
      const mine = iBid && st === 'live' ? U.statusBadge(lead ? 'leading' : 'outbid') : '';

      return `<article class="min-w-0 ${changed ? 'flash' : ''}">
        <a href="${href}" class="block overflow-hidden rounded-xl bg-tile" aria-label="${U.esc(item.title)}">
          <img src="${U.itemImage(item)}" alt="" loading="lazy" class="aspect-[4/5] w-full object-cover">
        </a>
        <div class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-1"><span class="lot">${U.lotNo(item)}</span>${U.statusBadge(st)}${mine}</div>
        <h2 class="mt-1"><a href="${href}" class="lot-title block text-[18px] md:text-[20px] text-ink line-clamp-2 hover:underline underline-offset-4 decoration-1">${U.esc(item.title)}</a></h2>
        <p class="meta mt-1">${U.esc(item.category)} · Saiz ${U.esc(item.size)} · ${U.esc(item.condition)}</p>
        <div class="mt-4 text-[14px] text-muted">${priceLabel}</div>
        <div class="price mt-0.5 text-[20px] sm:text-[24px] text-ink ${changed ? 'bump inline-block' : ''}">${U.money(price)}</div>
        <p class="mt-1.5 text-[14px] text-muted">${time}</p>
        <button data-remove="${U.esc(item.id)}" class="mt-1 inline-flex min-h-[44px] items-center text-left text-[14px] text-ink-2 underline underline-offset-4 decoration-1 hover:text-ink">Buang dari kegemaran</button>
      </article>`;
    }

    function render() {
      const app = document.getElementById('app');
      const user = EB.auth.user();
      const t = EB.tenant.current();
      const head = meta => `<header class="mb-8 md:mb-12">
          <h1 class="font-serif text-[30px] md:text-[40px] font-normal leading-[1.1] text-ink">Kegemaran</h1>
          <p class="mt-2 text-[16px] text-muted">${meta}</p>
        </header>`;
      if (!user) { app.innerHTML = head(U.esc(t.name)) + loginNote('Log masuk untuk melihat item yang anda simpan.'); return; }
      const s = EB.store.get();
      const ids = (s.favourites && s.favourites[user.id]) || [];
      const order = { live: 0, upcoming: 1, ended: 2 };
      const items = ids.map(id => s.items.find(i => i.id === id)).filter(i => i && i.tenant === t.slug)
        .sort((a, b) => order[EB.auction.status(a)] - order[EB.auction.status(b)] || a.endAt - b.endAt);

      app.innerHTML = head(items.length
          ? `<span class="tabular-nums">${items.length}</span> item disimpan di ${U.esc(t.name)} · harga dan masa dikemas kini secara langsung`
          : U.esc(t.name))
        + (items.length
          ? `<div class="grid grid-cols-2 gap-x-4 gap-y-12 sm:grid-cols-3 sm:gap-x-6 lg:grid-cols-4 lg:gap-x-8">${items.map(i => entry(i, s, user.id)).join('')}</div>`
          : `<div class="tile px-6 py-12 md:py-16 text-center">
              <p class="font-serif text-[22px] md:text-[26px] leading-snug text-ink">Belum ada item disimpan.</p>
              <p class="mt-2 text-[16px] text-muted max-w-md mx-auto">Simpan item dari katalog untuk mengikuti harga dan masanya di sini.</p>
              <a href="${U.link('shop.html')}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Lihat item lelongan</a>
            </div>`);

      app.querySelectorAll('[data-remove]').forEach(b => b.onclick = e => {
        e.preventDefault();
        const id = b.dataset.remove;
        const item = s.items.find(i => i.id === id);
        EB.store.update(st => {
          st.favourites = st.favourites || {};
          st.favourites[user.id] = (st.favourites[user.id] || []).filter(x => x !== id);
        });
        U.toast('"' + (item ? item.title : id) + '" dibuang dari kegemaran.');
      });
      U.tickCountdowns();
    }

    render();
    EB.store.subscribe(render);
  </script>
</body>
</html>
