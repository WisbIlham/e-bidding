<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bidaan langsung · PAS Kawasan Kota Bharu</title>
<meta name="description" content="Ikuti secara langsung bidaan baju Almarhum Tuan Guru Nik Abdul Aziz Nik Mat di Majlis Makan Malam Kutipan Dana PRU Ke-16 PAS Kawasan Kota Bharu.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/live.css">
<style>
  html { scroll-behavior: smooth; }
  section[id] { scroll-margin-top: 72px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .top .id { min-width: 0; }
  .top .org { font-weight: 500; font-size: 16px; line-height: 1.2; }
  .top .ev { font-size: 13px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peek { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px; text-decoration: none; }
  .peek .status { gap: 0; }
  .peek b { font: 400 20px/1 var(--display); font-variant-numeric: tabular-nums; }

  /* hero */
  .hero { position: relative; background: var(--ink); color: #fff; }
  .hero .wrap { padding: 0; }
  .hero-img { width: 100%; height: clamp(360px, 62svh, 520px); object-fit: cover; object-position: 50% 12%; }
  .hero-copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 16px 24px; background: rgba(1, 2, 5, .72); }
  .hero .eyebrow { color: rgba(255, 255, 255, .78); margin-bottom: 8px; }
  .hero h1 { font-size: clamp(28px, 7.4vw, 52px); line-height: 1.08; color: #fff; }

  /* live panel */
  .live { padding: 24px 0 8px; }
  .panel { padding: 20px 16px 22px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; }
  .count { font-size: 14px; color: var(--ink-2); }
  .plabel { margin-top: 20px; font-size: 14px; color: var(--ink-2); }
  .price { display: inline-block; margin: 2px 0 0 -6px; padding: 0 6px; border-radius: 6px; font: 400 clamp(44px, 12vw, 72px)/1.05 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .price.word { font-size: clamp(36px, 9vw, 52px); }
  .by { margin-top: 6px; font-size: 18px; overflow-wrap: anywhere; }
  .by strong { font-weight: 500; }
  .next { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-strong); font-size: 16px; }
  .next b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .winner { margin-top: 18px; padding: 16px; background: var(--ink); color: #fff; border-radius: 8px; }
  .winner .k { font-size: 14px; color: rgba(255, 255, 255, .72); }
  .winner .v { margin-top: 2px; font: 400 clamp(24px, 6.4vw, 32px)/1.2 var(--display); overflow-wrap: anywhere; }
  .winner .v .num { white-space: nowrap; }
  .paid { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ok); font-weight: 500; }
  .paid::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .news { margin-top: 14px; min-height: 0; font-size: 15px; color: var(--ink); }
  .news:empty { display: none; }
  .news.flash { border-radius: 6px; }
  .foot-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .foot-note p + p { margin-top: 4px; }
  .rule { font-size: 14px; color: var(--ink-2); }

  /* bid history */
  .history { padding-top: 32px; }
  .history-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
  .history h2 { font-size: clamp(26px, 6vw, 34px); }
  .bids li { min-height: 56px; align-items: center; }
  .bids .name { display: block; font-weight: 500; }
  .bids .amt { font-size: 18px; }
  .bids li.empty { color: var(--muted); justify-content: flex-start; }

  /* content sections */
  .sec { padding: 56px 0 0; }
  .sec h2 { font-size: clamp(28px, 7vw, 44px); }
  .story .sub { margin-top: 12px; font-size: 18px; color: var(--ink-2); }
  .story .body { margin-top: 24px; }
  .story .body p + p { margin-top: 14px; }
  .story .close { margin-top: 28px; font: 400 clamp(22px, 5.6vw, 28px)/1.25 var(--display); }
  .story .tag { margin-top: 6px; color: var(--muted); }
  .benef { margin-top: 28px; padding: 16px; }
  .benef .k { font-size: 13px; color: var(--muted); }
  .video { margin-top: 32px; }
  .video video { width: 100%; max-width: 400px; aspect-ratio: 407 / 720; background: var(--ink); border-radius: 8px; object-fit: contain; }
  .video .cap { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .gallery h2 { margin-bottom: 20px; }
  .strip { list-style: none; margin: 0 -16px; padding: 0 16px 8px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; -webkit-overflow-scrolling: touch; }
  .strip li { flex: 0 0 72%; max-width: 300px; scroll-snap-align: start; }
  .shot { display: block; width: 100%; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: var(--tile); cursor: zoom-in; }
  .shot img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .strip figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.4; }

  /* lightbox */
  .lb { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--ink); color: #fff; }
  .lb::backdrop { background: var(--ink); }
  .lb-in { height: 100%; display: flex; flex-direction: column; }
  .lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; }
  .lb-bar .n { font-size: 14px; color: rgba(255, 255, 255, .72); }
  .lb-fig { flex: 1; min-height: 0; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px; }
  .lb-fig img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; }
  .lb-fig figcaption { margin-top: 10px; font-size: 14px; color: rgba(255, 255, 255, .78); text-align: center; }
  .lb-nav { display: flex; gap: 12px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .lb-nav .btn { flex: 1; }
  .lb .btn-outline { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .6); }
  .lb .btn-outline:hover { background: rgba(255, 255, 255, .1); }
  .lb .btn-sm { min-height: 44px; }

  footer { margin-top: 72px; padding: 28px 0 calc(32px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  footer p + p { margin-top: 4px; color: var(--muted); }

  @media (min-width: 720px) {
    .hero .wrap { padding: 0 16px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 48px; }
    .hero-img { width: 330px; height: 560px; object-position: 50% 0; }
    .hero-copy { position: static; padding: 0 0 56px; background: none; }
    .hero h1 { font-size: clamp(36px, 4.6vw, 52px); }
    .strip { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); overflow: visible; }
    .strip li { max-width: none; }
  }
  @media (min-width: 960px) {
    section[id] { scroll-margin-top: 88px; }
    .live-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: start; padding-top: 40px; }
    .live { padding: 0; position: sticky; top: 84px; }
    .panel { padding: 28px 28px 30px; }
    .history { padding-top: 6px; }
    .sec { padding-top: 96px; }
    .story-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 64px; align-items: start; }
    .video { margin-top: 0; }
    footer { margin-top: 112px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .flash, .status.open::before { animation: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="id">
      <div class="org" id="org"></div>
      <div class="ev" id="ev"></div>
    </div>
    <a class="peek" id="peek" href="#live" hidden><span class="status" id="peekDot"></span><b id="peekPrice"></b></a>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="lotTitle">
    <div class="wrap">
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="lotTitle"></h1>
      </div>
      <img class="hero-img" id="heroImg" alt="" width="330" height="560" fetchpriority="high">
    </div>
  </section>

  <div class="wrap live-grid">
    <section class="live" id="live" aria-label="Status bidaan">
      <div class="panel tile" id="panel">
        <div class="panel-head">
          <span class="status" id="status">Memuatkan…</span>
          <span class="count num" id="count"></span>
        </div>
        <p class="plabel" id="plabel"></p>
        <p class="price" id="price" aria-live="off"></p>
        <p class="by" id="by" hidden></p>
        <p class="next" id="next" hidden></p>
        <div class="winner" id="winner" hidden></div>
        <p class="paid" id="paid" hidden>Bayaran telah disahkan</p>
        <p class="news" id="news" role="status" aria-live="polite"></p>
        <div class="foot-note">
          <p class="rule">Bidaan dibuat secara langsung dalam dewan dan direkod oleh urus setia.</p>
          <p class="conn" id="conn">Menyambung…</p>
        </div>
      </div>
    </section>

    <section class="history" id="sejarah" aria-labelledby="hTitle">
      <div class="history-head">
        <h2 id="hTitle">Senarai bidaan</h2>
        <span class="count num" id="hCount"></span>
      </div>
      <ul class="bids" id="bids"><li class="empty">Memuatkan…</li></ul>
    </section>
  </div>

  <div class="wrap">
    <section class="sec story" id="kisah" aria-labelledby="sTitle">
      <div class="story-grid">
        <div>
          <p class="eyebrow">Tentang lot ini</p>
          <h2 id="sTitle"></h2>
          <p class="sub" id="sSub"></p>
          <div class="body" id="sBody"></div>
          <p class="close" id="sClose"></p>
          <p class="tag" id="sTag"></p>
          <div class="benef tile">
            <p class="k">Hasil bidaan</p>
            <p id="benef"></p>
          </div>
        </div>
        <div class="video" id="videoBox"></div>
      </div>
    </section>

    <section class="sec gallery" id="gambar" aria-labelledby="gTitle">
      <h2 id="gTitle">Gambar</h2>
      <ul class="strip" id="strip"></ul>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>© 2026 PAS Kawasan Kota Bharu</p>
    <p id="slogan"></p>
  </div>
</footer>

<dialog class="lb" id="lb" aria-label="Gambar penuh">
  <div class="lb-in">
    <div class="lb-bar">
      <span class="n num" id="lbN"></span>
      <button class="btn btn-outline btn-sm" type="button" id="lbClose">Tutup</button>
    </div>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <div class="lb-nav">
      <button class="btn btn-outline btn-sm" type="button" id="lbPrev">Sebelum</button>
      <button class="btn btn-outline btn-sm" type="button" id="lbNext">Seterusnya</button>
    </div>
  </div>
</dialog>

<script src="assets/live.js"></script>
<script src="assets/lot.js"></script>
<script>
(function () {
  'use strict';
  var L = window.LOT || {}, esc = Live.esc, money = Live.money;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- static lot content (from assets/lot.js) ---------- */
  var org = L.org || '';
  $('org').textContent = org;
  $('ev').textContent = (L.event || '').replace(org, '').trim() || L.event || '';
  $('heroEyebrow').textContent = L.event || '';
  $('lotTitle').textContent = L.title || '';
  var hero = $('heroImg');
  hero.src = L.hero || '';
  hero.alt = L.shortTitle || L.title || '';

  var st = L.story || {};
  $('sTitle').textContent = st.headline || L.shortTitle || '';
  $('sSub').textContent = st.subheadline || '';
  $('sBody').innerHTML = [L.desc].concat(st.body || []).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  $('sClose').textContent = st.closing || '';
  $('sTag').textContent = st.tagline || '';
  $('benef').textContent = L.beneficiary || '';
  $('slogan').textContent = L.slogan || '';

  if (L.video && L.video.src) {
    $('videoBox').innerHTML =
      '<video controls playsinline preload="none" poster="' + esc(L.video.poster || '') + '" aria-label="' + esc(L.video.title || 'Video') + '">' +
      '<source src="' + esc(L.video.src) + '" type="video/mp4">Pelayar anda tidak menyokong video.</video>' +
      '<p class="cap">' + esc(L.video.title || '') + '</p>';
  }

  var imgs = L.images || [];
  $('strip').innerHTML = imgs.map(function (im, i) {
    return '<li><figure style="margin:0"><button class="shot" type="button" data-i="' + i + '" aria-label="Buka gambar penuh: ' + esc(im.alt) + '">' +
      '<img src="' + esc(im.src) + '" alt="' + esc(im.alt) + '" loading="lazy" decoding="async"></button>' +
      '<figcaption>' + esc(im.alt) + '</figcaption></figure></li>';
  }).join('');
  if (!imgs.length) $('gambar').hidden = true;

  /* ---------- lightbox ---------- */
  var lb = $('lb'), cur = 0;
  function show(i) {
    cur = (i + imgs.length) % imgs.length;
    $('lbImg').src = imgs[cur].src; $('lbImg').alt = imgs[cur].alt;
    $('lbCap').textContent = imgs[cur].alt;
    $('lbN').textContent = (cur + 1) + ' / ' + imgs.length;
    var single = imgs.length < 2;
    $('lbPrev').hidden = single; $('lbNext').hidden = single;
  }
  $('strip').addEventListener('click', function (e) {
    var b = e.target.closest('.shot'); if (!b) return;
    var i = +b.dataset.i;
    if (typeof lb.showModal !== 'function') { window.open(imgs[i].src, '_blank'); return; }
    show(i); lb.showModal();
  });
  $('lbClose').addEventListener('click', function () { lb.close(); });
  $('lbPrev').addEventListener('click', function () { show(cur - 1); });
  $('lbNext').addEventListener('click', function () { show(cur + 1); });
  lb.addEventListener('click', function (e) { if (e.target.classList.contains('lb-fig')) lb.close(); });
  lb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });

  /* ---------- live state ---------- */
  var prev = null, newsTimer = null, peekWanted = false, loaded = false;

  function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  function say(text) {
    var n = $('news'); clearTimeout(newsTimer);
    n.textContent = text; if (text) flash(n);
    newsTimer = setTimeout(function () { n.textContent = ''; }, 15000);
  }
  function setText(id, html) { var el = $(id); el.innerHTML = html || ''; el.hidden = !html; }

  function render(s, changed) {
    var bids = s.bids || [], n = bids.length, top = n ? bids[n - 1] : null;
    var status = s.status, startP = money(s.startPrice);

    var chip = $('status');
    chip.className = 'status' + (status === 'open' ? ' open' : status === 'closed' ? ' closed' : '');
    chip.textContent = status === 'open' ? 'Bidaan langsung' : status === 'closed' ? 'Bidaan ditutup' : 'Belum dibuka';

    var cnt = n ? n + ' bidaan' : '';
    $('count').textContent = cnt;
    $('hCount').textContent = cnt;

    var price = $('price'), label, priceText, word = false, by = '', next = '', win = '';
    if (status === 'closed') {
      var w = s.winner || (top ? { name: top.name, amount: top.amount } : null);
      if (w) {
        label = 'Harga akhir'; priceText = money(w.amount);
        win = '<p class="k">Pemenang</p><p class="v">' + esc(w.name) + ' — <span class="num">' + esc(money(w.amount)) + '</span></p>';
      } else {
        label = 'Keputusan'; priceText = 'Tiada bidaan'; word = true;
        by = 'Harga mula <span class="num">' + esc(startP) + '</span>';
      }
    } else if (top) {
      label = 'Bidaan tertinggi'; priceText = money(top.amount);
      by = 'oleh <strong>' + esc(top.name) + '</strong>';
    } else {
      label = 'Harga mula'; priceText = startP;
      by = status === 'open' ? 'Menunggu bidaan pertama.' : 'Bidaan belum dibuka. Sila tunggu pengumuman pengacara majlis.';
    }
    if (status === 'open') {
      next = !n ? 'Bidaan pertama sekurang-kurangnya <b>' + esc(money(s.minNext)) + '</b>'
        : (Number(s.increment) > 0 ? 'Bidaan seterusnya sekurang-kurangnya <b>' + esc(money(s.minNext)) + '</b>' : '');
    }

    $('plabel').textContent = label;
    price.textContent = priceText;
    price.classList.toggle('word', word);
    setText('by', by);
    setText('next', next);
    setText('winner', win);
    $('paid').hidden = !(status === 'closed' && s.paid);

    /* bid history, newest first */
    $('bids').innerHTML = n ? bids.slice().reverse().map(function (b, i) {
      return '<li' + (i === 0 ? ' id="topBid"' : '') + '><div class="who"><span class="name">' + esc(b.name) + '</span>' +
        '<span class="t num">' + esc(Live.time(b.at)) + (i === 0 && status !== 'closed' ? ' · tertinggi' : '') + '</span></div>' +
        '<span class="amt">' + esc(money(b.amount)) + '</span></li>';
    }).join('') : '<li class="empty">Belum ada bidaan.</li>';

    /* sticky header summary */
    $('peekDot').className = chip.className;
    $('peekPrice').textContent = word ? 'Tiada bidaan' : priceText;
    $('peek').setAttribute('aria-label', chip.textContent + ', ' + label + ' ' + priceText + '. Lihat status bidaan.');

    /* polite updates on change */
    if (changed && prev) {
      if (n > prev.n && top) {
        flash(price); if ($('topBid')) flash($('topBid'));
        say('Bidaan baharu diterima: ' + money(top.amount) + '.');
      } else if (n < prev.n && status === 'open' && prev.status === 'open') {
        say('Bidaan terakhir telah dibatalkan oleh urus setia.');
      } else if (status !== prev.status) {
        if (status === 'open') say(prev.status === 'closed' ? 'Bidaan dibuka semula.' : 'Bidaan telah dibuka.');
        else if (status === 'closed') { flash(price); say(s.winner ? 'Bidaan ditutup. Tahniah kepada ' + s.winner.name + '.' : 'Bidaan ditutup tanpa sebarang bidaan.'); }
        else say('');
      }
    }
    prev = { n: n, status: status, paid: !!s.paid };
    loaded = true; updatePeek();
  }

  function onConn(ok) {
    var c = $('conn');
    c.classList.toggle('bad', !ok);
    c.textContent = ok ? 'Dikemas kini ' + Live.time(Date.now() / 1000) : 'Sambungan terputus, mencuba semula…';
  }

  function updatePeek() { $('peek').hidden = !(loaded && peekWanted); }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      peekWanted = !es[0].isIntersecting; updatePeek();
    }, { rootMargin: '-60px 0px 0px 0px', threshold: 0.35 }).observe($('panel'));
  }

  Live.watch(render, onConn, 2000);
})();
</script>
</body>
</html>
