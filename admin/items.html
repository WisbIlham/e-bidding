<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item lelongan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../assets/tw-config.js?v=20261112d"></script>
  <link rel="stylesheet" href="../assets/app.css?v=20261112d">
  <script src="../assets/data.js?v=20261112d"></script>
  <script src="../assets/store.js?v=20261112d"></script>
  <script src="../assets/auction.js?v=20261112d"></script>
  <script src="../assets/ui.js?v=20261112d"></script>
  <script src="../assets/media.js?v=20261112d"></script>
  <style>
    .t-open th:first-child, .t-open td:first-child { padding-left: 0; }
    .t-open th:last-child, .t-open td:last-child { padding-right: 0; }
    .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
    .seg button { padding: .2rem .7rem; font-size: 13px; font-weight: 400; color: var(--muted); background: var(--surface); }
    .seg button + button { border-left: 1px solid var(--line-strong); }
    .seg button.on { background: var(--ink); color: #fff; }
    @media (max-width: 767px) { .seg button { min-height: 44px; padding: 0 1rem; font-size: 14px; } }
    .row-act { font-size: 14px; font-weight: 400; color: var(--ink-2); padding: .35rem .5rem; border-radius: 6px; }
    .row-act:hover { background: var(--tile); color: var(--ink); }
    .row-act.del { color: var(--muted); }
    .row-act.del:hover { color: var(--live); background: var(--live-soft); }
    .row-act.stop { color: var(--live); }
    .row-act.stop:hover { background: var(--live-soft); }
    .row-act.stop[aria-disabled="true"] { color: var(--line-strong); }
    .row-act.stop[aria-disabled="true"]:hover { background: var(--tile); color: var(--muted); }
    @media (max-width: 767px) { .row-act { min-height: 40px; padding: .3rem .6rem; } }
    .input:disabled { background: var(--tile); color: var(--muted); border-color: var(--line); }
    .search { position: relative; }
    .search svg { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 pt-10 pb-8 sm:pt-14" id="app">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-end mb-8 sm:mb-10">
      <div class="min-w-0">
        <h1 class="font-serif text-[36px] sm:text-[40px] font-normal leading-[1.1] tracking-[-0.01em] text-ink">Item lelongan</h1>
        <p class="mt-2 text-[16px] text-muted" id="sub">Tambah, ubah dan jadualkan pakaian untuk dilelong di kedai anda.</p>
      </div>
      <button id="btn-add" class="btn btn-brand sm:ml-auto">Tambah item</button>
    </div>

    <!-- toolbar: status tabs + filters -->
    <div class="flex flex-col lg:flex-row lg:items-end gap-4 lg:gap-6 mb-2 lg:border-b lg:border-line">
      <div id="status-pills" role="tablist" aria-label="Status" class="tabs flex-1 min-w-0 lg:border-b-0"></div>
      <div class="flex gap-2 lg:pb-2">
        <label class="sr-only" for="f-tier">Tier</label>
        <select id="f-tier" class="input !w-auto !min-h-[44px] !py-1 text-[15px]"></select>
        <div class="search flex-1 lg:w-64">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <label class="sr-only" for="f-q">Cari item</label>
          <input id="f-q" type="search" class="input !min-h-[44px] !py-1 !pl-9 text-[16px]" placeholder="Cari tajuk, kategori, saiz">
        </div>
      </div>
    </div>

    <div id="tbl"></div>
  </main>
  <div id="eb-footer"></div>

  <script>
    EB.init({ area: 'admin', active: 'items', title: 'Item lelongan' });
    const { esc, money, link, fmtDate, itemImage, statusBadge, toast, modal, countdown, lotNo } = EB.ui;
    const A = EB.auction;
    const D = window.EB_DATA;
    const slug = EB.tenant.slug();
    const tenant = () => EB.tenant.bySlug(slug);
    const filt = { status: 'all', tier: 'all', q: '' };
    /* ---------- Tutup bidaan sekarang (local helper; the same code lives in admin/index.html and admin/items.html) ----------
     * The engine (EB.auction closeDue, every 1s in the leader tab) does the real closing: winner, invoice, inbox.
     * We only move endAt into the past and wait for item.result to appear. */
    function toastLink(msg, href, label, type) {
      let box = document.getElementById('eb-toasts');
      if (!box) {
        box = document.createElement('div');
        box.id = 'eb-toasts';
        box.className = 'fixed z-[100] bottom-4 right-4 left-4 sm:left-auto flex flex-col gap-2 items-stretch sm:items-end pointer-events-none';
        document.body.appendChild(box);
      }
      const bar = { success: 'border-l-4 border-l-[var(--ok)]', warn: 'border-l-4 border-l-[var(--warn)]', error: 'border-l-4 border-l-[var(--live)]' }[type] || '';
      const el = document.createElement('div');
      el.className = `eb-toast pointer-events-auto ${bar} bg-[var(--ink)] text-white text-[15px] rounded-lg shadow-lg px-4 py-3 sm:max-w-sm`;
      el.setAttribute('role', 'status');
      el.textContent = msg + ' ';
      if (href) {
        const a = document.createElement('a');
        a.href = href; a.textContent = label || 'Lihat';
        a.className = 'font-medium text-white underline underline-offset-2 whitespace-nowrap';
        el.appendChild(a);
      }
      box.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 8600);
      setTimeout(() => el.remove(), 9000);
    }

    function closeHead(item) {
      return `<div class="flex gap-3 items-start pb-3 mb-4 border-b border-line"><img src="${esc(EB.ui.itemImage(item))}" class="h-16 w-[52px] rounded object-cover shrink-0 bg-tile" alt="">
        <div class="min-w-0"><div class="lot">${esc(EB.ui.lotNo(item))}</div><div class="font-serif text-[18px] font-normal text-ink leading-snug">${esc(item.title)}</div></div></div>`;
    }

    /** Opens the confirm modal. With no bids it explains why and offers "Tamatkan tanpa pemenang". */
    function askCloseNow(itemId) {
      const s = EB.store.get();
      const item = s.items.find(i => i.id === itemId);
      if (!item || A.status(item) !== 'live') { EB.ui.toast('Lelongan ini tidak lagi berlangsung.', 'warn'); return; }
      const lot = EB.ui.lotNo(item);
      const h = A.highest(itemId, s);
      if (!h) {
        EB.ui.modal({
          title: 'Belum ada bidaan',
          body: closeHead(item) + `<p class="text-[14px]">"Tutup bidaan sekarang" tidak tersedia kerana belum ada sesiapa membida item ini, jadi tiada pemenang untuk dipilih.</p>
            <p class="mt-3 text-[14px] text-muted">Anda boleh tamatkan lelongan tanpa pemenang. Item akan disenaraikan sebagai "Tiada bidaan" di Pemenang & bayaran dan boleh dilelong semula. Tindakan ini tidak boleh dibatalkan.</p>`,
          actions: [{ label: 'Batal' }, { label: 'Tamatkan tanpa pemenang', danger: true, onClick: () => endNow(itemId) }],
        });
        return;
      }
      let wrap = null, done = false;
      EB.ui.modal({
        title: 'Tutup bidaan sekarang?',
        body: closeHead(item) + `<p class="text-[14px] leading-relaxed">Bidaan tertinggi semasa
            <b data-cn-amt class="tabular-nums font-medium text-ink whitespace-nowrap">${money(h.amount)}</b> oleh <b data-cn-name class="font-medium text-ink">${esc(EB.users.byId(h.userId).name)}</b> akan menjadi pemenang.
            Tindakan ini tidak boleh dibatalkan.</p>
          <p class="mt-3 text-[13px] text-muted">Invois dihantar kepada pemenang serta-merta dengan tempoh bayaran ${A.tenantOf(item).settings.payDeadlineHours} jam. Pembida lain dimaklumkan melalui peti masuk.</p>
          <p data-cn-note class="hidden mt-3 text-[13px] text-ink-2 border-l-2 border-[var(--warn)] bg-[var(--warn-soft)] px-3 py-2 rounded-r">Bidaan baharu masuk semasa tetingkap ini dibuka. Pemenang dan amaun di atas telah dikemas kini.</p>`,
        actions: [{ label: 'Batal' }, { label: 'Tutup bidaan', danger: true, onClick: () => { done = true; endNow(itemId); } }],
        onOpen: el => { wrap = el; },
      });
      // keep the named winner honest while the modal is open (bots may still bid)
      let lastId = h.id;
      const unsub = EB.store.subscribe(() => {
        if (done || !wrap || !document.body.contains(wrap)) { setTimeout(unsub, 0); return; }
        const s2 = EB.store.get();
        const it2 = s2.items.find(i => i.id === itemId);
        if (!it2 || A.status(it2) !== 'live') { wrap.remove(); setTimeout(unsub, 0); EB.ui.toast('Lelongan ini sudah tamat.', 'warn'); return; }
        const h2 = A.highest(itemId, s2);
        if (!h2 || h2.id === lastId) return;
        lastId = h2.id;
        wrap.querySelector('[data-cn-amt]').textContent = money(h2.amount);
        wrap.querySelector('[data-cn-name]').textContent = EB.users.byId(h2.userId).name;
        wrap.querySelector('[data-cn-note]').classList.remove('hidden');
      });
    }

    /** Move endAt into the past; the engine closes the item within ~1s. Then report the winner. */
    function endNow(itemId) {
      const it = EB.store.get().items.find(i => i.id === itemId);
      if (!it || A.status(it) !== 'live') { EB.ui.toast('Lelongan ini tidak lagi berlangsung.', 'warn'); return; }
      const now = Date.now();
      A.updateItem(itemId, { endAt: now - 1, closedEarlyBy: 'admin', closedEarlyAt: now });
      const winners = EB.ui.link('admin/winners.html');
      const t0 = Date.now();
      const poll = setInterval(() => {
        const x = EB.store.get().items.find(i => i.id === itemId);
        if (x && x.result) {
          clearInterval(poll);
          if (x.result.winnerId) toastLink('Bidaan ditutup. Pemenang: ' + EB.users.byId(x.result.winnerId).name + ' (' + money(x.result.amount) + ').', winners, 'Lihat pemenang & bayaran', 'success');
          else toastLink('Lelongan ditamatkan tanpa pemenang.', winners, 'Lihat pemenang & bayaran', 'success');
        } else if (Date.now() - t0 > 8000) {
          clearInterval(poll);
          toastLink('Bidaan ditutup, tetapi pemenang belum diproses. Muat semula halaman ini.', winners, 'Pemenang & bayaran', 'warn');
        }
      }, 250);
    }

    const fmtShort = ts => new Date(ts).toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });

    /* ---------- list ---------- */
    function renderFilters() {
      const t = tenant();
      document.getElementById('f-tier').innerHTML = `<option value="all">Semua tier</option>` +
        t.tiers.map(x => `<option value="${esc(x.id)}" ${filt.tier === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    }

    function render() {
      const s = EB.store.get();
      const t = s.tenants.find(x => x.slug === slug);
      const now = Date.now();
      const all = s.items.filter(i => i.tenant === slug);
      const counts = { all: all.length, live: 0, upcoming: 0, ended: 0 };
      all.forEach(i => counts[A.status(i, now)]++);
      document.getElementById('sub').textContent = `${all.length} item di ${t.name}. Tambah, ubah dan jadualkan pakaian untuk dilelong.`;
      const labels = [['all', 'Semua'], ['live', 'Sedang dilelong'], ['upcoming', 'Akan datang'], ['ended', 'Tamat']];
      document.getElementById('status-pills').innerHTML = labels.map(([k, l]) =>
        `<button type="button" role="tab" class="tab" aria-selected="${filt.status === k}" data-st="${k}">${l}<span class="count">${counts[k]}</span></button>`).join('');

      const q = filt.q.trim().toLowerCase();
      const order = { live: 0, upcoming: 1, ended: 2 };
      const rows = all.filter(i => (filt.status === 'all' || A.status(i, now) === filt.status) && (filt.tier === 'all' || i.tier === filt.tier) &&
        (!q || (i.title + ' ' + i.category + ' ' + i.size).toLowerCase().includes(q)))
        .sort((a, b) => order[A.status(a, now)] - order[A.status(b, now)] || (A.status(a, now) === 'ended' ? b.endAt - a.endAt : a.endAt - b.endAt));

      const box = document.getElementById('tbl');
      if (!rows.length) {
        const filtered = filt.status !== 'all' || filt.tier !== 'all' || q;
        box.innerHTML = filtered
          ? `<div class="py-14 border-t border-line"><p class="text-[16px] text-ink-2">Tiada item sepadan dengan penapis ini.</p>
              <button type="button" data-clear class="btn btn-outline mt-4">Kosongkan penapis</button></div>`
          : `<div class="py-14 border-t border-line"><p class="text-[16px] text-ink-2">Kedai ini belum ada item untuk dilelong.</p>
              <button type="button" data-new class="btn btn-brand mt-4">Tambah item pertama</button></div>`;
        return;
      }
      const closeBtn = (i, b, cls) => b.length
        ? `<button type="button" class="${cls}" data-act="close" data-id="${esc(i.id)}" title="Tamatkan lelongan sekarang; pembida tertinggi menjadi pemenang">Tutup bidaan</button>`
        : `<button type="button" class="${cls}" data-act="close" data-id="${esc(i.id)}" aria-disabled="true" title="Tidak tersedia: belum ada bidaan. Klik untuk tamatkan tanpa pemenang.">Tutup bidaan</button>`;
      const top = b => b[0] ? money(b[0].amount) : '<span class="text-[14px] text-muted">Tiada bidaan</span>';
      // small tags for the optional lot content (video, story)
      const extras = i => (i.video && i.video.src) || (i.story && (i.story.headline || (i.story.body || []).length))
        ? `<div class="mt-1 flex gap-1.5">${i.video && i.video.src ? '<span class="rounded border border-line px-1.5 text-[12px] leading-[18px] text-ink-2">Video</span>' : ''}${i.story && (i.story.headline || (i.story.body || []).length) ? '<span class="rounded border border-line px-1.5 text-[12px] leading-[18px] text-ink-2">Cerita</span>' : ''}</div>` : '';
      const data = rows.map(i => ({ i, st: A.status(i, now), b: A.bidsFor(i.id, s), tier: EB.tenant.tier(t, i.tier) }));
      box.innerHTML = `<div class="hidden lg:block"><table class="table t-open">
        <thead><tr>
          <th>Item</th><th>Tier</th><th class="num">Harga mula</th><th class="num">Tertinggi</th>
          <th>Jadual</th><th>Status</th><th class="num relative"><span class="sr-only">Tindakan</span></th></tr></thead>
        <tbody>${data.map(({ i, st, b, tier }) => `<tr>
            <td><div class="flex items-center gap-4 min-w-0">
              <img src="${esc(itemImage(i))}" class="h-14 w-11 rounded object-cover bg-tile shrink-0" alt="">
              <div class="min-w-0"><div class="lot">${esc(lotNo(i))}</div><button type="button" data-act="edit" data-id="${esc(i.id)}" class="block max-w-[220px] truncate text-left font-serif text-[17px] leading-snug text-ink hover:underline underline-offset-4 decoration-1" title="Ubah item ini">${esc(i.title)}</button>
              <div class="text-[13px] text-muted">${esc(i.category)} · Saiz ${esc(i.size)} · ${esc(i.condition)}</div>${extras(i)}</div></div></td>
            <td class="text-ink-2 whitespace-nowrap">${esc(tier.name)}</td>
            <td class="num tabular-nums whitespace-nowrap text-ink-2">${money(i.startPrice)}</td>
            <td class="num whitespace-nowrap"><div class="tabular-nums text-ink">${top(b)}</div>
              ${b.length ? `<div class="text-[13px] text-muted"><span class="tabular-nums">${b.length}</span> bidaan</div>` : ''}</td>
            <td class="whitespace-nowrap tabular-nums text-[13px] text-ink-2"><div>${esc(fmtShort(i.startAt))}</div><div class="text-muted">hingga ${esc(fmtShort(i.endAt))}</div>
              ${st === 'live' ? `<div class="text-ink" data-countdown-end="${i.endAt}">${countdown(i.endAt - now)}</div>` : ''}</td>
            <td>${statusBadge(st)}${i.closedEarlyBy ? '<div class="text-[13px] text-muted mt-0.5 whitespace-nowrap">Ditutup awal oleh admin</div>' : ''}</td>
            <td class="text-right whitespace-nowrap">
              ${st === 'live' ? closeBtn(i, b, 'row-act stop') : ''}
              <button type="button" class="row-act" data-act="edit" data-id="${esc(i.id)}">Ubah</button>
              <button type="button" class="row-act" data-act="copy" data-id="${esc(i.id)}">Salin</button>
              <button type="button" class="row-act del" data-act="del" data-id="${esc(i.id)}">Padam</button></td>
          </tr>`).join('')}</tbody></table></div>
        <ul class="lg:hidden border-t border-line divide-line">${data.map(({ i, st, b, tier }) => `<li class="py-5">
            <div class="flex gap-4 min-w-0">
              <img src="${esc(itemImage(i))}" class="h-[88px] w-[70px] rounded object-cover bg-tile shrink-0" alt="">
              <div class="min-w-0 flex-1">
                <div class="flex items-baseline justify-between gap-3"><span class="lot">${esc(lotNo(i))}</span>${statusBadge(st)}</div>
                <button type="button" data-act="edit" data-id="${esc(i.id)}" class="block w-full text-left font-serif text-[18px] leading-snug text-ink line-clamp-2">${esc(i.title)}</button>
                <div class="text-[13px] text-muted mt-0.5">Tier ${esc(tier.name)} · ${esc(i.category)} · Saiz ${esc(i.size)}</div>${extras(i)}
              </div>
            </div>
            <dl class="mt-4 grid grid-cols-2 gap-3">
              <div><dt class="text-[13px] text-muted">${b.length ? 'Tertinggi · ' + b.length + ' bidaan' : 'Harga mula'}</dt><dd class="tabular-nums text-[20px] leading-tight text-ink whitespace-nowrap">${money(b[0] ? b[0].amount : i.startPrice)}</dd></div>
              <div><dt class="text-[13px] text-muted">${st === 'live' ? 'Baki masa' : st === 'upcoming' ? 'Mula' : 'Tamat'}</dt><dd class="tabular-nums text-[${st === 'live' ? '20' : '15'}px] leading-tight text-ink" ${st === 'live' ? `data-countdown-end="${i.endAt}"` : ''}>${st === 'live' ? countdown(i.endAt - now) : esc(fmtShort(st === 'upcoming' ? i.startAt : i.endAt))}</dd>
                ${i.closedEarlyBy ? '<dd class="text-[13px] text-muted">Ditutup awal oleh admin</dd>' : ''}</div>
            </dl>
            <div class="mt-4 flex flex-wrap gap-2">
              ${st === 'live' ? closeBtn(i, b, `btn btn-outline w-full ${b.length ? '' : 'opacity-50'}`) : ''}
              <button type="button" class="btn btn-outline flex-1" data-act="edit" data-id="${esc(i.id)}">Ubah</button>
              <button type="button" class="btn btn-ghost flex-1" data-act="copy" data-id="${esc(i.id)}">Salin</button>
              <button type="button" class="btn btn-ghost flex-1 !text-[var(--muted)]" data-act="del" data-id="${esc(i.id)}">Padam</button>
            </div></li>`).join('')}</ul>`;
    }

    document.getElementById('status-pills').addEventListener('click', e => {
      const b = e.target.closest('[data-st]'); if (!b) return;
      filt.status = b.dataset.st; render();
    });
    document.getElementById('f-tier').onchange = e => { filt.tier = e.target.value; render(); };
    document.getElementById('f-q').oninput = e => { filt.q = e.target.value; render(); };
    document.getElementById('btn-add').onclick = () => openForm(null);
    document.getElementById('tbl').addEventListener('click', e => {
      if (e.target.closest('[data-clear]')) {
        filt.status = 'all'; filt.tier = 'all'; filt.q = '';
        document.getElementById('f-q').value = ''; renderFilters(); render(); return;
      }
      if (e.target.closest('[data-new]')) { openForm(null); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      const item = EB.store.get().items.find(i => i.id === b.dataset.id);
      if (!item) return;
      if (b.dataset.act === 'edit') openForm(item);
      if (b.dataset.act === 'copy') openForm(item, true);
      if (b.dataset.act === 'del') askDelete(item);
      if (b.dataset.act === 'close') askCloseNow(item.id);
    });

    function askDelete(item) {
      const n = A.bidsFor(item.id).length;
      if (n) { toast('Tidak boleh padam: "' + item.title + '" sudah ada ' + n + ' bidaan.', 'error'); return; }
      modal({
        title: 'Padam item ini?',
        body: `<div class="flex gap-3 items-start"><img src="${esc(itemImage(item))}" class="h-16 w-[52px] rounded object-cover shrink-0" alt="">
          <div class="min-w-0"><div class="lot">${esc(lotNo(item))}</div><div class="font-serif text-[18px] font-normal text-ink leading-snug">${esc(item.title)}</div>
          <p class="text-[14px] text-muted mt-1">Item ini akan dibuang dari kedai. Tindakan ini tidak boleh dibatalkan.</p></div></div>`,
        actions: [{ label: 'Batal' }, { label: 'Padam item', danger: true, onClick: () => {
          if (A.deleteItem(item.id)) toast('Item dipadam.', 'success');
          else toast('Tidak boleh padam: item ini sudah ada bidaan.', 'error');
        } }],
      });
    }

    /* ---------- add / edit form ---------- */
    const UNIT = { min: 60000, hour: 3600000, day: 86400000 };
    const pad = n => String(n).padStart(2, '0');
    function toLocal(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function fromLocal(v) { const t = new Date(v).getTime(); return isNaN(t) ? null : t; }
    function fmtDur(ms) {
      if (ms <= 0) return 'tiada';
      const m = Math.round(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
      return [d && d + ' hari', h && h + ' jam', mm && mm + ' min'].filter(Boolean).join(' ') || 'kurang 1 min';
    }
    function bestUnit(ms) {
      if (ms % UNIT.day === 0) return ['day', ms / UNIT.day];
      if (ms % UNIT.hour === 0) return ['hour', ms / UNIT.hour];
      return ['min', Math.max(1, Math.round(ms / UNIT.min))];
    }

    function readImage(file, max, cb) {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => cb(null);
        img.src = r.result;
      };
      r.onerror = () => cb(null);
      r.readAsDataURL(file);
    }

    /** Most common value of a field among this shop's items (ties: the newest item wins). */
    function mostCommon(items, key) {
      const n = {};
      items.forEach(i => { if (i[key]) n[i[key]] = (n[i[key]] || 0) + 1; });
      let best = null;
      items.slice().reverse().forEach(i => { const v = i[key]; if (v && (best === null || n[v] > n[best])) best = v; });
      return best;
    }
    /** Neutral example text per shop; shops without their own get a generic one. */
    const PLACEHOLDERS = {
      paskb: { title: 'cth. Kopiah kenangan Tuan Guru', desc: 'cth. Asal-usul item, siapa pernah memakainya, keadaan dan ukuran' },
    };
    const placeholderFor = sl => Object.assign({ title: 'cth. Nama item', desc: 'Bahan, ukuran dan keadaan (termasuk kecacatan, jika ada)' }, PLACEHOLDERS[sl]);

    function newDefaults(s, t) {
      const mine = s.items.filter(i => i.tenant === slug);
      const tierId = mostCommon(mine, 'tier');
      const tier = t.tiers.find(x => x.id === tierId) || t.tiers[0];
      return {
        title: '', category: mostCommon(mine, 'category') || D.categories[0], size: mostCommon(mine, 'size') || 'M',
        condition: 'Baru', tier: tier.id, color: '#d8c3a5', desc: '', startPrice: tier.minPrice, photo: null,
      };
    }

    const opt = (list, cur) => (cur && !list.includes(cur) ? [cur].concat(list) : list).map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');

    function closeSection(item, s) {
      const h = A.highest(item.id, s);
      return `<div class="border-t border-line pt-4">
        <span class="block text-[16px] text-ink">Tutup awal</span>

            <button type="button" data-closenow class="btn btn-outline btn-sm mt-2 !text-[var(--live)] hover:!border-[var(--live)]">Tutup bidaan sekarang</button>`
          : `<div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-2"><button type="button" class="btn btn-outline btn-sm" disabled aria-describedby="cn-why">Tutup bidaan sekarang</button>
            <button type="button" data-endnobid class="btn-link text-[13px] !text-[var(--live)]">Tamatkan tanpa pemenang</button></div>
            <p id="cn-why" class="hint">Tidak tersedia kerana belum ada bidaan, jadi tiada pemenang untuk dipilih. Anda boleh tamatkan lelongan tanpa pemenang.</p>`}
      </div>`;
    }

    function openForm(src, isCopy) {
      const s = EB.store.get();
      const t = s.tenants.find(x => x.slug === slug);
      const editing = src && !isCopy;
      const bidCount = editing ? A.bidsFor(src.id, s).length : 0;
      const locked = bidCount > 0;
      const scheduleLocked = editing && locked && A.status(src) === 'ended';
      const startLocked = editing && locked;
      const base = src ? Object.assign({}, src) : newDefaults(s, t);
      const ph = placeholderFor(slug);
      const isLive = editing && A.status(src) === 'live';
      if (isCopy) base.title = src.title + ' (Salinan)';
      let photo = base.photo || null;
      // video: { kind, src, title } or null. A copy never shares an uploaded file (it lives under one key).
      let video = base.video && base.video.src && !(isCopy && base.video.kind === 'upload') ? Object.assign({}, base.video) : null;
      const sessionUploads = [];   // keys uploaded while this form is open
      const dropOnSave = [];       // the item's saved upload, removed only once the change is saved
      const story0 = base.story || {};
      const images = (base.images || []).slice();   // real photos shipped with the item (paths)
      let shown = 0;                                // which image the big preview shows
      let startNow = !editing;
      let mode = 'dur';
      const durMs = src ? Math.max(UNIT.min, src.endAt - src.startAt) : 3 * UNIT.day;
      const [u0, n0] = bestUnit(durMs);
      if (u0 === 'min' && n0 > 120) mode = 'end';   // odd durations read better as an end date
      const start0 = editing ? src.startAt : Date.now();
      const end0 = editing ? src.endAt : Date.now() + durMs;

      const body = `
        <form data-f class="grid md:grid-cols-[180px_1fr] gap-6" autocomplete="off" novalidate onsubmit="return false">
          <div class="space-y-3">
            <div class="relative">
              <img data-prev class="w-full aspect-[4/5] rounded-lg object-cover bg-tile border border-line" alt="Pratonton gambar item">
              <span data-phtag class="absolute left-2 bottom-2 rounded bg-[rgba(1,2,5,.72)] text-white text-[12px] px-2 py-0.5">Gambar contoh</span>
            </div>
            <div data-thumbs class="grid grid-cols-4 gap-1.5"></div>

            <div><label class="label" for="f-color">Warna gambar contoh</label>
              <div class="flex items-center gap-2"><input id="f-color" data-k="color" type="color" value="${esc(base.color || '#c9ccc5')}" class="h-11 w-12 md:h-9 shrink-0 rounded border border-[var(--line-strong)] bg-surface p-0.5 cursor-pointer">
              <span class="text-[13px] text-muted leading-tight">Dipakai jika tiada gambar.</span></div></div>
          </div>
          <div class="space-y-4 min-w-0">
            <div><label class="label" for="f-title">Tajuk item</label><input id="f-title" data-k="title" class="input" maxlength="80" value="${esc(base.title)}" placeholder="${esc(ph.title)}">
              <p data-fe="title" class="field-error hidden"></p></div>
            <div class="grid grid-cols-3 gap-2">
              <div><label class="label" for="f-cat">Kategori</label><select id="f-cat" data-k="category" class="input">${opt(D.categories, base.category)}</select></div>
              <div><label class="label" for="f-size">Saiz</label><select id="f-size" data-k="size" class="input">${opt(D.sizes, base.size)}</select></div>
              <div><label class="label" for="f-cond">Keadaan</label><select id="f-cond" data-k="condition" class="input">${opt(D.conditions, base.condition)}</select></div>
            </div>
            ${locked ? `<p class="text-[13px] text-ink-2 border-l-2 border-[var(--warn)] bg-[var(--warn-soft)] px-3 py-2 rounded-r">Item ini sudah ada <b class="tabular-nums">${bidCount}</b> bidaan, jadi tier, harga mula${startLocked ? ' dan masa mula' : ''} dikunci.</p>` : ''}
            <div class="grid grid-cols-2 gap-2">
              <div><label class="label" for="f-tier2">Tier harga</label><select id="f-tier2" data-k="tier" class="input" ${locked ? 'disabled' : ''}>${t.tiers.map(x => `<option value="${esc(x.id)}" ${x.id === base.tier ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
              <div><label class="label" for="f-price">Harga mula (RM)</label><input id="f-price" data-k="startPrice" type="number" step="1" inputmode="numeric" class="input tabular-nums" value="${Number(base.startPrice)}" ${locked ? 'disabled' : ''}></div>
            </div>
            <p data-fe="startPrice" class="field-error hidden !-mt-2"></p>
            <p data-tierinfo class="hint !-mt-2"></p>
            <div><label class="label" for="f-desc">Penerangan</label><textarea id="f-desc" data-k="desc" rows="3" class="input" placeholder="${esc(ph.desc)}">${esc(base.desc)}</textarea></div>

            <section class="border-t border-line pt-4 space-y-3" aria-labelledby="vid-h">
              <div id="vid-h" class="text-[16px] text-ink">Video <span class="text-muted">(pilihan)</span></div>
              <div data-vbox class="hidden">
                <div data-vprev class="rounded-lg overflow-hidden bg-[#000]"></div>
                <div class="mt-2 flex items-center justify-between gap-3 min-w-0"><span data-vname class="text-[14px] text-ink-2 truncate min-w-0"></span>

              </div>
              <div data-vinputs class="space-y-3">
                <div><label class="label" for="f-vurl">Pautan video</label>
                  <div class="flex gap-2"><input id="f-vurl" data-vurl type="url" inputmode="url" class="input min-w-0" placeholder="https://youtu.be/… atau pautan .mp4" autocomplete="off">
                    <button type="button" data-vadd class="btn btn-outline shrink-0">Guna</button></div>
                  <p data-fe="vurl" class="field-error hidden"></p></div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1"><span class="text-[14px] text-muted">atau</span>
                  <label class="btn btn-outline btn-sm cursor-pointer">Muat naik fail video<input data-vfile type="file" accept="video/*" class="sr-only"></label>
                  <span data-vbusy class="text-[14px] text-muted hidden" role="status">Menyimpan video…</span></div>
                <p data-fe="vfile" class="field-error hidden !mt-1"></p>
              </div>
              <p class="hint">Video yang dimuat naik disimpan dalam browser ini sahaja (demo). Dalam sistem sebenar, video disimpan di pelayan.</p>
            </section>

            <section class="border-t border-line pt-4 space-y-4" aria-labelledby="sto-h">
              <div><div id="sto-h" class="text-[16px] text-ink">Cerita lot <span class="text-muted">(pilihan)</span></div>
                <p class="hint !mt-0.5">Dipaparkan di halaman kedai dan halaman item.</p></div>
              <div><label class="label" for="f-sh">Tajuk cerita</label><input id="f-sh" data-sy="headline" class="input" maxlength="90" value="${esc(story0.headline || '')}" placeholder="cth. Sehelai baju, sejuta kenangan">
                <p data-fe="story" class="field-error hidden"></p></div>
              <div><label class="label" for="f-ssub">Subtajuk</label><input id="f-ssub" data-sy="subheadline" class="input" maxlength="160" value="${esc(story0.subheadline || '')}"></div>
              <div><label class="label" for="f-sbody">Cerita</label><textarea id="f-sbody" data-sy="body" rows="6" class="input">${esc((story0.body || []).join('\n\n'))}</textarea>
                <div class="hint flex justify-between gap-3"><span>Pisahkan perenggan dengan satu baris kosong.</span><span data-scount class="tabular-nums whitespace-nowrap"></span></div></div>

            <fieldset class="border-t border-line pt-4 space-y-3 ${scheduleLocked ? 'opacity-60 pointer-events-none' : ''}">
              <legend class="sr-only">Jadual lelongan</legend>
              <div class="flex flex-wrap items-center gap-2"><span class="text-[16px] text-ink">Jadual lelongan</span>${scheduleLocked ? '<span class="text-[12px] text-muted">Lelongan telah tamat, jadual dikunci.</span>' : ''}</div>
              ${startLocked ? '' : `<div class="flex flex-wrap items-center gap-1.5"><span class="text-[13px] text-muted mr-1">Mula sekarang, tamat dalam</span>
                <button type="button" class="btn btn-outline btn-sm tabular-nums" data-preset="5">5 min</button><button type="button" class="btn btn-outline btn-sm tabular-nums" data-preset="60">1 jam</button><button type="button" class="btn btn-outline btn-sm tabular-nums" data-preset="4320">3 hari</button></div>`}
              <div class="grid sm:grid-cols-2 gap-3">
                <div><label class="label" for="f-start">Mula</label><input id="f-start" data-start type="datetime-local" class="input tabular-nums" ${startLocked ? 'disabled' : ''}></div>
                <div><div class="flex items-center justify-between mb-[.3rem]"><span class="label !mb-0">Tamat</span>
                  <div class="seg" role="group" aria-label="Cara tetapkan masa tamat"><button type="button" data-mode="dur">Tempoh</button><button type="button" data-mode="end">Tarikh</button></div></div>
                  <div data-durbox class="flex gap-2"><input data-dur type="number" min="1" class="input tabular-nums" aria-label="Tempoh" value="${n0}">
                    <select data-unit class="input !w-28" aria-label="Unit tempoh"><option value="min">minit</option><option value="hour">jam</option><option value="day">hari</option></select></div>
                  <input data-end type="datetime-local" class="input tabular-nums hidden" aria-label="Tarikh tamat">
                </div>
              </div>
              <p data-sum class="text-[13px] text-ink-2"></p>
              <p data-fe="sched" class="field-error hidden"></p>
            </fieldset>
            ${isLive ? closeSection(src, s) : ''}
          </div>
        </form>`;

      const closeForm = modal({
        title: editing ? 'Ubah item' : isCopy ? 'Salin item' : 'Tambah item baharu',
        body,
        actions: [{ label: 'Batal' }, { label: editing ? 'Simpan perubahan' : 'Simpan & terbitkan', primary: true, onClick: (close, el) => save(el) }],
        onOpen: el => {
          const m = el.querySelector('.eb-modal');
          m.classList.remove('sm:max-w-md'); m.classList.add('sm:max-w-3xl');
          const $ = q => el.querySelector(q);
          const k = name => el.querySelector(`[data-k="${name}"]`);
          const startI = $('[data-start]'), endI = $('[data-end]'), durI = $('[data-dur]'), unitI = $('[data-unit]');
          unitI.value = u0;
          startI.value = toLocal(start0);
          endI.value = toLocal(end0);
          let prevTier = base.tier;

          function preview() {
            const pv = { color: k('color').value, category: k('category').value, size: k('size').value, photo, images };
            const real = (photo ? 1 : 0) + images.length;
            if (shown >= Math.max(1, real)) shown = 0;
            $('[data-prev]').src = itemImage(pv, shown);
            $('[data-phtag]').textContent = real ? (shown === 0 && photo ? 'Gambar dimuat naik' : 'Foto ' + (shown + 1) + '/' + real) : 'Gambar contoh';
            $('[data-thumbs]').innerHTML = real > 1 ? Array.from({ length: real }, (_, ix) =>
              `<button type="button" data-th="${ix}" aria-label="Foto ${ix + 1}" class="aspect-[4/5] rounded overflow-hidden border-2 ${ix === shown ? 'border-[var(--ink)]' : 'border-transparent'}"><img src="${esc(itemImage(pv, ix))}" class="h-full w-full object-cover" alt=""></button>`).join('') : '';
            $('[data-rmphoto]').classList.toggle('hidden', !photo);
          }
          function tierInfo() {
            const tr = EB.tenant.tier(t, k('tier').value);
            const st = t.settings;
            k('startPrice').min = tr.minPrice;
            $('[data-tierinfo]').innerHTML = `Tier ${esc(tr.name)}: harga minima <span class="tabular-nums text-ink-2">${money(tr.minPrice)}</span>, kenaikan minima <span class="tabular-nums text-ink-2">${money(tr.increment)}</span>` +
              (st.lastWindowOn ? ` (<span class="tabular-nums">${money(tr.increment * st.lastWindowMultiplier)}</span> dalam ${st.lastWindowMin} min akhir).` : '.');
          }
          function sched() {
            const start = startNow ? Date.now() : fromLocal(startI.value);
            let end;
            if (mode === 'dur') end = start == null ? null : start + Math.max(0, Number(durI.value) || 0) * UNIT[unitI.value];
            else end = fromLocal(endI.value);
            return { start, end };
          }
          function summary() {
            el.querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
            $('[data-durbox]').classList.toggle('hidden', mode !== 'dur');
            endI.classList.toggle('hidden', mode !== 'end');
            const { start, end } = sched();
            if (start == null || end == null) { $('[data-sum]').textContent = 'Lengkapkan masa mula dan tamat.'; return; }
            $('[data-sum]').innerHTML = `${startNow ? '<b class="font-medium text-[var(--ok)]">Mula sekarang</b>' : 'Mula <span class="tabular-nums">' + esc(fmtDate(start)) + '</span>'}, tamat <span class="tabular-nums">${esc(fmtDate(end))}</span>. Tempoh ${fmtDur(end - start)}.`;
          }
          /* ---------- video ---------- */
          const vErr = (key, msg) => { const e = $(`[data-fe="${key}"]`); e.textContent = msg || ''; e.classList.toggle('hidden', !msg); };
          const vLabel = v => v.kind === 'youtube' ? 'YouTube · ' + v.src
            : v.kind === 'upload' ? (v.title || 'Video dimuat naik') + (v.size ? ' · ' + (v.size < 1048576 ? Math.max(1, Math.round(v.size / 1024)) + ' KB' : (v.size / 1048576).toFixed(1) + ' MB') : '')
            : decodeURIComponent(String(v.src).split(/[?#]/)[0].split('/').pop() || v.src);
          async function showVideo() {
            $('[data-vbox]').classList.toggle('hidden', !video);
            $('[data-vinputs]').classList.toggle('hidden', !!video);
            if (!video) { $('[data-vprev]').innerHTML = ''; return; }
            $('[data-vname]').textContent = vLabel(video);
            const ok = await EB.media.mount($('[data-vprev]'), video, { maxHeight: '240px',
              emptyHtml: '<p class="px-4 py-6 text-[14px] text-white/80">Fail video ini dimuat naik dalam browser lain dan tidak boleh dimainkan di sini.</p>' });
            return ok;
          }
          function useLink() {
            const raw = $('[data-vurl]').value.trim();
            if (!raw) { vErr('vurl', 'Tampal pautan video dahulu.'); return; }
            const v = EB.media.parse(raw);
            if (!v) { vErr('vurl', 'Pautan tidak dikenali. Guna pautan YouTube atau fail MP4.'); $('[data-vurl]').setAttribute('aria-invalid', 'true'); return; }
            vErr('vurl', ''); $('[data-vurl]').removeAttribute('aria-invalid');
            video = { kind: v.kind, src: v.src, title: v.kind === 'youtube' ? 'Video YouTube' : vLabel(v) };
            showVideo();
          }
          $('[data-vadd]').onclick = useLink;
          $('[data-vurl]').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); useLink(); } });
          $('[data-vurl]').addEventListener('input', () => { vErr('vurl', ''); $('[data-vurl]').removeAttribute('aria-invalid'); });
          $('[data-vfile]').addEventListener('change', async e => {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            vErr('vfile', '');
            $('[data-vbusy]').classList.remove('hidden');
            try {
              const up = await EB.media.saveUpload(file, editing ? src.id : 'baharu');
              sessionUploads.push(up.src);
              video = { kind: 'upload', src: up.src, title: up.title, size: up.size };
              showVideo();
            } catch (err) {
              vErr('vfile', (err && err.message) || 'Video tidak dapat disimpan. Cuba fail lain.');
            } finally { $('[data-vbusy]').classList.add('hidden'); }
          });
          $('[data-vrm]').onclick = () => {
            if (video && video.kind === 'upload') {
              if (sessionUploads.includes(video.src)) EB.media.removeUpload(video.src);
              else dropOnSave.push(video.src);
            }
            video = null; $('[data-vurl]').value = '';
            showVideo();
          };
          showVideo();

          /* ---------- story ---------- */
          const paras = v => String(v || '').split(/\n\s*\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
          const sCount = () => { const v = $('[data-sy="body"]').value; const n = paras(v).length; $('[data-scount]').textContent = v.trim().length.toLocaleString('en-MY') + ' aksara · ' + n + ' perenggan'; };
          $('[data-sy="body"]').addEventListener('input', sCount);
          sCount();
          const readStory = () => {
            const q = n => $(`[data-sy="${n}"]`).value.trim();
            const st = { headline: q('headline'), subheadline: q('subheadline'), body: paras($('[data-sy="body"]').value), closing: q('closing'), tagline: q('tagline') };
            return st.headline || st.subheadline || st.body.length || st.closing || st.tagline ? st : null;
          };
          const getVideo = () => video ? { kind: video.kind, src: video.src, title: video.title || '' } : null;

          el._api = { sched, k, $, readStory, getVideo, dropOnSave };

          preview(); tierInfo(); summary();
          ['color', 'category', 'size'].forEach(n => k(n).addEventListener('input', preview));
          k('tier').addEventListener('change', () => {
            const oldMin = EB.tenant.tier(t, prevTier).minPrice;
            const nw = EB.tenant.tier(t, k('tier').value);
            const cur = Number(k('startPrice').value);
            if (!(cur >= nw.minPrice) || cur === oldMin) k('startPrice').value = nw.minPrice;
            prevTier = nw.id;
            tierInfo();
          });
          // clear a field's error as soon as it is edited
          el.addEventListener('input', e => {
            const n = e.target.dataset.k;
            if (n === 'title' || n === 'startPrice') { e.target.removeAttribute('aria-invalid'); $(`[data-fe="${n}"]`).classList.add('hidden'); }
            if (e.target.dataset.sy === 'headline' || e.target.dataset.sy === 'body') { $('[data-sy="headline"]').removeAttribute('aria-invalid'); $('[data-fe="story"]').classList.add('hidden'); }
            if (e.target.matches('[data-start],[data-dur],[data-unit],[data-end]')) $('[data-fe="sched"]').classList.add('hidden');
          });
          $('[data-file]').addEventListener('change', e => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            if (!/^image\//.test(f.type)) { toast('Sila pilih fail gambar (JPG atau PNG).', 'error'); return; }
            readImage(f, 600, url => { if (!url) { toast('Gambar tidak dapat dibaca. Cuba fail lain.', 'error'); return; } photo = url; shown = 0; preview(); });
          });
          $('[data-thumbs]').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (b) { shown = +b.dataset.th; preview(); } });
          $('[data-rmphoto]').onclick = () => { photo = null; shown = 0; $('[data-file]').value = ''; preview(); };
          el.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
            startNow = true; mode = 'dur';
            const mins = Number(b.dataset.preset);
            const [u, n] = bestUnit(mins * 60000);
            unitI.value = u; durI.value = n;
            startI.value = toLocal(Date.now());
            $('[data-fe="sched"]').classList.add('hidden');
            summary();
          });
          el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
            const { end } = sched();
            mode = b.dataset.mode;
            if (mode === 'end' && end) endI.value = toLocal(end);
            summary();
          });
          startI.addEventListener('input', () => { startNow = false; summary(); });
          [durI, unitI, endI].forEach(x => x.addEventListener('input', summary));
          const cn = $('[data-closenow]') || $('[data-endnobid]');
          if (cn) cn.onclick = () => { closeForm(); askCloseNow(src.id); };
          if (!editing) setTimeout(() => k('title').focus(), 50);
        },
      });

      function save(el) {
        const { sched, k, $, readStory, getVideo, dropOnSave } = el._api;
        el.querySelectorAll('[data-fe]').forEach(x => x.classList.add('hidden'));
        el.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
        const err = (key, msg, input) => {
          const e = $(`[data-fe="${key}"]`); e.textContent = msg; e.classList.remove('hidden');
          if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); } else e.scrollIntoView({ block: 'nearest' });
          return false;
        };
        const title = k('title').value.trim();
        if (!title) return err('title', 'Sila isi tajuk item. Pembida melihat tajuk ini dahulu.', k('title'));
        const tierId = k('tier').value;
        const tr = EB.tenant.tier(t, tierId);
        const price = Number(k('startPrice').value);
        if (!locked && !(price >= tr.minPrice)) return err('startPrice', `Harga mula mesti sekurang-kurangnya ${money(tr.minPrice)} untuk tier ${tr.name}.`, k('startPrice'));
        const story = readStory();
        if (story && !story.headline && story.body.length) return err('story', 'Isi tajuk cerita. Pembida membaca tajuk dahulu sebelum cerita.', $('[data-sy="headline"]'));
        const { start, end } = sched();
        if (start == null || end == null) return err('sched', 'Sila lengkapkan masa mula dan tamat.');
        if (end <= start) return err('sched', 'Masa tamat mesti selepas masa mula.');
        const schedChanged = !editing || Math.abs(start - src.startAt) > 60000 || Math.abs(end - src.endAt) > 60000;
        if (!scheduleLocked && schedChanged && end <= Date.now()) return err('sched', 'Masa tamat mesti pada masa hadapan.');

        const fields = {
          title, category: k('category').value, size: k('size').value, condition: k('condition').value,
          color: k('color').value, desc: k('desc').value.trim(), photo: photo || null,
        };
        if (images.length) fields.images = images.slice();
        fields.video = getVideo();
        fields.story = story;
        if (!locked) { fields.tier = tierId; fields.startPrice = price; }
        if (!scheduleLocked && schedChanged) {
          if (!startLocked) fields.startAt = start;
          fields.endAt = end;
        }

        if (editing) {
          if (fields.endAt && fields.endAt > Date.now() && src.result && !bidCount) { fields.result = null; fields.endingNotified = false; }
          if (fields.endAt && fields.endAt > Date.now()) fields.endingNotified = false;
          if (fields.startPrice) fields.botCeiling = Math.max(src.botCeiling || 0, Math.round(fields.startPrice * 2.2));
          A.updateItem(src.id, fields);
          dropOnSave.filter(key => !fields.video || fields.video.src !== key).forEach(key => EB.media.removeUpload(key));
          toast('Perubahan disimpan.', 'success');
        } else {
          fields.tenant = slug;
          fields.botCeiling = Math.round(price * (1.8 + Math.random() * 1.2));
          A.createItem(fields);
          toast(start <= Date.now() + 60000 ? 'Item diterbitkan dan kini sedang dilelong.' : 'Item dijadualkan: mula ' + fmtDate(start) + '.', 'success');
          if (filt.status !== 'all') { filt.status = 'all'; }
        }
        render();
        return true;
      }
    }

    let raf = 0;
    const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
    renderFilters();
    render();
    EB.store.subscribe(schedule);
    setInterval(schedule, 10000);

    if (EB.ui.qs('new')) openForm(null);
    const ed = EB.ui.qs('edit');
    if (ed) { const it = EB.store.get().items.find(i => i.id === ed && i.tenant === slug); if (it) openForm(it); }
  </script>
</body>
</html>
