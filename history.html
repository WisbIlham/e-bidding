<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sejarah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js?v=20261112c"></script>
  <link rel="stylesheet" href="assets/app.css?v=20261112c">
  <script src="assets/data.js?v=20261112c"></script>
  <script src="assets/store.js?v=20261112c"></script>
  <script src="assets/auction.js?v=20261112c"></script>
  <script src="assets/ui.js?v=20261112c"></script>
  <style>
    section[id] { scroll-margin-top: 120px; }
    /* open tables on white: first/last cells sit flush with the content edge */
    .table.open th:first-child, .table.open td:first-child { padding-left: 0; }
    .table.open th:last-child, .table.open td:last-child { padding-right: 0; }
    .table.open tbody tr:hover td { background: color-mix(in srgb, var(--tile) 50%, var(--surface)); }
    .table.open td { padding-top: .9rem; padding-bottom: .9rem; }
    .tile .table.open tbody tr:hover td { background: transparent; }
    .tile .table th, .tile .table td { border-color: color-mix(in srgb, var(--ink) 12%, var(--tile)); }
    .table td.mine { box-shadow: inset 2px 0 0 var(--ink); padding-left: .75rem !important; }
  </style>
</head>
<body class="min-h-screen">
  <div id="eb-header"></div>
  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8" id="app"></main>
  <div id="eb-footer"></div>
  <script>
    EB.init({ area: 'bidder', active: 'history', title: 'Sejarah' });
    const U = EB.ui;
    let query = '';
    let showAllBids = false;

    function myStatus(s, item, uid) {
      const st = EB.auction.status(item);
      const h = EB.auction.highest(item.id, s);
      if (st !== 'ended') return h && h.userId === uid ? 'leading' : 'outbid';
      const o = s.orders.filter(x => x.itemId === item.id && x.userId === uid).sort((a, b) => b.createdAt - a.createdAt)[0];
      if (o && o.status !== 'passed') return 'won';
      if (!o && !item.result) return h && h.userId === uid ? 'won' : 'lost';
      return 'lost';
    }

    const searchIcon = `<svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>`;

    function skeleton() {
      const t = EB.tenant.current();
      document.getElementById('app').innerHTML = `
        <header class="mb-10 md:mb-14">
          <h1 class="font-serif text-[30px] md:text-[40px] font-normal leading-[1.1] text-ink">Sejarah</h1>
          <p class="mt-2 text-[16px] text-muted">${U.esc(t.name)} · rekod bidaan anda dan keputusan lelongan.</p>
          <div class="mt-3 flex flex-wrap gap-x-8">
            <a href="#sejarah" class="link-arrow min-h-[44px]">Sejarah bidaan saya</a>
            <a href="#pemenang" class="link-arrow min-h-[44px]">Senarai pemenang</a>
          </div>
        </header>

        <section id="sejarah" aria-labelledby="h-sejarah">
          <h2 id="h-sejarah" class="font-serif text-[26px] md:text-[30px] font-normal leading-tight text-ink">Sejarah bidaan saya</h2>
          <p class="meta mt-1">Setiap bidaan dan yuran penyertaan anda di kedai ini.</p>
          <div id="mine" class="mt-6"></div>
        </section>

        <section id="pemenang" class="mt-16 md:mt-24" aria-labelledby="h-pemenang">
          <div class="flex flex-wrap items-end gap-x-6 gap-y-4">
            <div class="min-w-0">
              <h2 id="h-pemenang" class="font-serif text-[26px] md:text-[30px] font-normal leading-tight text-ink">Senarai pemenang</h2>
              <p class="meta mt-1">Keputusan lelongan yang telah tamat. Nama pemenang disembunyikan sebahagian.</p>
            </div>
            <div class="w-full sm:w-80 sm:ml-auto">
              <label class="sr-only" for="q">Cari pemenang</label>
              <div class="relative">${searchIcon}
                <input id="q" type="search" class="input !pl-9" placeholder="Cari item, kategori atau lot (cth: 007)" autocomplete="off">
              </div>
            </div>
          </div>
          <div id="winners" class="mt-6"></div>
        </section>`;
      const q = document.getElementById('q');
      q.value = query;
      q.addEventListener('input', () => { query = q.value; renderWinners(); });
    }

    function renderMine() {
      const el = document.getElementById('mine');
      const user = EB.auth.user();
      if (!user) {
        el.innerHTML = `<div class="tile max-w-xl px-6 py-10 md:px-10">
          <p class="font-serif text-[22px] md:text-[24px] leading-snug text-ink">Log masuk untuk melihat sejarah bidaan dan yuran anda.</p>
          <a href="${U.link('login.html', { next: location.pathname + location.search + location.hash })}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Log masuk</a></div>`;
        return;
      }
      const s = EB.store.get();
      const slug = EB.tenant.slug();
      const bids = s.bids.filter(b => b.userId === user.id && b.tenant === slug).sort((a, b) => b.at - a.at);
      const fees = s.fees.filter(f => f.userId === user.id && f.tenant === slug).sort((a, b) => b.at - a.at);
      const itemOf = id => s.items.find(i => i.id === id) || { id, tenant: slug, title: id, category: '', color: '#ddd' };
      const statusCache = {};
      const stOf = item => (statusCache[item.id] = statusCache[item.id] || myStatus(s, item, user.id));
      const shown = showAllBids ? bids : bids.slice(0, 15);
      const feeSum = fees.reduce((a, f) => a + f.amount, 0);

      const bidTable = bids.length ? `
        <div>
          <div class="pb-3 border-b border-ink flex items-baseline gap-3"><h3 class="text-[18px] text-ink">Bidaan</h3><span class="ml-auto meta"><span class="tabular-nums">${bids.length}</span> rekod</span></div>
          <table class="table open">
            <thead><tr><th>Item</th><th class="!text-right max-sm:!pr-0">Amaun</th><th class="hidden sm:table-cell">Masa</th><th class="hidden sm:table-cell">Status</th></tr></thead>
            <tbody>
              ${shown.map(b => { const it = itemOf(b.itemId); const st = EB.auction.status(it); return `<tr>
                <td class="max-w-0 w-full">
                  <a href="${U.link('item.html', { id: it.id })}" class="block min-w-0 group">
                    <span class="lot">${U.lotNo(it)}</span>
                    <span class="block truncate text-ink group-hover:underline underline-offset-2 decoration-1">${U.esc(it.title)}</span>
                    <span class="block sm:hidden mt-0.5 tabular-nums text-[14px] text-muted">${U.fmtDate(b.at)}</span>
                    <span class="block sm:hidden mt-1">${U.statusBadge(stOf(it))}</span>
                  </a>
                </td>
                <td class="num tabular-nums whitespace-nowrap text-ink align-top sm:align-middle max-sm:!pr-0">${U.money(b.amount)}</td>
                <td class="hidden sm:table-cell tabular-nums text-[14px] text-ink-2 whitespace-nowrap">${U.fmtDate(b.at)}</td>
                <td class="hidden sm:table-cell whitespace-nowrap">${st === 'live' ? U.statusBadge('live') + '<br>' : ''}${U.statusBadge(stOf(it))}</td>
              </tr>`; }).join('')}
            </tbody>
          </table>
          ${bids.length > 15 ? `<div class="pt-2 border-t border-line"><button data-more class="link-arrow min-h-[44px]">${showAllBids ? 'Tunjuk 15 terkini sahaja' : 'Tunjuk semua <span class="tabular-nums">' + bids.length + '</span> bidaan'}</button></div>` : ''}
        </div>`
        : `<div class="tile px-6 py-12 text-center">
            <p class="font-serif text-[22px] md:text-[24px] leading-snug text-ink">Anda belum membida di kedai ini.</p>
            <p class="mt-2 text-[16px] text-muted">Setiap bidaan akan direkodkan di sini.</p>
            <a href="${U.link('shop.html')}" class="btn btn-brand btn-lg mt-6 w-full sm:w-auto">Lihat item lelongan</a>
          </div>`;

      const feeTable = `
        <div class="tile px-5 py-5 sm:px-6 sm:py-6">
          <h3 class="text-[18px] text-ink">Yuran penyertaan</h3>
          ${fees.length ? `<table class="table open mt-2">
              <thead><tr><th>Rujukan</th><th class="!text-right">Amaun</th></tr></thead>
              <tbody>${fees.map(f => { const it = itemOf(f.itemId); return `<tr>
                <td class="max-w-0 w-full"><span class="block tabular-nums text-[15px] text-ink">${U.esc(f.ref)}</span><span class="block meta truncate">${U.esc(it.title)}</span><span class="block tabular-nums text-[14px] text-muted">${U.fmtDate(f.at)}</span></td>
                <td class="num tabular-nums whitespace-nowrap text-ink align-top">${U.money(f.amount)}</td></tr>`; }).join('')}
              </tbody>
              <tfoot><tr><td class="text-ink" style="border-top:1px solid var(--line-strong)">Jumlah</td><td class="num price text-[20px] text-ink whitespace-nowrap" style="border-top:1px solid var(--line-strong)">${U.money(feeSum)}</td></tr></tfoot>
            </table>`
            : `<p class="mt-3 meta">Tiada yuran dibayar di kedai ini.</p>`}
          <p class="mt-3 pt-3 border-t meta" style="border-color:color-mix(in srgb, var(--ink) 12%, var(--tile))">Yuran dibayar sekali bagi setiap item melalui Bayarcash dan tidak dikembalikan.</p>
        </div>`;

      el.innerHTML = `<div class="grid lg:grid-cols-[minmax(0,1fr)_340px] gap-8 lg:gap-12 items-start"><div class="min-w-0">${bidTable}</div>${feeTable}</div>`;
      const more = el.querySelector('[data-more]');
      if (more) more.onclick = () => { showAllBids = !showAllBids; renderMine(); };
    }

    function renderWinners() {
      const el = document.getElementById('winners');
      const s = EB.store.get();
      const slug = EB.tenant.slug();
      const uid = EB.auth.userId();
      const q = query.trim().toLowerCase();
      const ended = s.items.filter(i => i.tenant === slug && i.result).sort((a, b) => (b.result.closedAt || b.endAt) - (a.result.closedAt || a.endAt));
      const list = ended.filter(i => !q || [i.title, i.category, i.id, U.lotNo(i), i.result.winnerId ? U.maskName(EB.users.byId(i.result.winnerId).name) : ''].join(' ').toLowerCase().includes(q));
      if (!ended.length) {
        el.innerHTML = `<div class="tile px-6 py-12 text-center">
          <p class="font-serif text-[22px] md:text-[24px] leading-snug text-ink">Belum ada lelongan yang tamat di kedai ini.</p>
          <a href="${U.link('shop.html')}" class="link-arrow mt-4 min-h-[44px]">Lihat lelongan semasa</a></div>`;
        return;
      }
      if (!list.length) {
        el.innerHTML = `<div class="tile px-6 py-12 text-center">
          <p class="font-serif text-[22px] md:text-[24px] leading-snug text-ink break-words">Tiada keputusan sepadan dengan "${U.esc(query)}".</p>
          <button data-clear class="btn btn-outline mt-6 w-full sm:w-auto">Kosongkan carian</button></div>`;
        el.querySelector('[data-clear]').onclick = () => { query = ''; const qi = document.getElementById('q'); qi.value = ''; qi.focus(); renderWinners(); };
        return;
      }
      el.innerHTML = `<div class="border-t border-ink">
        <table class="table open">
          <thead><tr><th>Item</th><th class="hidden sm:table-cell">Pemenang</th><th class="!text-right max-md:!pr-0">Harga menang</th><th class="hidden md:table-cell !text-right">Tarikh tutup</th></tr></thead>
          <tbody>
          ${list.map(i => {
            const w = i.result.winnerId;
            const me = w && w === uid;
            const name = w ? U.maskName(EB.users.byId(w).name) : null;
            const second = s.orders.some(o => o.itemId === i.id && o.note === 'Tawaran kedua' && o.userId === w);
            const who = w
              ? `<span class="text-[15px] text-ink">${U.esc(name)}</span>${me ? ' <span class="ml-1 text-[14px] text-[var(--ok)]">Anda</span>' : ''}${second ? '<span class="block meta">Tawaran kedua</span>' : ''}`
              : '<span class="meta">Tiada pemenang</span>';
            return `<tr>
              <td class="max-w-0 w-full ${me ? 'mine' : ''}">
                <a href="${U.link('item.html', { id: i.id })}" class="flex items-center gap-3 min-w-0 group">
                  <img src="${U.itemImage(i)}" alt="" class="h-[60px] w-12 rounded-lg object-cover bg-tile shrink-0">
                  <span class="min-w-0">
                    <span class="lot">${U.lotNo(i)}</span>
                    <span class="block line-clamp-2 text-ink group-hover:underline underline-offset-2 decoration-1">${U.esc(i.title)}</span>
                    <span class="block sm:hidden mt-0.5">${who}</span>
                    <span class="block md:hidden mt-0.5 tabular-nums text-[14px] text-muted">${U.fmtDate(i.result.closedAt || i.endAt)}</span>
                  </span>
                </a>
              </td>
              <td class="hidden sm:table-cell whitespace-nowrap">${who}</td>
              <td class="num tabular-nums whitespace-nowrap text-ink max-md:!pr-0">${w ? U.money(i.result.amount) : '<span class="text-muted">-</span>'}</td>
              <td class="hidden md:table-cell num tabular-nums text-[14px] text-ink-2 whitespace-nowrap">${U.fmtDate(i.result.closedAt || i.endAt)}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        <p class="py-3 border-t border-line meta"><span class="tabular-nums">${list.length}</span> daripada <span class="tabular-nums">${ended.length}</span> keputusan</p>
      </div>`;
    }

    function render() { renderMine(); renderWinners(); }

    skeleton();
    render();
    EB.store.subscribe(render);
    // scroll to #sejarah / #pemenang on load
    if (location.hash) {
      const target = document.querySelector(location.hash);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    }
  </script>
</body>
</html>
